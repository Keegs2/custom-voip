# RCF-V1 Production — Media Server VM (FreeSWITCH + Redis)
# Deploy: docker compose -f docker-compose.media.yml up -d
#
# Runs on: VM2 (FreeSWITCH media server)
# FreeSWITCH uses host networking for SIP/RTP performance.
# Redis runs on a bridge network with port 6379 exposed to the host so
# FreeSWITCH (on host network) reaches it at 127.0.0.1:6379.
#
# Prerequisites:
#   - Copy .env.media.example to .env and fill in all REQUIRED values
#   - Ensure firewall allows: 5060-5090/udp+tcp (SIP), 8021/tcp (ESL),
#     16384-49151/udp (RTP), 6379/tcp (Redis — internal only)

services:
  freeswitch:
    build: ./docker/freeswitch
    container_name: voip-freeswitch
    network_mode: host
    environment:
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP}
      - EXTERNAL_RTP_IP=${EXTERNAL_RTP_IP}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-6432}
      - DB_NAME=${DB_NAME:-voip}
      - DB_USER=${DB_USER:-freeswitch}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT:-8000}
      - HOMER_IP=${HOMER_IP}
      # HEP capture_id for Homer ladder zone differentiation (East FS=200, West=210, Central=220)
      - HEP_CAPTURE_ID=${HEP_CAPTURE_ID:-200}
      - SBC_PROXY_IP=${SBC_PROXY_IP}
      - SBC_PROXY_IP_FAILOVER=${SBC_PROXY_IP_FAILOVER:-${SBC_PROXY_IP}}
      - ESL_PASSWORD=${ESL_PASSWORD}
      - TEST_MODE=${TEST_MODE:-false}
      # --- UCaaS / unified image (Phase 1-8) ---------------------------------
      # SEC-2: shared secret FS sends as X-Ingest-Secret on the multipart
      # recording/voicemail uploads (lib/rec_notify.lua, lib/vm_notify.lua).
      # MUST match the Services VM API's INGEST_SHARED_SECRET.
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET}
      # <Say> TTS engine. Default = Piper (mod_tts_commandline); set TTS_ENGINE=flite
      # to use the built-in flite fallback. Pluggable with no code change.
      - TTS_ENGINE=${TTS_ENGINE:-tts_commandline}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-slt}
      # api_voice.lua webhook/action HTTP knobs (have safe defaults).
      - WEBHOOK_HTTP_TIMEOUT=${WEBHOOK_HTTP_TIMEOUT:-5}
      - WEBHOOK_MAX_ATTEMPTS=${WEBHOOK_MAX_ATTEMPTS:-3}
      - WEBHOOK_BACKOFF_MS=${WEBHOOK_BACKOFF_MS:-200}
      # Dev-only: permit non-HTTPS webhook URLs. Leave false in production.
      - WEBHOOK_ALLOW_HTTP=${WEBHOOK_ALLOW_HTTP:-false}
      # mod_verto WSS TLS — combined cert+privkey PEM and cert/CA chain. Mount a
      # CA-issued cert at /usr/local/freeswitch/conf/tls and point these at it.
      - VERTO_TLS_PEM=${VERTO_TLS_PEM:-/usr/local/freeswitch/conf/tls/wss.pem}
      - VERTO_TLS_CHAIN=${VERTO_TLS_CHAIN:-/usr/local/freeswitch/conf/tls/wss.crt}
      # Per-attempt progress timeout (seconds) for SBC/carrier failover loops:
      # fail the attempt only if NO provisional response (180/183) arrives within
      # N seconds (bounds PDD); once ringing starts the call may ring to call_timeout.
      # Default 10 per CLAUDE.md — tune after live testing.
      - BRIDGE_PROGRESS_TIMEOUT=${BRIDGE_PROGRESS_TIMEOUT:-10}
      # --- E911 / Kari's Law / RAY BAUM's Act (scripts/emergency.lua) --------
      # os.getenv() inside mod_lua reads these from the container env, so they
      # MUST be listed here to reach emergency.lua. All are OPTIONAL with safe
      # defaults; unset == today's behavior.
      #
      # EMERGENCY_DEFAULT_CALLBACK: LAST-RESORT callback presented to the PSAP
      # when a line has no per-line/DB callback. It MUST be a REAL DID on our
      # Bandwidth account (carrier From-auth) or the 911 leg can be rejected.
      # Empty by default — SET THIS PER ZONE before taking 911 traffic.
      - EMERGENCY_DEFAULT_CALLBACK=${EMERGENCY_DEFAULT_CALLBACK:-}
      # EMERGENCY_DEFAULT_LOCATION: fallback dispatchable location (Bandwidth
      # by-reference key or civic text) when a line has none. Empty = none.
      - EMERGENCY_DEFAULT_LOCATION=${EMERGENCY_DEFAULT_LOCATION:-}
      # Kari's Law central-notification webhook (fire-and-forget, backgrounded so
      # it can NEVER delay the PSAP bridge). Empty URL = webhook OFF (the CUSTOM
      # emergency::dial ESL event still fires regardless).
      - EMERGENCY_NOTIFY_URL=${EMERGENCY_NOTIFY_URL:-}
      - EMERGENCY_NOTIFY_SECRET=${EMERGENCY_NOTIFY_SECRET:-}
      - EMERGENCY_NOTIFY_TIMEOUT=${EMERGENCY_NOTIFY_TIMEOUT:-5}
      # Overall 911 ring budget (time-to-answer) per attempt. Default 180 MATCHES
      # emergency.lua's own default (unset == byte-identical). Life-safety: do NOT
      # shorten below the script default — a still-ringing PSAP call must not be
      # cancelled. (Values < 30 are ignored by the script and snap back to 180.)
      - EMERGENCY_CALL_TIMEOUT=${EMERGENCY_CALL_TIMEOUT:-180}
      # Per-DID default concurrent-call cap when rcf_numbers.max_channels is
      # 0/unset (handlers/rcf.lua toll-fraud control). Default 30 matches the
      # script default (unset == byte-identical).
      - RCF_DID_MAX_CONCURRENT_DEFAULT=${RCF_DID_MAX_CONCURRENT_DEFAULT:-30}
      # --- Microsoft Teams Direct Routing (DEFAULT-OFF) ---------------------
      # When false, inbound_router.lua NEVER runs the Teams DID lookup and the
      # teams handler is never reached — RCF/API/trunk/UCaaS behavior is
      # byte-identical. MUST match the SBC's TEAMS_DIRECT_ROUTING_ENABLED. Enabling
      # Teams also requires the SBC-side env (TEAMS_SBC_FQDN etc.) + a CA cert +
      # DNS + M365 tenant config — see report.
      - TEAMS_DIRECT_ROUTING_ENABLED=${TEAMS_DIRECT_ROUTING_ENABLED:-false}
      # SRTP mode FS offers toward Teams on the PSTN->Teams B-leg (Teams requires
      # SRTP). Default 'mandatory'; FS offers its supported suites incl.
      # AES_CM_128_HMAC_SHA1_80. Read by handlers/teams.lua.
      - TEAMS_SRTP_MODE=${TEAMS_SRTP_MODE:-mandatory}
    volumes:
      - ./docker/freeswitch/conf:/usr/local/freeswitch/conf
      - ./docker/freeswitch/scripts:/usr/local/freeswitch/scripts
      - freeswitch_logs:/var/log/freeswitch
      # LOCAL scratch: FS writes recordings/voicemail here, then POSTs the FILE
      # (multipart) to the Services VM API over the VPC (PROD-2 — no shared
      # cross-VM volume). The API uploads to GCS. This volume is FS-local only.
      - media_spool:/media/spool
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/freeswitch/bin/fs_cli -p $ESL_PASSWORD -x 'sofia status' 2>/dev/null | grep -q 'RUNNING' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    restart: unless-stopped

  redis:
    build: ./docker/redis
    container_name: voip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - redis-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    sysctls:
      - net.core.somaxconn=65535
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # TURN/STUN (coturn) — co-located on the Media VM because Verto/WebRTC runs on
  # FreeSWITCH here. Relays Verto/WebRTC media for clients behind symmetric NAT.
  # Shares TURN_SECRET/TURN_REALM with the Services VM API (webrtc.py mints
  # time-limited RFC 5766 credentials with the SAME secret). Host networking so
  # the advertised relay candidates use the VM's real public IP.
  #
  # SEC (audit P0-6): coturn cannot read env vars from turnserver.conf, so the
  # entrypoint templates the runtime config from env and REFUSES to start when
  # TURN_SECRET is unset or still the committed dev sentinel. The `:?` below
  # additionally fails the deploy at compose level. Private-range relay peers
  # are denied (VPC pivot protection) and external-ip is advertised for GCE
  # 1:1 NAT. See docker/coturn/entrypoint.sh.
  coturn:
    image: coturn/coturn:4.6.2
    container_name: voip-coturn
    network_mode: host
    entrypoint: ["/bin/sh", "/coturn/entrypoint.sh"]
    command: []
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./docker/coturn/entrypoint.sh:/coturn/entrypoint.sh:ro
      # Mount a CA-issued cert dir here (read-only) to arm turns: (TLS) on 5349.
      # e.g. host /etc/letsencrypt/live/turn.example.com -> /etc/coturn/certs
      - ${TURN_CERT_DIR:-./docker/coturn/certs}:/etc/coturn/certs:ro
    environment:
      - TURN_SECRET=${TURN_SECRET:?TURN_SECRET must be set in /opt/revup/.env (openssl rand -hex 32) and match the Services VM API}
      - TURN_REALM=${TURN_REALM:-voip.local}
      # GCE 1:1 NAT: advertise the VM's PUBLIC IP in relay candidates, else
      # clients get the 192.168.10.x internal address and relayed media dies.
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-${EXTERNAL_SIP_IP}}
      # Deny relaying to RFC1918/loopback/link-local (metadata server included).
      - TURN_DENY_PRIVATE=${TURN_DENY_PRIVATE:-true}
    restart: unless-stopped

networks:
  redis-network:
    driver: bridge

volumes:
  freeswitch_logs:
    driver: local
  redis_data:
    driver: local
  media_spool:
    driver: local
