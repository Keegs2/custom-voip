# RCF-V1 Production — Media Server VM (FreeSWITCH + Redis)
# Deploy: docker compose -f docker-compose.media.yml up -d
#
# Runs on: VM2 (FreeSWITCH media server)
# FreeSWITCH uses host networking for SIP/RTP performance.
# Redis runs on a bridge network with port 6379 exposed to the host so
# FreeSWITCH (on host network) reaches it at 127.0.0.1:6379.
#
# Prerequisites:
#   - Copy .env.media.example to .env and fill in all REQUIRED values
#   - Ensure firewall allows: 5060-5090/udp+tcp (SIP), 8021/tcp (ESL),
#     16384-49151/udp (RTP), 6379/tcp (Redis — internal only)

services:
  freeswitch:
    build: ./docker/freeswitch
    container_name: voip-freeswitch
    network_mode: host
    environment:
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP}
      - EXTERNAL_RTP_IP=${EXTERNAL_RTP_IP}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-6432}
      - DB_NAME=${DB_NAME:-voip}
      - DB_USER=${DB_USER:-freeswitch}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT:-8000}
      - HOMER_IP=${HOMER_IP}
      # HEP capture_id for Homer ladder zone differentiation (East FS=200, West=210, Central=220)
      - HEP_CAPTURE_ID=${HEP_CAPTURE_ID:-200}
      - SBC_PROXY_IP=${SBC_PROXY_IP}
      - SBC_PROXY_IP_FAILOVER=${SBC_PROXY_IP_FAILOVER:-${SBC_PROXY_IP}}
      - ESL_PASSWORD=${ESL_PASSWORD}
      - TEST_MODE=${TEST_MODE:-false}
      # Per-attempt progress timeout (seconds) for SBC/carrier failover loops:
      # fail the attempt only if NO provisional response (180/183) arrives within
      # N seconds (bounds PDD); once ringing starts the call may ring to call_timeout.
      # Default 10 per CLAUDE.md — tune after live testing.
      - BRIDGE_PROGRESS_TIMEOUT=${BRIDGE_PROGRESS_TIMEOUT:-10}
    volumes:
      - ./docker/freeswitch/conf:/usr/local/freeswitch/conf
      - ./docker/freeswitch/scripts:/usr/local/freeswitch/scripts
      - freeswitch_logs:/var/log/freeswitch
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/freeswitch/bin/fs_cli -p $ESL_PASSWORD -x 'sofia status' 2>/dev/null | grep -q 'RUNNING' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # revup-ops-agent — READ-ONLY NOC command API for the FreeSWITCH (media) VM.
  #
  # Same image as the SBC carrier-monitor. On this VM it serves the FS role of the
  # command API (FreeSWITCH ESL reads: sofia status, show channels/calls,
  # uuid_dump, status) plus the host.* commands (docker ps/logs, git head,
  # journalctl). The carrier POLLER is a no-op here (no Kamailio ctl socket, so
  # CARRIER_STATUS_URL is intentionally left unset — the poller just logs "missing
  # config" every heartbeat and never crashes); the command API is the point.
  #
  # HOST NETWORKING (required): FreeSWITCH is host-networked and its Event Socket
  # binds 0.0.0.0:8021 with an ACL allowing loopback/RFC1918. A bridge container
  # cannot reach host-net FS on 127.0.0.1 (see the "Docker Desktop FS<->API
  # isolation" lesson). Host-net puts the agent in FS's netns so ESL is reachable
  # at 127.0.0.1:8021, and the command API binds directly on the VM's 8710.
  #
  # SECURITY: OPS_AGENT_PORT (8710) is VPC-internal ONLY. The OPERATOR MUST add a
  # firewall rule allowing tcp:8710 from just the console host(s). Fail-closed
  # bearer auth (OPS_AGENT_TOKEN) gates every /run; unset => all /run are 401.
  # ---------------------------------------------------------------------------
  ops-agent:
    build: ./docker/carrier-monitor
    image: voip-ops-agent:latest
    container_name: voip-ops-agent
    network_mode: host
    depends_on:
      - freeswitch
    environment:
      # Force the FS role: this VM has no Kamailio ctl socket, and we do NOT want
      # a TCP ESL probe at import time deciding the role — explicit is robust.
      - OPS_AGENT_ROLE=${OPS_AGENT_ROLE:-fs}
      # Local FreeSWITCH Event Socket (loopback of the shared host netns).
      - ESL_HOST=${OPS_AGENT_ESL_HOST:-127.0.0.1}
      - ESL_PORT=${OPS_AGENT_ESL_PORT:-8021}
      # ESL password — MUST match the FreeSWITCH service's ESL_PASSWORD above.
      - ESL_PASSWORD=${ESL_PASSWORD}
      # Command API bearer token (fail-closed) + port.
      - OPS_AGENT_TOKEN=${OPS_AGENT_TOKEN}
      - OPS_AGENT_PORT=${OPS_AGENT_PORT:-8710}
      # Carrier poller: no Kamailio here, so leave CARRIER_STATUS_URL unset. The
      # poller logs "missing config" and idles; it never crashes. (Set it only if
      # you ever co-locate Kamailio on this VM.)
      - CARRIER_STATUS_URL=${CARRIER_STATUS_URL:-}
      - CARRIER_STATUS_TOKEN=${CARRIER_STATUS_TOKEN:-}
    volumes:
      # Host Docker socket (READ-ONLY) for host.docker_ps / host.docker_logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Repo checkout (READ-ONLY) for host.git_head.
      - /opt/revup:/opt/revup:ro
      # Host journal (READ-ONLY, best-effort) for host.journalctl.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    restart: unless-stopped

  redis:
    build: ./docker/redis
    container_name: voip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - redis-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    sysctls:
      - net.core.somaxconn=65535
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  redis-network:
    driver: bridge

volumes:
  freeswitch_logs:
    driver: local
  redis_data:
    driver: local
