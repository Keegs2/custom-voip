# RCF-V1 Production — Services VM (API + UI + Homer 10)
# Deploy: docker compose -f docker-compose.services.yml up -d
#
# Runs on: VM3 (application services)
# All services use a shared bridge network. PostgreSQL for the main voip
# database runs bare on this VM (NOT in Docker) — accessed via PgBouncer
# on 127.0.0.1:6432. Homer 10 uses ClickHouse + qryn + Grafana for SIP
# capture storage and visualization (replaces Homer 7's Postgres + homer-app).
#
# Prerequisites:
#   - Copy .env.services.example to .env and fill in all REQUIRED values
#   - PostgreSQL + PgBouncer running bare on this VM (port 6432)
#   - Firewall (verify with scripts/verify_gcp_security.sh):
#       8080/8443 (UI) + 8088 (API): office CIDRs + Google uptime probers ONLY
#       9060/udp+tcp, 9061/tcp (HEP): VPC-internal ONLY (SBC/media VMs) — also
#         bind-limited via HEP_BIND_IP below (set it to this VM's VPC IP)
#       3000 (Grafana), 3100 (qryn): NOT internet-reachable — published on
#         127.0.0.1 only (below); the UI proxies /grafana/ internally and the
#         API reaches qryn/ClickHouse by service DNS. Operators use an IAP
#         SSH tunnel for direct access.

services:
  # FastAPI — RCF provisioning, CDR queries, health endpoints
  # Connects to bare-metal PostgreSQL via PgBouncer at 127.0.0.1:6432
  api:
    build: ./docker/api
    container_name: voip-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://api:api_secret@host.docker.internal:6432/voip}
      # Shared DID inventory (Phases 2-3). On prod, INVENTORY_READ_URL is normally
      # empty so inventory reads stay on the local primary (this box IS the source
      # of truth); empty -> falls back to DATABASE_URL. DEPLOY_ENV=prod drives the
      # routing reconciliation guard (rejects configuring a DID the shared
      # inventory has allocated to a different environment).
      - INVENTORY_READ_URL=${INVENTORY_READ_URL:-}
      - DEPLOY_ENV=${DEPLOY_ENV:-prod}
      - INVENTORY_GUARD_ENFORCE=${INVENTORY_GUARD_ENFORCE:-true}
      - REDIS_URL=${REDIS_URL}
      - FREESWITCH_ESL_HOST=${FREESWITCH_ESL_HOST}
      - FREESWITCH_ESL_PORT=${FREESWITCH_ESL_PORT:-8021}
      - FREESWITCH_ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SBC_PROXY_IP=${SBC_PROXY_IP}
      - BANDWIDTH_API_CLIENT_ID=${BANDWIDTH_API_CLIENT_ID:-}
      - BANDWIDTH_API_CLIENT_SECRET=${BANDWIDTH_API_CLIENT_SECRET:-}
      - BANDWIDTH_ACCOUNT_ID=${BANDWIDTH_ACCOUNT_ID:-9900717}
      - BANDWIDTH_SIP_PEER_ID=${BANDWIDTH_SIP_PEER_ID:-1162116}
      - TEST_MODE=${TEST_MODE:-false}
      - ENABLE_DOCS=${ENABLE_DOCS:-true}
      # PROD-4: ENV=production makes the API fail-fast on dev-default secrets
      # (TURN_SECRET / STORAGE_SECRET_KEY / INGEST_SHARED_SECRET). Keep this set.
      - ENV=${ENV:-production}
      # SEC-2: shared secret FreeSWITCH sends as X-Ingest-Secret on CDR/recording/
      # voicemail ingest. MUST match the Media VM FS INGEST_SHARED_SECRET.
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET}
      # --- Object storage: GCS via the S3-interop endpoint (NO MinIO in prod) ---
      # boto3 is endpoint-agnostic. STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY are GCS
      # HMAC keys. GCS requires path-style addressing (STORAGE_FORCE_PATH_STYLE=true).
      - STORAGE_ENDPOINT_URL=${STORAGE_ENDPOINT_URL:-https://storage.googleapis.com}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_REGION=${STORAGE_REGION:-us-east1}
      - STORAGE_FORCE_PATH_STYLE=${STORAGE_FORCE_PATH_STYLE:-true}
      - STORAGE_BUCKET_RECORDINGS=${STORAGE_BUCKET_RECORDINGS:-voip-recordings}
      - STORAGE_BUCKET_VOICEMAIL=${STORAGE_BUCKET_VOICEMAIL:-voip-voicemail}
      - STORAGE_BUCKET_UPLOADS=${STORAGE_BUCKET_UPLOADS:-voip-uploads}
      # --- TURN/STUN — coturn lives on the Media VM; webrtc.py mints creds -------
      # TURN_HOST = Media VM PUBLIC IP. TURN_SECRET/REALM MUST match coturn there.
      - TURN_HOST=${TURN_HOST}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_TLS_PORT=${TURN_TLS_PORT:-5349}
      - TURN_SECRET=${TURN_SECRET}
      - TURN_REALM=${TURN_REALM:-voip.local}
      # Media ingest caps (recording/voicemail/stream guards). Safe defaults.
      - MEDIA_MAX_BYTES=${MEDIA_MAX_BYTES:-104857600}
      - MEDIA_MAX_FRAMES=${MEDIA_MAX_FRAMES:-2000000}
      - MEDIA_MAX_DURATION_MS=${MEDIA_MAX_DURATION_MS:-14400000}
      - MEDIA_MAX_CONCURRENT_STREAMS=${MEDIA_MAX_CONCURRENT_STREAMS:-200}
      # === Leapfrog: compliance-as-product — encryption at rest ================
      # Envelope encryption for recordings + chat reuses the voicemail KMS/KEK
      # model. Default provider 'local' wraps DEKs with an env KEK; set a strong
      # ENVELOPE_LOCAL_KEK (Fernet key, comma-separated for rotation). Encryption
      # of NEW recordings/chat is OFF by default so already-stored plaintext keeps
      # serving; flip to 'true' to seal new writes (mixed state handled).
      - RECORDINGS_ENCRYPTION=${RECORDINGS_ENCRYPTION:-false}
      - CHAT_ENCRYPTION=${CHAT_ENCRYPTION:-false}
      - ENVELOPE_LOCAL_KEK=${ENVELOPE_LOCAL_KEK:-}
      - RECORDING_PLAYBACK_TTL=${RECORDING_PLAYBACK_TTL:-3600}
      # === Leapfrog: in-boundary AI voice agents ==============================
      # OFF by default. When enabled, providers default to SELF-HOSTED base URLs
      # (no PHI/CPNI leaves the VPC); point *_BASE_URL at in-VPC vLLM/Whisper/Piper
      # or set a cloud provider + *_API_KEY to explicitly opt out of in-boundary.
      # AI_WS_PUBLIC_BASE = ws://<services-vm-vpc-ip>:8000 (what FS mod_audio_stream dials).
      - AI_AGENTS_ENABLED=${AI_AGENTS_ENABLED:-false}
      - AI_WS_PUBLIC_BASE=${AI_WS_PUBLIC_BASE:-ws://127.0.0.1:8000}
      - AI_STT_PROVIDER=${AI_STT_PROVIDER:-whisper_http}
      - AI_STT_BASE_URL=${AI_STT_BASE_URL:-}
      - AI_LLM_PROVIDER=${AI_LLM_PROVIDER:-openai_compat}
      - AI_LLM_BASE_URL=${AI_LLM_BASE_URL:-}
      - AI_LLM_MODEL=${AI_LLM_MODEL:-}
      - AI_TTS_PROVIDER=${AI_TTS_PROVIDER:-piper}
      - AI_TTS_BASE_URL=${AI_TTS_BASE_URL:-}
      # Cloud provider keys — only needed if an agent selects a cloud provider.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # === Leapfrog: toll-free / RespOrg ======================================
      # Live Somos/800 CR submission adapter — OFF by default (records local intent).
      - SOMOS_CR_ENABLED=${SOMOS_CR_ENABLED:-false}
      # === Payments DEMO (§9) — exec-facing simulation of all rails ============
      # OFF by default: every /v1/payments/* route 404s and the provider factory
      # returns Noop. Set PAYMENTS_DEMO_MODE=true to enable the demo (simulation
      # providers + demo router, feeding the REAL ledger). Swap to live rails by
      # leaving this false and supplying real Stripe/CDP keys in a later wave.
      - PAYMENTS_DEMO_MODE=${PAYMENTS_DEMO_MODE:-false}
      - PAYMENTS_DEMO_LATENCY_MS=${PAYMENTS_DEMO_LATENCY_MS:-300}
      - PAYMENTS_DEMO_DEFAULT_OUTCOME=${PAYMENTS_DEMO_DEFAULT_OUTCOME:-success}
      - AUTO_RECHARGE_MAX_FAILURES=${AUTO_RECHARGE_MAX_FAILURES:-3}
    ports:
      - "8088:8000"
    networks:
      - services-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      # NOTE: the runtime image has NO curl (python:3.12-slim + libffi8 only) —
      # a curl-based probe fails on exec, marking the container permanently
      # unhealthy regardless of app state. Probe with the image's own Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Nginx — serves React SPA + Homer UI, reverse-proxies to API
  ui:
    build: ./docker/ui
    container_name: voip-ui
    depends_on:
      - api
    environment:
      # Verto WSS endpoint the SPA connects to for the WebRTC softphone/conference.
      # Points at mod_verto on the Media VM (FreeSWITCH), e.g. wss://<media-vm>:8082.
      - VERTO_WS_URL=${VERTO_WS_URL}
      # nginx /ws/verto/ upstream (templated into the conf by the UI entrypoint).
      # mod_verto runs on the Media VM (FreeSWITCH), NOT the SBC — default to the
      # fs-media-v2 VPC IP. Override VERTO_PROXY_TARGET per-zone in the services-VM
      # .env (each zone's media VM IP:8082).
      - VERTO_PROXY_TARGET=${VERTO_PROXY_TARGET:-192.168.10.2:8082}
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - services-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

  # ClickHouse — columnar database for SIP capture data (replaces Homer 7 Postgres)
  clickhouse-server:
    image: clickhouse/clickhouse-server:23.3-alpine
    container_name: voip-clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/homer/clickhouse-users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    networks:
      - services-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # qryn — Loki-compatible API backed by ClickHouse (replaces homer-app backend)
  qryn:
    # Pinned to the multi-arch (amd64+arm64) digest validated on the test box,
    # matching the previously-floating :latest. Bump deliberately, not by drift.
    image: qxip/qryn@sha256:77acc9c7a9fd98954e42b10c837f8849bae8a0c647b8233b40cf59f606cf6f0e
    container_name: voip-qryn
    environment:
      - CLICKHOUSE_SERVER=clickhouse-server
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=qryn
      - "CLICKHOUSE_AUTH=default:"
      - "NODE_OPTIONS=--max-old-space-size=4096"
    # SEC (audit P0-6): loopback-only publish — qryn has NO auth of its own.
    # In-cluster consumers (API homer.py, heplify, Grafana) use service DNS
    # (http://qryn:3100), which does not touch this host port. Operators:
    # IAP SSH tunnel. Override QRYN_BIND_IP only for a trusted-LAN dev box.
    ports:
      - "${QRYN_BIND_IP:-127.0.0.1}:3100:3100"
    depends_on:
      clickhouse-server:
        condition: service_healthy
    networks:
      - services-network
    restart: unless-stopped

  # Heplify Server — receives HEP packets from Kamailio/FreeSWITCH, pushes to qryn
  heplify-server:
    # Pinned (was untagged :latest — silent-upgrade drift risk on every pull).
    # 1.60.3 is the current upstream release (2026-05-12) and contains the
    # LOKIALLOWOUTOFORDER option required below (remotelog/loki.go).
    image: ghcr.io/sipcapture/heplify-server:1.60.3
    container_name: voip-heplify-server
    # SEC (audit P0-6): HEP ingest must be reachable from the SBC/media VMs
    # over the VPC but never from the internet. Defense in depth: set
    # HEP_BIND_IP to this VM's VPC IP (10.142.0.103) in /opt/revup/.env so the
    # host doesn't even listen on the external interface; the firewall rule is
    # verified by scripts/verify_gcp_security.sh. 9096 (Prometheus metrics) is
    # loopback-only for the Ops Agent scrape (scripts/monitoring/).
    ports:
      - "${HEP_BIND_IP:-0.0.0.0}:9060:9060"
      - "${HEP_BIND_IP:-0.0.0.0}:9060:9060/udp"
      - "${HEP_BIND_IP:-0.0.0.0}:9061:9061/tcp"
      - "127.0.0.1:9096:9096"
    environment:
      - "HEPLIFYSERVER_HEPADDR=0.0.0.0:9060"
      - "HEPLIFYSERVER_HEPTCPADDR=0.0.0.0:9061"
      - "HEPLIFYSERVER_DBSHEMA=mock"
      - "HEPLIFYSERVER_DBDRIVER=mock"
      - "HEPLIFYSERVER_LOKIURL=http://qryn:3100/loki/api/v1/push"
      - "HEPLIFYSERVER_PROMADDR=0.0.0.0:9096"
      - "HEPLIFYSERVER_LOKITIMER=1"
      - "HEPLIFYSERVER_LOKIIPPORTLABELS=true"
      - "HEPLIFYSERVER_ALEGIDS=X-CID"
      - "HEPLIFYSERVER_LOGLVL=info"
      - "HEPLIFYSERVER_LOGSTD=true"
      - "HEPLIFYSERVER_DEDUP=false"
      - "HEPLIFYSERVER_LOKIFROMTOLABELS=true"
      - "HEPLIFYSERVER_LOKICALLIDLABELS=true"
      - "HEPLIFYSERVER_FORCEALEGID=false"
      - "HEPLIFYSERVER_LOKIBULK=200"
      # CRITICAL — preserve HEP capture timestamps. heplify-server's Loki
      # output (remotelog/loki.go) keeps a single global lastPktTime and,
      # when AllowOutOfOrder is false (default), REPLACES the timestamp of
      # any packet that arrives out of timestamp order with time.Now():
      #     if lastPktTime.After(curPktTime) { curPktTime = time.Now() }
      # That guard exists for genuine Grafana Loki (which used to reject
      # out-of-order pushes). Our backend is qryn/ClickHouse, which accepts
      # out-of-order writes natively, so the guard only corrupts data: one
      # late/reordered HEP packet (e.g. a fragmented ~2KB INVITE) poisons
      # lastPktTime and cascades ingest-time stamps (full-ns entropy,
      # 15-20ms late) onto subsequent in-time packets — the "INVITE sorts
      # after its own 100 Trying" SIP-ladder corruption.
      - "HEPLIFYSERVER_LOKIALLOWOUTOFORDER=true"
      - "HEPLIFYSERVER_SCRIPTENABLE=true"
      - "HEPLIFYSERVER_SCRIPTFOLDER=/scripts"
    volumes:
      - ./docker/homer/scripts:/scripts:ro
    depends_on:
      clickhouse-server:
        condition: service_healthy
    networks:
      - services-network
    restart: unless-stopped

  # Grafana — SIP trace visualization and dashboards (replaces homer-app Angular UI)
  # SEC (audit P0-6): admin password is REQUIRED (was defaulting to the
  # well-known "sipcapture" with anonymous viewer on). Anonymous access is off
  # by default; the primary SIP-debug UI is the native Troubleshooting page
  # (React -> API -> qryn), which is unaffected. Grafana deep-links now prompt
  # for login — use admin + GRAFANA_ADMIN_PASSWORD.
  grafana:
    image: grafana/grafana-oss:10.4.3
    container_name: voip-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in /opt/revup/.env (openssl rand -hex 16)}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=qxip-flow-panel
      - "GF_INSTALL_PLUGINS=https://github.com/metrico/grafana-flow/releases/download/v10.0.10/qxip-flow-panel-10.0.10.zip;qxip-flow-panel"
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    # Loopback-only publish; reach Grafana via the UI's /grafana/ proxy (8443)
    # or an IAP SSH tunnel. The UI container proxies to grafana:3000 by service
    # DNS, which does not use this host port.
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/homer/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/homer/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - qryn
    networks:
      - services-network
    restart: unless-stopped

networks:
  services-network:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
  grafana_data:
    driver: local
