# RCF-V1 Production — Services VM (API + UI + Homer 10)
# Deploy: docker compose -f docker-compose.services.yml up -d
#
# Runs on: VM3 (application services)
# All services use a shared bridge network. PostgreSQL for the main voip
# database runs bare on this VM (NOT in Docker) — accessed via PgBouncer
# on 127.0.0.1:6432. Homer 10 uses ClickHouse + qryn + Grafana for SIP
# capture storage and visualization (replaces Homer 7's Postgres + homer-app).
#
# Prerequisites:
#   - Copy .env.services.example to .env and fill in all REQUIRED values
#   - PostgreSQL + PgBouncer running bare on this VM (port 6432)
#   - Ensure firewall allows: 8080/tcp (UI HTTP), 8443/tcp (UI HTTPS),
#     8088/tcp (API), 9060/udp+tcp (HEP), 9061/tcp (HEP TCP),
#     3000/tcp (Grafana), 3100/tcp (qryn/Loki API)

services:
  # FastAPI — RCF provisioning, CDR queries, health endpoints
  # Connects to bare-metal PostgreSQL via PgBouncer at 127.0.0.1:6432
  api:
    build: ./docker/api
    image: voip-api:latest
    container_name: voip-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://api:api_secret@host.docker.internal:6432/voip}
      - REDIS_URL=${REDIS_URL}
      - FREESWITCH_ESL_HOST=${FREESWITCH_ESL_HOST}
      - FREESWITCH_ESL_PORT=${FREESWITCH_ESL_PORT:-8021}
      - FREESWITCH_ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SBC_PROXY_IP=${SBC_PROXY_IP}
      - BANDWIDTH_API_CLIENT_ID=${BANDWIDTH_API_CLIENT_ID:-}
      - BANDWIDTH_API_CLIENT_SECRET=${BANDWIDTH_API_CLIENT_SECRET:-}
      - BANDWIDTH_ACCOUNT_ID=${BANDWIDTH_ACCOUNT_ID:-9900717}
      - BANDWIDTH_SIP_PEER_ID=${BANDWIDTH_SIP_PEER_ID:-1162116}
      - TEST_MODE=${TEST_MODE:-false}
      - ENABLE_DOCS=${ENABLE_DOCS:-true}
    ports:
      - "8088:8000"
    networks:
      - services-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      # NOTE: the runtime image has NO curl (python:3.12-slim + libffi8 only) —
      # a curl-based probe fails on exec, marking the container permanently
      # unhealthy regardless of app state. Probe with the image's own Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # CDR Export Forwarder — OPT-IN scheduled runner (Equinox → FileMage FTP).
  # Reuses the API image (built by the `api` service above) and runs the export
  # loop. Gated behind the `cdr-export` profile, so it does NOT start with a
  # plain `up -d`. Enable with:
  #   docker compose -f docker-compose.services.yml --profile cdr-export up -d cdr-exporter
  # Requires CDR_EXPORT_* in .env (incl. CDR_EXPORT_ENABLED=true) — otherwise
  # run-loop idle-exits by design. See docker/api/src/services/cdr_export/README.md.
  cdr-exporter:
    build: ./docker/api
    image: voip-api:latest
    container_name: voip-cdr-exporter
    profiles: ["cdr-export"]
    command: ["python", "-m", "services.cdr_export", "run-loop"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Same DB access as the api service (PgBouncer via host-gateway).
      - DATABASE_URL=${DATABASE_URL:-postgresql://api:api_secret@host.docker.internal:6432/voip}
      # CDR export configuration (all optional; defaults in config.py).
      - CDR_EXPORT_ENABLED=${CDR_EXPORT_ENABLED:-false}
      - CDR_EXPORT_FTP_HOST=${CDR_EXPORT_FTP_HOST:-10.142.0.71}
      - CDR_EXPORT_FTP_PORT=${CDR_EXPORT_FTP_PORT:-21}
      - CDR_EXPORT_FTP_USER=${CDR_EXPORT_FTP_USER:-}
      - CDR_EXPORT_FTP_PASSWORD=${CDR_EXPORT_FTP_PASSWORD:-}
      - CDR_EXPORT_FTP_DIR=${CDR_EXPORT_FTP_DIR:-/}
      - CDR_EXPORT_FTP_PASSIVE=${CDR_EXPORT_FTP_PASSIVE:-true}
      - CDR_EXPORT_FTP_TLS=${CDR_EXPORT_FTP_TLS:-false}
      - CDR_EXPORT_FTP_TIMEOUT=${CDR_EXPORT_FTP_TIMEOUT:-30}
      - CDR_EXPORT_BATCH_SIZE=${CDR_EXPORT_BATCH_SIZE:-5000}
      - CDR_EXPORT_LAG_SECONDS=${CDR_EXPORT_LAG_SECONDS:-120}
      - CDR_EXPORT_SKIP_EMPTY=${CDR_EXPORT_SKIP_EMPTY:-true}
      - CDR_EXPORT_INTERVAL_SECONDS=${CDR_EXPORT_INTERVAL_SECONDS:-3600}
      - CDR_EXPORT_LOCK_TTL_SECONDS=${CDR_EXPORT_LOCK_TTL_SECONDS:-900}
      - CDR_EXPORT_FILENAME_PREFIX=${CDR_EXPORT_FILENAME_PREFIX:-CDR_}
      - CDR_EXPORT_FILENAME_EXT=${CDR_EXPORT_FILENAME_EXT:-.csv}
      - CDR_EXPORT_FILENAME_TS_FORMAT=${CDR_EXPORT_FILENAME_TS_FORMAT:-%Y%m%d%H%M%S}
    networks:
      - services-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  # Nginx — serves React SPA + Homer UI, reverse-proxies to API
  ui:
    build: ./docker/ui
    container_name: voip-ui
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - services-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

  # ClickHouse — columnar database for SIP capture data (replaces Homer 7 Postgres)
  clickhouse-server:
    image: clickhouse/clickhouse-server:23.3-alpine
    container_name: voip-clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/homer/clickhouse-users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    networks:
      - services-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # qryn — Loki-compatible API backed by ClickHouse (replaces homer-app backend)
  qryn:
    image: qxip/qryn:latest
    container_name: voip-qryn
    environment:
      - CLICKHOUSE_SERVER=clickhouse-server
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=qryn
      - "CLICKHOUSE_AUTH=default:"
      - "NODE_OPTIONS=--max-old-space-size=4096"
    ports:
      - "3100:3100"
    depends_on:
      clickhouse-server:
        condition: service_healthy
    networks:
      - services-network
    restart: unless-stopped

  # Heplify Server — receives HEP packets from Kamailio/FreeSWITCH, pushes to qryn
  heplify-server:
    # Pinned (was untagged :latest — silent-upgrade drift risk on every pull).
    # 1.60.3 is the current upstream release (2026-05-12) and contains the
    # LOKIALLOWOUTOFORDER option required below (remotelog/loki.go).
    image: ghcr.io/sipcapture/heplify-server:1.60.3
    container_name: voip-heplify-server
    ports:
      - "9060:9060"
      - "9060:9060/udp"
      - "9061:9061/tcp"
    environment:
      - "HEPLIFYSERVER_HEPADDR=0.0.0.0:9060"
      - "HEPLIFYSERVER_HEPTCPADDR=0.0.0.0:9061"
      - "HEPLIFYSERVER_DBSHEMA=mock"
      - "HEPLIFYSERVER_DBDRIVER=mock"
      - "HEPLIFYSERVER_LOKIURL=http://qryn:3100/loki/api/v1/push"
      - "HEPLIFYSERVER_PROMADDR=0.0.0.0:9096"
      - "HEPLIFYSERVER_LOKITIMER=1"
      - "HEPLIFYSERVER_LOKIIPPORTLABELS=true"
      - "HEPLIFYSERVER_ALEGIDS=X-CID"
      - "HEPLIFYSERVER_LOGLVL=info"
      - "HEPLIFYSERVER_LOGSTD=true"
      - "HEPLIFYSERVER_DEDUP=false"
      - "HEPLIFYSERVER_LOKIFROMTOLABELS=true"
      - "HEPLIFYSERVER_LOKICALLIDLABELS=true"
      - "HEPLIFYSERVER_FORCEALEGID=false"
      - "HEPLIFYSERVER_LOKIBULK=200"
      # CRITICAL — preserve HEP capture timestamps. heplify-server's Loki
      # output (remotelog/loki.go) keeps a single global lastPktTime and,
      # when AllowOutOfOrder is false (default), REPLACES the timestamp of
      # any packet that arrives out of timestamp order with time.Now():
      #     if lastPktTime.After(curPktTime) { curPktTime = time.Now() }
      # That guard exists for genuine Grafana Loki (which used to reject
      # out-of-order pushes). Our backend is qryn/ClickHouse, which accepts
      # out-of-order writes natively, so the guard only corrupts data: one
      # late/reordered HEP packet (e.g. a fragmented ~2KB INVITE) poisons
      # lastPktTime and cascades ingest-time stamps (full-ns entropy,
      # 15-20ms late) onto subsequent in-time packets — the "INVITE sorts
      # after its own 100 Trying" SIP-ladder corruption.
      - "HEPLIFYSERVER_LOKIALLOWOUTOFORDER=true"
      - "HEPLIFYSERVER_SCRIPTENABLE=true"
      - "HEPLIFYSERVER_SCRIPTFOLDER=/scripts"
    volumes:
      - ./docker/homer/scripts:/scripts:ro
    depends_on:
      clickhouse-server:
        condition: service_healthy
    networks:
      - services-network
    restart: unless-stopped

  # Grafana — SIP trace visualization + Production NOC dashboards
  grafana:
    image: grafana/grafana-oss:10.4.3
    container_name: voip-grafana
    # Reach the bare-metal Postgres on the VM host (voip-cdr-pg datasource →
    # host.docker.internal:5432), same host-gateway trick the `api` service uses
    # for PgBouncer. Grafana is in the bridge network; PG runs on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-sipcapture}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=qxip-flow-panel
      - "GF_INSTALL_PLUGINS=https://github.com/metrico/grafana-flow/releases/download/v10.0.10/qxip-flow-panel-10.0.10.zip;qxip-flow-panel"
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # ---- Production NOC datasource secrets/params (placeholders in .env) ----
      # Read-only Postgres role password (voip-cdr-pg datasource). Operator sets
      # GRAFANA_DB_PASSWORD in /opt/revup/.env; must match the grafana_ro role
      # password (docker/postgres/init/22_grafana_ro.sql).
      - GRAFANA_DB_PASSWORD=${GRAFANA_DB_PASSWORD:-}
      # GCP Monitoring service-account EMAIL (not a secret) for JWT auth. Operator
      # sets GCM_SA_EMAIL in /opt/revup/.env; the SA's key is mounted below.
      - GCM_SA_EMAIL=${GCM_SA_EMAIL:-}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/homer/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/homer/grafana/dashboards:/var/lib/grafana/dashboards
      # GCP Monitoring service-account key (roles/monitoring.viewer). NOT in git.
      # Operator drops the downloaded SA JSON key at ./secrets/gcp-monitoring-sa.json
      # on the services VM; the gcp-monitoring datasource reads it via
      # privateKeyPath (Grafana auto-extracts private_key from a *.json SA key).
      # ro + :Z-free bind; missing file => the GCM datasource simply fails to
      # auth (dashboards using qryn/postgres still work).
      - ./secrets/gcp-monitoring-sa.json:/etc/grafana/gcp/gcp-monitoring-sa.json:ro
    depends_on:
      - qryn
    networks:
      - services-network
    restart: unless-stopped

networks:
  services-network:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
  grafana_data:
    driver: local
