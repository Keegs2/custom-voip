# ============================================================================
# docker-compose.stir-cafile.yml — STIR/SHAKEN inbound VERIFY trust anchor mount
# ============================================================================
# Mounts the STI-PA trusted-ROOT CA bundle (a PUBLIC trust list — NOT a secret
# like the signing key, but still a config artifact delivered out-of-band, never
# in git) READ-ONLY into the Kamailio container at a FIXED path. secsipid's
# `libopt CertCAFile=<that path>` then chains each fetched x5u leaf to a trusted
# STI-CA root when STIR_VERIFY_CERT_MODE has the custom-CA bit (4) set (e.g. 5 or
# 7). Applied by infra/stir/deploy-sbc-verify.sh.
#
# COEXISTS with docker-compose.stir-key.yml (the outbound-signing private-key
# mount). Compose DEEP-MERGES service keys across `-f` overlays, so the two
# `volumes:` lists are UNIONED, not replaced — apply BOTH together:
#
#   docker compose -f docker-compose.sbc.yml \
#                  -f docker-compose.stir-key.yml \
#                  -f docker-compose.stir-cafile.yml up -d kamailio
#
# The verify deploy script assembles exactly that overlay set (key overlay
# included only if present, so verify works whether or not signing is enabled —
# the two features are independently toggleable).
#
# NEVER pass --remove-orphans with this overlay set: the metrics/ops sidecars
# (vmagent, node-exporter, carrier-monitor) are defined ONLY in the base
# docker-compose.sbc.yml, so an `up --remove-orphans` scoped to the base+overlays
# would treat them as orphans and REMOVE the running sidecars. Recreate ONLY the
# `kamailio` service (append the service name to `up -d`).
#
# CONTAINER PATH is fixed at /etc/kamailio/stir/sti-pa-roots.pem and MUST equal
# STIR_VERIFY_CA_FILE in the SBC .env (the script keeps them in lockstep). The
# host source path is env-driven (CA_SRC), defaulting to the operator-delivered
# location; a bind mount whose SOURCE is missing makes Compose refuse to start
# the container, so the script HARD-VALIDATES the bundle exists + parses as PEM
# certificate(s) before it ever enables verify.
# ----------------------------------------------------------------------------
services:
  kamailio:
    volumes:
      # STI-PA trusted-root CA bundle (PUBLIC trust list) — READ-ONLY. Container
      # path MUST match STIR_VERIFY_CA_FILE in .env. CA_SRC defaults to the
      # out-of-band delivery location on the SBC (never committed to git).
      - ${CA_SRC:-/opt/revup/secrets/sti-pa-roots.pem}:/etc/kamailio/stir/sti-pa-roots.pem:ro
