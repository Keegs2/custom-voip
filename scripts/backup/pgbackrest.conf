# =============================================================================
# pgBackRest — production PITR configuration for the services VM
# =============================================================================
# Placement: /etc/pgbackrest/pgbackrest.conf (installed by setup_pgbackrest.sh,
# which also substitutes __BACKUP_BUCKET__ from /etc/revup/backup.env).
#
# Layout produced:
#   gs://<bucket>/pgbackrest/    full (weekly) + differential (daily) backups
#                                + continuously archived WAL => point-in-time
#                                recovery to ANY second since the last full.
#
# Auth: repo1-gcs-key-type=auto uses the VM's attached service account via the
# GCE metadata server — no key file on disk. Requirements (preflight.sh checks
# both): the service account has roles/storage.objectAdmin on the bucket
# (infra/backups grants it), and the VM's access scopes allow storage writes
# (cloud-platform or devstorage.read_write). If the VM is stuck on legacy
# read-only scopes and a scope-change restart is not schedulable, fall back to
# a dedicated key: set repo1-gcs-key-type=service and
# repo1-gcs-key=/etc/pgbackrest/gcs-key.json (mode 0600 postgres:postgres).
#
# Retention: 4 fulls (~4 weeks of PITR window) + diffs between them. WAL is
# expired automatically with its full backup.
# =============================================================================

[global]
repo1-type=gcs
repo1-gcs-bucket=__BACKUP_BUCKET__
repo1-gcs-key-type=auto
repo1-path=/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-bundle=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
delta=y
log-level-console=info
log-level-file=detail

[main]
pg1-path=/var/lib/postgresql/16/main
pg1-port=5432
pg1-socket-path=/var/run/postgresql
