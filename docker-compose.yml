# RCF-V1 Production Voice Platform - Docker Compose Configuration
# Remote Call Forwarding only — no UCaaS, no WebRTC, no UI
#
# Services: PostgreSQL, Redis, FreeSWITCH, Kamailio, FastAPI
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop all services
#
# NOTE: In production, PostgreSQL runs on dedicated VMs (Patroni cluster),
# not in Docker. The postgres service here is for development/testing only.

services:
  # PostgreSQL with TimescaleDB and PgBouncer
  # PRODUCTION: Replace with dedicated Patroni-managed VMs
  postgres:
    build: ./docker/postgres
    container_name: voip-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voip}
      POSTGRES_USER: ${POSTGRES_USER:-voip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voip_secret}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
      - "6432:6432"   # PgBouncer
    networks:
      - voip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voip -d voip"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # Redis - Ephemeral caching (channel counters, velocity tracking, session cache)
  redis:
    build: ./docker/redis
    container_name: voip-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - voip-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    sysctls:
      - net.core.somaxconn=65535
    restart: unless-stopped

  # FreeSWITCH - Core voice switch (RCF call routing + media proxy)
  freeswitch:
    build: ./docker/freeswitch
    container_name: voip-freeswitch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Host networking: production standard for SIP B2BUAs
    # Eliminates Docker NAT overhead for RTP media
    network_mode: host
    environment:
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-voip}
      - DB_USER=${DB_USER:-freeswitch}
      - DB_PASS=${DB_PASS:-fs_secret}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6380}
      - API_HOST=${API_HOST:-127.0.0.1}
      - API_PORT=${API_PORT:-8000}
      - EXTERNAL_RTP_IP=${EXTERNAL_RTP_IP}
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP}
      - HOMER_IP=${HOMER_IP:-127.0.0.1}
      - SBC_PROXY_IP=${SBC_PROXY_IP:-127.0.0.1}
      - TEST_MODE=${TEST_MODE:-false}
      # ESL password env-driven (entrypoint templates event_socket.conf). Dev
      # default is explicit and NOT ClueCon; must match the API's value.
      - ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD:-fs_esl_dev_pw}
    volumes:
      - ./docker/freeswitch/conf:/usr/local/freeswitch/conf
      - ./docker/freeswitch/scripts:/usr/local/freeswitch/scripts
      - freeswitch_logs:/var/log/freeswitch
      - media_spool:/media/spool   # FS writes vm/recordings here; API uploads to object storage
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: -1
        hard: -1
    restart: unless-stopped

  # Kamailio SBC - SIP signaling security, rate limiting, carrier routing
  kamailio:
    build: ./docker/kamailio
    container_name: voip-kamailio
    depends_on:
      - freeswitch
    network_mode: host
    environment:
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP}
      - FREESWITCH_IP=${FREESWITCH_IP:-127.0.0.1}
      - FS_PUBLIC_IP=${FS_PUBLIC_IP:-${EXTERNAL_SIP_IP}}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-freeswitch}
      - DB_PASS=${DB_PASS:-fs_secret}
      - HOMER_IP=${HOMER_IP:-127.0.0.1}
      - HEP_CAPTURE_ID=${HEP_CAPTURE_ID:-100}
      - SBC_ID=${SBC_ID:-east-sbc-1}
    extra_hosts:
      - "freeswitch:127.0.0.1"
    volumes:
      - ./docker/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg.tmpl:ro
      - ./docker/kamailio/dispatcher.list:/etc/kamailio/dispatcher.list.tmpl:ro
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  # FastAPI - REST API for RCF provisioning, CDR queries, health
  api:
    build: ./docker/api
    container_name: voip-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${API_DB_USER:-api}:${API_DB_PASS:-api_secret}@postgres:5432/${DB_NAME:-voip}
      - REDIS_URL=redis://redis:6379
      - FREESWITCH_ESL_HOST=${FREESWITCH_ESL_HOST:-127.0.0.1}
      - FREESWITCH_ESL_PORT=${FREESWITCH_ESL_PORT:-8021}
      # ESL password: explicit dev default, NOT the well-known ClueCon.
      # esl_client.py no longer hardcodes a ClueCon fallback (Phase 4).
      - FREESWITCH_ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD:-fs_esl_dev_pw}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:8443}
      - SBC_PROXY_IP=${SBC_PROXY_IP:-127.0.0.1}
      - TEST_MODE=${TEST_MODE:-false}
      - BANDWIDTH_API_CLIENT_ID=${BANDWIDTH_API_CLIENT_ID:-}
      - BANDWIDTH_API_CLIENT_SECRET=${BANDWIDTH_API_CLIENT_SECRET:-}
      - BANDWIDTH_ACCOUNT_ID=${BANDWIDTH_ACCOUNT_ID:-9900717}
      - BANDWIDTH_SIP_PEER_ID=${BANDWIDTH_SIP_PEER_ID:-1162116}
      # Phase 4 — object storage (S3-compatible; MinIO locally, GCS/S3 in prod)
      - STORAGE_ENDPOINT_URL=${STORAGE_ENDPOINT_URL:-http://minio:9000}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_FORCE_PATH_STYLE=${STORAGE_FORCE_PATH_STYLE:-true}
      - STORAGE_BUCKET_RECORDINGS=${STORAGE_BUCKET_RECORDINGS:-voip-recordings}
      - STORAGE_BUCKET_VOICEMAIL=${STORAGE_BUCKET_VOICEMAIL:-voip-voicemail}
      - STORAGE_BUCKET_UPLOADS=${STORAGE_BUCKET_UPLOADS:-voip-uploads}
      # Phase 4 — TURN/STUN for WebRTC (coturn); webrtc.py mints time-limited creds
      - TURN_HOST=${TURN_HOST:-localhost}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_TLS_PORT=${TURN_TLS_PORT:-5349}
      - TURN_SECRET=${TURN_SECRET:-dev-turn-secret-change-me}
      - TURN_REALM=${TURN_REALM:-voip.local}
    ports:
      - "${API_PORT:-8088}:8000"
    volumes:
      - media_spool:/media/spool   # reads FS-written vm/recordings, uploads to object storage
    networks:
      - voip-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # Web UI — RCF management, customer admin, DID tools
  ui:
    build: ./docker/ui
    container_name: voip-ui
    depends_on:
      - api
    environment:
      # UCaaS (unified): Verto WSS endpoint the SPA connects to for WebRTC
      # softphone/conference. Override per-zone (e.g. ws://<media-vm>:8082).
      # Local dev default points at the FreeSWITCH mod_verto WSS on the host.
      - VERTO_WS_URL=${VERTO_WS_URL:-ws://localhost:8082}
    ports:
      - "${UI_HTTP_PORT:-8080}:80"
      - "${UI_HTTPS_PORT:-8443}:443"
    networks:
      - voip-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

  # Homer 7 SIP Monitoring — essential for RCF SIP troubleshooting
  homer-db:
    image: postgres:14-alpine
    container_name: voip-homer-db
    environment:
      POSTGRES_PASSWORD: ${HOMER_DB_PASS:-homerSeven}
      POSTGRES_USER: root
    volumes:
      - homer_db_data:/var/lib/postgresql/data
      - ./docker/homer/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - voip-network
    healthcheck:
      test: ["CMD-SHELL", "psql -h localhost -U root -c '\\l'"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  heplify-server:
    image: ghcr.io/sipcapture/heplify-server
    container_name: voip-heplify-server
    ports:
      - "9060:9060"
      - "9060:9060/udp"
      - "9061:9061/tcp"
    environment:
      - "HEPLIFYSERVER_HEPADDR=0.0.0.0:9060"
      - "HEPLIFYSERVER_HEPTCPADDR=0.0.0.0:9061"
      - "HEPLIFYSERVER_DBSHEMA=homer7"
      - "HEPLIFYSERVER_DBDRIVER=postgres"
      - "HEPLIFYSERVER_DBADDR=homer-db:5432"
      - "HEPLIFYSERVER_DBUSER=root"
      - "HEPLIFYSERVER_DBPASS=${HOMER_DB_PASS:-homerSeven}"
      - "HEPLIFYSERVER_ALEGIDS=X-CID"
      - "HEPLIFYSERVER_LOGLVL=info"
      - "HEPLIFYSERVER_LOGSTD=true"
    depends_on:
      homer-db:
        condition: service_healthy
    networks:
      - voip-network
    restart: unless-stopped

  homer-webapp:
    image: ghcr.io/sipcapture/homer-app
    container_name: voip-homer-webapp
    ports:
      - "9080:80"
    environment:
      - "DB_HOST=homer-db"
      - "DB_USER=root"
      - "DB_PASS=${HOMER_DB_PASS:-homerSeven}"
      - "HOMER_LOGLEVEL=info"
    volumes:
      - ./docker/homer/bootstrap:/app/bootstrap
    depends_on:
      homer-db:
        condition: service_healthy
    networks:
      - voip-network
    restart: unless-stopped

  # Object storage (S3-compatible) — voicemail, call/conference recordings, uploads.
  # Local/dev = MinIO; production points the same S3 client at GCS/S3 via STORAGE_* env.
  minio:
    image: minio/minio:latest
    container_name: voip-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - voip-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # TURN/STUN (coturn) — WebRTC/Verto media relay for clients behind symmetric NAT.
  # Shares TURN_SECRET with the API (webrtc.py mints time-limited TURN credentials).
  coturn:
    image: coturn/coturn:latest
    container_name: voip-coturn
    network_mode: host
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TURN_SECRET=${TURN_SECRET:-dev-turn-secret-change-me}
      - TURN_REALM=${TURN_REALM:-voip.local}
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped

networks:
  voip-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  freeswitch_logs:
    driver: local
  homer_db_data:
    driver: local
  minio_data:
    driver: local
  media_spool:
    driver: local
