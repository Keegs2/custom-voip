# RCF-V1 Production Voice Platform - Docker Compose Configuration
# Remote Call Forwarding only — no UCaaS, no WebRTC, no UI
#
# Services: PostgreSQL, Redis, FreeSWITCH, Kamailio, FastAPI
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # Follow logs
#   docker compose down           # Stop all services
#
# NOTE: In production, PostgreSQL runs on dedicated VMs (Patroni cluster),
# not in Docker. The postgres service here is for development/testing only.

services:
  # PostgreSQL with TimescaleDB and PgBouncer
  # PRODUCTION: Replace with dedicated Patroni-managed VMs
  postgres:
    build: ./docker/postgres
    container_name: voip-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voip}
      POSTGRES_USER: ${POSTGRES_USER:-voip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voip_secret}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
      - "6432:6432"   # PgBouncer
    networks:
      - voip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voip -d voip"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # Redis - Ephemeral caching (channel counters, velocity tracking, session cache)
  redis:
    build: ./docker/redis
    container_name: voip-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - voip-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    sysctls:
      - net.core.somaxconn=65535
    restart: unless-stopped

  # FreeSWITCH - Core voice switch (RCF call routing + media proxy)
  freeswitch:
    build: ./docker/freeswitch
    container_name: voip-freeswitch
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Host networking: production standard for SIP B2BUAs
    # Eliminates Docker NAT overhead for RTP media
    network_mode: host
    environment:
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-6432}   # PgBouncer (matches production)
      - DB_NAME=${DB_NAME:-voip}
      - DB_USER=${DB_USER:-freeswitch}
      - DB_PASS=${DB_PASS:-fs_secret}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6380}
      - API_HOST=${API_HOST:-127.0.0.1}
      - API_PORT=${API_PORT:-8000}
      - EXTERNAL_RTP_IP=${EXTERNAL_RTP_IP}
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP}
      - HOMER_IP=${HOMER_IP:-127.0.0.1}
      - SBC_PROXY_IP=${SBC_PROXY_IP:-127.0.0.1}
      - TEST_MODE=${TEST_MODE:-false}
      # ESL password env-driven (entrypoint templates event_socket.conf). Dev
      # default is explicit and NOT ClueCon; must match the API's value.
      - ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD:-fs_esl_dev_pw}
      # SEC-2: FS sends this as X-Ingest-Secret on recording/voicemail/CDR ingest;
      # must match the API's value. (Local FS->API is blocked on Docker Desktop anyway.)
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET:-dev_ingest_secret_change_me}
    volumes:
      - ./docker/freeswitch/conf:/usr/local/freeswitch/conf
      - ./docker/freeswitch/scripts:/usr/local/freeswitch/scripts
      - freeswitch_logs:/var/log/freeswitch
      - media_spool:/media/spool   # FS writes vm/recordings here; API uploads to object storage
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: -1
        hard: -1
    restart: unless-stopped

  # Kamailio SBC - SIP signaling security, rate limiting, carrier routing
  kamailio:
    build: ./docker/kamailio
    container_name: voip-kamailio
    depends_on:
      - freeswitch
    network_mode: host
    environment:
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP}
      - FREESWITCH_IP=${FREESWITCH_IP:-127.0.0.1}
      - FS_PUBLIC_IP=${FS_PUBLIC_IP:-${EXTERNAL_SIP_IP}}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-6432}   # PgBouncer (matches production)
      - DB_USER=${DB_USER:-freeswitch}
      - DB_PASS=${DB_PASS:-fs_secret}
      - HOMER_IP=${HOMER_IP:-127.0.0.1}
      - HEP_CAPTURE_ID=${HEP_CAPTURE_ID:-100}
      - SBC_ID=${SBC_ID:-east-sbc-1}
    extra_hosts:
      - "freeswitch:127.0.0.1"
    volumes:
      - ./docker/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg.tmpl:ro
      - ./docker/kamailio/dispatcher.list:/etc/kamailio/dispatcher.list.tmpl:ro
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  # FastAPI - REST API for RCF provisioning, CDR queries, health
  api:
    build: ./docker/api
    container_name: voip-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Through PgBouncer (6432), matching production — exercises the transaction-mode
      # pooling path the code targets (statement_cache_size=0 + ::type casts).
      - DATABASE_URL=postgresql://${API_DB_USER:-api}:${API_DB_PASS:-api_secret}@postgres:6432/${DB_NAME:-voip}
      - REDIS_URL=redis://redis:6379
      # NOTE: on Docker Desktop (Mac/Win), host-networked FreeSWITCH is NOT reachable
      # from this bridge container — API<->FS (ESL, xml_curl, CDR, vm_notify) only works
      # on a real Linux host / production VMs. host.docker.internal is the best-effort local value.
      - FREESWITCH_ESL_HOST=${FREESWITCH_ESL_HOST:-host.docker.internal}
      - FREESWITCH_ESL_PORT=${FREESWITCH_ESL_PORT:-8021}
      # ESL password: explicit dev default, NOT the well-known ClueCon.
      # esl_client.py no longer hardcodes a ClueCon fallback (Phase 4).
      - FREESWITCH_ESL_PASSWORD=${FREESWITCH_ESL_PASSWORD:-fs_esl_dev_pw}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # PROD-4: deployment environment. ENV=production makes the API fail-fast on
      # dev-default secrets (TURN_SECRET / STORAGE_SECRET_KEY / INGEST_SHARED_SECRET).
      - ENV=${ENV:-development}
      # SEC-2: shared secret FreeSWITCH sends as X-Ingest-Secret on CDR/voicemail/
      # recording ingest. Dev default keeps local ingest working; production MUST
      # set a real value (and FS must send the matching header).
      - INGEST_SHARED_SECRET=${INGEST_SHARED_SECRET:-dev_ingest_secret_change_me}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:8443}
      - SBC_PROXY_IP=${SBC_PROXY_IP:-127.0.0.1}
      - TEST_MODE=${TEST_MODE:-false}
      - BANDWIDTH_API_CLIENT_ID=${BANDWIDTH_API_CLIENT_ID:-}
      - BANDWIDTH_API_CLIENT_SECRET=${BANDWIDTH_API_CLIENT_SECRET:-}
      - BANDWIDTH_ACCOUNT_ID=${BANDWIDTH_ACCOUNT_ID:-9900717}
      - BANDWIDTH_SIP_PEER_ID=${BANDWIDTH_SIP_PEER_ID:-1162116}
      # Phase 4 — object storage (S3-compatible; MinIO locally, GCS/S3 in prod)
      - STORAGE_ENDPOINT_URL=${STORAGE_ENDPOINT_URL:-http://minio:9000}
      - STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_FORCE_PATH_STYLE=${STORAGE_FORCE_PATH_STYLE:-true}
      - STORAGE_BUCKET_RECORDINGS=${STORAGE_BUCKET_RECORDINGS:-voip-recordings}
      - STORAGE_BUCKET_VOICEMAIL=${STORAGE_BUCKET_VOICEMAIL:-voip-voicemail}
      - STORAGE_BUCKET_UPLOADS=${STORAGE_BUCKET_UPLOADS:-voip-uploads}
      # Phase 4 — TURN/STUN for WebRTC (coturn); webrtc.py mints time-limited creds
      - TURN_HOST=${TURN_HOST:-localhost}
      - TURN_PORT=${TURN_PORT:-3478}
      - TURN_TLS_PORT=${TURN_TLS_PORT:-5349}
      - TURN_SECRET=${TURN_SECRET:-dev-turn-secret-change-me}
      - TURN_REALM=${TURN_REALM:-voip.local}
    ports:
      - "${API_PORT:-8088}:8000"
    # On a real Linux host (single-box test/prod), host.docker.internal is NOT
    # auto-provided (unlike Docker Desktop). This maps it to the host gateway so the
    # bridge-networked API can reach the host-networked FreeSWITCH ESL on :8021.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_spool:/media/spool   # reads FS-written vm/recordings, uploads to object storage
    networks:
      - voip-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # Web UI — RCF management, customer admin, DID tools
  ui:
    build: ./docker/ui
    container_name: voip-ui
    depends_on:
      - api
    environment:
      # UCaaS (unified): Verto WSS endpoint the SPA connects to for WebRTC
      # softphone/conference. Override per-zone (e.g. ws://<media-vm>:8082).
      # Local dev default points at the FreeSWITCH mod_verto WSS on the host.
      - VERTO_WS_URL=${VERTO_WS_URL:-wss://localhost:8443/ws/verto/}
      # nginx /ws/verto/ proxy target (templated into the conf by the UI entrypoint).
      # Single-host test box: the FreeSWITCH mod_verto WSS on the host (8082).
      - VERTO_PROXY_TARGET=${VERTO_PROXY_TARGET:-host.docker.internal:8082}
    ports:
      - "${UI_HTTP_PORT:-8080}:80"
      - "${UI_HTTPS_PORT:-8443}:443"
    # So nginx (bridge) can reach the host-networked FreeSWITCH mod_verto on :8082.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - voip-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

  # Homer 10 SIP capture — ClickHouse + qryn + Grafana (matches production
  # docker-compose.services.yml; the API /homer/search queries qryn/ClickHouse
  # and the UI proxies /grafana). Replaces the old Homer 7 postgres+homer-app.
  clickhouse-server:
    image: clickhouse/clickhouse-server:23.3-alpine
    container_name: voip-clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/homer/clickhouse-users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    networks:
      - voip-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # qryn — Loki-compatible API over ClickHouse (replaces the homer-app backend)
  qryn:
    # Pinned to the multi-arch (amd64+arm64) digest validated on the test box,
    # matching the previously-floating :latest. Bump deliberately, not by drift.
    image: qxip/qryn@sha256:77acc9c7a9fd98954e42b10c837f8849bae8a0c647b8233b40cf59f606cf6f0e
    container_name: voip-qryn
    environment:
      - CLICKHOUSE_SERVER=clickhouse-server
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=qryn
      - "CLICKHOUSE_AUTH=default:"
      - "NODE_OPTIONS=--max-old-space-size=4096"
    ports:
      - "3100:3100"
    depends_on:
      clickhouse-server:
        condition: service_healthy
    networks:
      - voip-network
    restart: unless-stopped

  # Heplify Server — receives HEP from Kamailio/FreeSWITCH, pushes to qryn
  heplify-server:
    image: ghcr.io/sipcapture/heplify-server:1.60.3
    container_name: voip-heplify-server
    ports:
      - "9060:9060"
      - "9060:9060/udp"
      - "9061:9061/tcp"
    environment:
      - "HEPLIFYSERVER_HEPADDR=0.0.0.0:9060"
      - "HEPLIFYSERVER_HEPTCPADDR=0.0.0.0:9061"
      - "HEPLIFYSERVER_DBSHEMA=mock"
      - "HEPLIFYSERVER_DBDRIVER=mock"
      - "HEPLIFYSERVER_LOKIURL=http://qryn:3100/loki/api/v1/push"
      - "HEPLIFYSERVER_PROMADDR=0.0.0.0:9096"
      - "HEPLIFYSERVER_LOKITIMER=1"
      - "HEPLIFYSERVER_LOKIIPPORTLABELS=true"
      - "HEPLIFYSERVER_ALEGIDS=X-CID"
      - "HEPLIFYSERVER_LOGLVL=info"
      - "HEPLIFYSERVER_LOGSTD=true"
      - "HEPLIFYSERVER_DEDUP=false"
      - "HEPLIFYSERVER_LOKIFROMTOLABELS=true"
      - "HEPLIFYSERVER_LOKICALLIDLABELS=true"
      - "HEPLIFYSERVER_FORCEALEGID=false"
      - "HEPLIFYSERVER_LOKIBULK=200"
      # Preserve HEP timestamps (qryn/ClickHouse accepts out-of-order writes).
      - "HEPLIFYSERVER_LOKIALLOWOUTOFORDER=true"
      - "HEPLIFYSERVER_SCRIPTENABLE=true"
      - "HEPLIFYSERVER_SCRIPTFOLDER=/scripts"
    volumes:
      - ./docker/homer/scripts:/scripts:ro
    depends_on:
      clickhouse-server:
        condition: service_healthy
    networks:
      - voip-network
    restart: unless-stopped

  # Grafana — SIP trace visualization (replaces the homer-app Angular UI).
  # Reached via the UI's /grafana/ proxy (8080/8443); 3000 is internal/dev.
  grafana:
    image: grafana/grafana-oss:10.4.3
    container_name: voip-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-sipcapture}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=qxip-flow-panel
      - "GF_INSTALL_PLUGINS=https://github.com/metrico/grafana-flow/releases/download/v10.0.10/qxip-flow-panel-10.0.10.zip;qxip-flow-panel"
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/homer/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/homer/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - qryn
    networks:
      - voip-network
    restart: unless-stopped

  # Object storage (S3-compatible) — voicemail, call/conference recordings, uploads.
  # Local/dev = MinIO; production points the same S3 client at GCS/S3 via STORAGE_* env.
  minio:
    image: minio/minio:latest
    container_name: voip-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - voip-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # TURN/STUN (coturn) — WebRTC/Verto media relay for clients behind symmetric NAT.
  # Shares TURN_SECRET with the API (webrtc.py mints time-limited TURN credentials).
  coturn:
    image: coturn/coturn:4.6.2
    container_name: voip-coturn
    network_mode: host
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TURN_SECRET=${TURN_SECRET:-dev-turn-secret-change-me}
      - TURN_REALM=${TURN_REALM:-voip.local}
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped

networks:
  voip-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  freeswitch_logs:
    driver: local
  clickhouse_data:
    driver: local
  grafana_data:
    driver: local
  minio_data:
    driver: local
  media_spool:
    driver: local
