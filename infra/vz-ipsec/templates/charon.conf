# Installed verbatim by install.sh -> /etc/strongswan.d/zz-vz.conf
# charon-systemd reads the `charon` section (its own `charon-systemd` section falls back to it).
# "zz-" sorts after Debian's /etc/strongswan.d/charon.conf so these values win. Plan §3.2.

charon {
    # §3.2 "Dead-peer detection time": declare a dead peer in ~26 s instead of the ~165 s default.
    # Schedule: 2.0 * 1.5^n for n = 0..4 => 2 + 3 + 4.5 + 6.75 + 10.1 ~= 26 s. Local only; Verizon sees nothing different.
    retransmit_timeout = 2.0
    retransmit_base    = 1.5
    retransmit_tries   = 4

    # §3.2 "Static routes": charon installs NOTHING into the routing tables (no table 220 / no VIP) —
    # vz-routes.sh owns `ip route ... dev xfrm-vz` + the blackhole shadow routes.
    install_routes     = no
    install_virtual_ip = no

    # §3.2 "No NAT-T": IKE/ESP only on the NIC (the forwarded IKE IP lives on ens4). Ignores lo (ILB probe address) and xfrm-vz.
    interfaces_use = ens4
}
