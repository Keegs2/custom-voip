# Installed verbatim by install.sh -> /etc/systemd/system/strongswan.service.d/vz.conf
# Debian's strongswan.service (charon-systemd) + `ExecStartPost=swanctl --load-all --noprompt`.
# Order charon after vz-routes so the IKE IP is on ens4 and xfrm-vz exists before the SAs are installed (plan §3.1, §3.2).

[Unit]
After=vz-routes.service
Wants=vz-routes.service
