# Installed verbatim by install.sh -> /etc/modprobe.d/vz-no-conntrack.conf   (plan §3.3 "conntrack must never load")
#
# WHY: the stateless NAT (nftables payload mangling) is only correct while NO conntrack exists on the box.
# If nf_conntrack ever loads, every forwarded packet is tracked, the `pre`/`post` rewrites confuse the tracker,
# and Docker-style NAT would silently start to "help". The health check also fails on `lsmod | grep -c nf_conntrack != 0`
# (§11 Phase 2 acceptance line).
#
# `blacklist` alone only stops alias autoload; `install <mod> /bin/false` is what actually refuses the module even as a
# DEPENDENCY of something else (nft `ct`/`nat` expressions, iptables, Docker). Both are set.

blacklist nf_conntrack
blacklist nf_nat
blacklist nf_conntrack_netlink
blacklist nft_ct
blacklist nft_nat
blacklist nft_chain_nat
blacklist nft_masq
blacklist nft_redir
blacklist iptable_nat
blacklist ip6table_nat
blacklist xt_conntrack
blacklist xt_nat
blacklist xt_MASQUERADE

install nf_conntrack /bin/false
install nf_nat /bin/false
install nf_conntrack_netlink /bin/false
install nft_ct /bin/false
install nft_nat /bin/false
install nft_chain_nat /bin/false
install nft_masq /bin/false
install nft_redir /bin/false
install iptable_nat /bin/false
install ip6table_nat /bin/false
install xt_conntrack /bin/false
install xt_nat /bin/false
install xt_MASQUERADE /bin/false
