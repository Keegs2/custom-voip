# Installed verbatim by install.sh -> /etc/sysctl.d/99-vz.conf   (plan §3.2 "OS")
# Per-interface keys for xfrm-vz are NOT here: a sysctl.d file is applied before the netdev exists and would fail.
# vz-routes.sh sets net.ipv4.conf.xfrm-vz.rp_filter=2 (loose) after the interface is up.

# The gateway forwards between ens4 and xfrm-vz.
net.ipv4.ip_forward = 1

# Loose reverse-path filtering as the baseline for every interface (strict would still pass today's routes,
# but loose is what §3.2 asks for on xfrm-vz and a mismatch between all/iface takes the MAX of the two).
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# A forwarding box must never emit or honour ICMP redirects (§3.2).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.ens4.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.ens4.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# No IPv6 anywhere in this design (Verizon tunnel is IPv4-only; the /28 is IPv4-only).
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
