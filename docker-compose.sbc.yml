# RCF-V1 Production — SBC VM (Kamailio only)
# Deploy: docker compose -f docker-compose.sbc.yml up -d
#
# Runs on: VM1 (KAM-G1 / KAM-G2 SBC instances)
# Each SBC VM gets its own .env with its public IP set in EXTERNAL_SIP_IP.
# Uses host networking — Kamailio binds directly to the VM's interfaces.
#
# Prerequisites:
#   - Copy .env.sbc.example to .env and fill in all REQUIRED values
#   - Ensure firewall allows: 5060/udp+tcp (SIP), 5061/tcp (TLS)

services:
  kamailio:
    build: ./docker/kamailio
    container_name: voip-kamailio
    network_mode: host
    # NET_ADMIN: entrypoint adds the NLB VIP (EXTERNAL_SIP_IP) to the host
    # loopback (`ip addr add`) — required for GCP passthrough-NLB backends.
    cap_add:
      - NET_ADMIN
    environment:
      - EXTERNAL_SIP_IP=${EXTERNAL_SIP_IP}
      - FREESWITCH_IP=${FREESWITCH_IP}
      # Strict active/standby FreeSWITCH pair (FS media HA) — the SECOND media
      # node's VPC/media-subnet IP. OPTIONAL — leave unset until the zone's
      # FS-2 VM exists and is fully hot (sofia up, DB connected). Unset/empty
      # = the templated config + dispatcher.list render byte-identical to the
      # single-FS deploy (same rolling-safety contract as SBC_SIGNALING_VIP).
      # When set: FS-1 keeps ALL new calls (dispatcher alg 8, priority-first);
      # FS-2 is a probed hot standby that takes new calls ONLY while FS-1 is
      # marked down, with automatic failback. Set it on BOTH SBCs of the zone.
      - FREESWITCH_IP_2=${FREESWITCH_IP_2:-}
      - FS_PUBLIC_IP=${FS_PUBLIC_IP}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-6432}
      - DB_USER=${DB_USER:-freeswitch}
      - DB_PASS=${DB_PASS}
      - HOMER_IP=${HOMER_IP}
      - HEP_CAPTURE_ID=${HEP_CAPTURE_ID:-100}
      - SBC_ID=${SBC_ID:-east-sbc-1}
      - SBC_INTERNAL_IP=${SBC_INTERNAL_IP}
      # Active/standby HA signaling VIP (per-zone INTERNAL passthrough NLB).
      # OPTIONAL — leave unset until the operator has created the zone's ILB
      # with the primary/standby SBC backends. Unset/empty = the templated
      # config renders byte-identical to the pre-HA deploy (SIGNALING_VIP
      # falls back to SBC_INTERNAL_IP, no extra listeners). When set, the
      # entrypoint binds it on loopback and Kamailio listens on it; the
      # FS-facing inner Record-Route in both presets becomes this VIP.
      # Set it on BOTH SBCs of the zone (identical config — "active" is
      # decided only by GCP health checks) BEFORE pointing the media VM's
      # SBC_PROXY_IP at the ILB.
      - SBC_SIGNALING_VIP=${SBC_SIGNALING_VIP:-}
      # Per-zone Bandwidth egress PoPs (East defaults; West swaps primary<->secondary)
      - BANDWIDTH_PRIMARY_IP=${BANDWIDTH_PRIMARY_IP:-67.231.2.12}
      - BANDWIDTH_SECONDARY_IP=${BANDWIDTH_SECONDARY_IP:-216.82.238.134}
      # Per-zone trusted internal subnets (East defaults; West sets its own)
      - INTERNAL_SUBNET=${INTERNAL_SUBNET:-10.142.0.0/20}
      - MEDIA_SUBNET=${MEDIA_SUBNET:-192.168.10.0/24}
      # Trusted external testing source (SIPp). SECURITY: disabled unless
      # explicitly set — entrypoint substitutes 255.255.255.255 when empty.
      - TESTING_IP=${TESTING_IP:-}
      # Inbound carrier CPS flood backstop (new INVITEs/sec per Bandwidth IP)
      - BW_CPS_LIMIT=${BW_CPS_LIMIT:-100}
      # FS-aware SIP-honest OPTIONS: when local FreeSWITCH is down, answer
      # EXTERNAL SIP monitors (Bandwidth/DNS-checker/PBX) 503 instead of 200 so
      # a dead-FS zone drains via carrier/DNS failover (the fail-open NLB can't).
      # Default 1 (ON). Set to 0 to force legacy always-200 with no code change.
      - FS_AWARE_OPTIONS=${FS_AWARE_OPTIONS:-1}
      # UDP MTU / oversized-INVITE UDP->TCP fallback (core udp_mtu +
      # udp_mtu_try_proto=TCP). DEFAULT 0 = OFF (dark). The param is GLOBAL
      # (also affects FS- and PBX-bound UDP sends) and Bandwidth TCP support is
      # UNVERIFIED — set a value (e.g. 1300) ONLY after the Bandwidth TCP
      # canary passes; full activation criteria in kamailio.cfg. entrypoint.sh
      # sanitizes non-numeric/<=0 to OFF.
      - UDP_MTU=${UDP_MTU:-0}
      # STIR/SHAKEN outbound signing (secsipid). DARK BY DEFAULT (off). When
      # STIR_SHAKEN_SIGN=on, Kamailio signs the outbound Identity/PASSporT in
      # route[TO_CARRIER] using the cert at STIR_CERT_URL (x5u) + the private key
      # at STIR_KEY_PATH. STIR_KEY_PATH is a SECRET mounted at runtime (a volume
      # in the SBC .env / an override) — it is NOT baked into the image and NOT
      # in git. STIR_SHAKEN_VERIFY is reserved for Phase 2B (no verify code yet).
      - STIR_SHAKEN_SIGN=${STIR_SHAKEN_SIGN:-off}
      - STIR_SHAKEN_VERIFY=${STIR_SHAKEN_VERIFY:-off}
      - STIR_CERT_URL=${STIR_CERT_URL:-}
      - STIR_KEY_PATH=${STIR_KEY_PATH:-}
      # STIR/SHAKEN inbound VERIFY trust anchors (Phase 2B). Govern whether a
      # fetched x5u cert is chained to a trusted STI-CA root. DEFAULT MODE 0 =
      # structural + JWT-signature only (no chain), byte-identical to no-libopt.
      # For true STI-PA trust set MODE=5 and point CA_FILE at the STI-PA root
      # bundle (delivered per-SBC by refresh-sbc-trust-bundle.sh; dir-mounted
      # read-only via docker-compose.stir-cafile.yml). Inert unless
      # STIR_SHAKEN_VERIFY=on. STIR_VERIFY_CA_FILE/_INTER/_CRL_FILE are only
      # opened when the matching CertVerify bit (4/8/16) is set, so an empty
      # default never blocks a call.
      - STIR_VERIFY_CERT_MODE=${STIR_VERIFY_CERT_MODE:-0}
      - STIR_VERIFY_CA_FILE=${STIR_VERIFY_CA_FILE:-}
      - STIR_VERIFY_CA_INTER=${STIR_VERIFY_CA_INTER:-}
      - STIR_VERIFY_CRL_FILE=${STIR_VERIFY_CRL_FILE:-}
      # Bandwidth TC1/TC2 trunk-config signaling IPs (fixed PoPs, all zones)
      - BANDWIDTH_TC1_NY=${BANDWIDTH_TC1_NY:-67.231.9.142}
      - BANDWIDTH_TC1_ATL=${BANDWIDTH_TC1_ATL:-67.231.13.185}
      - BANDWIDTH_TC2_DAL=${BANDWIDTH_TC2_DAL:-67.231.1.188}
      - BANDWIDTH_TC2_LA=${BANDWIDTH_TC2_LA:-67.231.4.138}
      # Sinch ORIGINATION signaling IPs (fixed PoPs, all zones — inbound trust
      # + dispatcher keepalive groups 6-7; termination stays Bandwidth).
      # Defaults are the production values, so deploy = git pull + rebuild
      # with NO .env edits. Denver=DNVTCOZIGR2_3278, Chicago=CHCGIL24GR4_7412.
      - SINCH_DENVER_IP=${SINCH_DENVER_IP:-206.146.100.24}
      - SINCH_CHICAGO_IP=${SINCH_CHICAGO_IP:-206.146.101.39}
    volumes:
      - ./docker/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg.tmpl:ro
      - ./docker/kamailio/dispatcher.list:/etc/kamailio/dispatcher.list.tmpl:ro
      # STIR/SHAKEN private key (SECRET) — mount READ-ONLY at the STIR_KEY_PATH
      # set in .env. COMMENTED OUT so a dark deploy (signing OFF, no key on the
      # VM yet) starts cleanly — a bind mount whose SOURCE is missing makes
      # Compose fail to start the container. Uncomment + point at the real key on
      # the VM ONLY when enabling signing (Phase 3), and keep the container path
      # equal to STIR_KEY_PATH. The key is delivered per-SBC like .env — NEVER
      # committed to git, NEVER baked into the image.
      #   - /opt/revup/secrets/stir-key.pem:/etc/kamailio/stir/stir-key.pem:ro
      # Shared ctl binrpc socket dir so the carrier-monitor sidecar can read
      # LIVE dispatcher state (`kamcmd dispatcher.list`) over the SAME socket
      # the healthcheck uses. Kamailio creates /run/kamailio/kamailio_ctl here
      # (/var/run -> /run); the named volume inherits the image's kamailio-owned
      # dir + perms on first mount, so Kamailio still writes the socket as usual.
      - kamailio_ctl:/var/run/kamailio
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Explicit -s pins the binrpc socket (matches ctl modparam + kamcmd default).
      test: ["CMD", "kamcmd", "-s", "unix:/var/run/kamailio/kamailio_ctl", "core.uptime"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # Production metrics plane — per-zone vmagent + node_exporter (SBC role).
  # See docs/OBSERVABILITY_METRICS_PLAN.md. Both are ADDITIVE, host-networked,
  # and have NO depends_on: kamailio — they must never pull the co-located call
  # server into an up-set. Deploy with `up -d --no-deps`.
  # ===========================================================================

  # vmagent (SBC role) — scrapes the local Kamailio xhttp_prom (:8080) and
  # node_exporter (:9100) at 127.0.0.1 (both host-net on this VM) and
  # remote-writes CROSS-ZONE to the East VictoriaMetrics. On-disk buffering
  # (maxDiskUsagePerURL=2GB) survives a store or WAN blip without loss.
  # `-envflag.enable=true` expands ${ZONE}/${INSTANCE_ID} in the scrape file.
  # NO depends_on: kamailio (see the header) — deploy with `up -d --no-deps`.
  vmagent:
    image: victoriametrics/vmagent:v1.103.0
    container_name: voip-vmagent
    network_mode: host
    command:
      - "-promscrape.config=/etc/vmagent/scrape-sbc.yml"
      - "-remoteWrite.url=http://${METRICS_REMOTE_WRITE_HOST:-10.142.0.103}:8428/api/v1/write"
      - "-remoteWrite.tmpDataPath=/vmagent-data"
      - "-remoteWrite.maxDiskUsagePerURL=2GB"
      - "-httpListenAddr=:8429"
      - "-envflag.enable=true"
    environment:
      - ZONE=${METRICS_ZONE}
      - INSTANCE_ID=${SBC_ID}
    volumes:
      - ./docker/vmagent/scrape-sbc.yml:/etc/vmagent/scrape-sbc.yml:ro
      - vmagent_data:/vmagent-data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8429/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    restart: unless-stopped

  # node_exporter — host CPU / memory / disk / network for this SBC VM.
  # host-net + pid:host + read-only rootfs bind; binds :9100, scraped locally by
  # the vmagent above. NO depends_on: kamailio.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: voip-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=:9100"
    network_mode: host
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # revup-ops-agent (was: carrier-monitor) — runs on EVERY SBC.
  #
  # TWO jobs in one process (see docker/carrier-monitor/):
  #  1. Carrier poller (UNCHANGED from PR #8): reads Kamailio's LIVE per-gateway
  #     carrier health over the SHARED ctl binrpc UNIX socket via
  #     `kamcmd dispatcher.list` and POSTs an up/down snapshot to the East API.
  #  2. Read-only NOC command API on OPS_AGENT_PORT (8710): the ted-next console's
  #     single transport for SBC reads (kamcmd dispatcher.list/stats/htable, plus
  #     host docker/git/journalctl). Allow-listed, fixed argv, shell=False,
  #     fail-closed bearer auth. Role auto-detects as `sbc` (ctl socket present).
  #
  # SECURITY: the command API binds 0.0.0.0:8710 and is published on the VM. It is
  # VPC-internal ONLY — the OPERATOR MUST add a firewall rule allowing tcp:8710
  # from just the console host(s) (e.g. a `voip-ops-agent` tag → console SA/IP).
  # No SIP listeners are added; Kamailio stays host-net, this stays on bridge.
  # ---------------------------------------------------------------------------
  carrier-monitor:
    build: ./docker/carrier-monitor
    container_name: voip-carrier-monitor
    # Bridge network + published port: the poller reaches the ctl socket via the
    # shared volume (not the network) and POSTs outbound; the command API is
    # reached by the console on the published 8710. (Kamailio must stay host-net
    # for SIP; this agent does not.)
    # NO depends_on: kamailio. A read-only diagnostic sidecar must NEVER be able
    # to recreate/restart the co-located call server — `up -d --build carrier-monitor`
    # with a depends_on would pull Kamailio into the up-set and drop live calls.
    # The poller reads Kamailio's ctl binrpc socket via the shared `kamailio_ctl`
    # named volume (which exists regardless of container start order), and it
    # fails closed if Kamailio is down (kamcmd returns an error → the agent just
    # reports ok:false); the dependency is therefore both unnecessary and unsafe.
    ports:
      # Read-only NOC command API. VPC-internal; gate with a firewall rule.
      - "${OPS_AGENT_PORT:-8710}:${OPS_AGENT_PORT:-8710}"
    environment:
      # Per-SBC identity (goes into the payload's sbc_id). MUST be unique per SBC.
      - SBC_ID=${SBC_ID:-east-sbc-1}
      # Central API receiver (East services VM) + shared bearer token.
      - CARRIER_STATUS_URL=${CARRIER_STATUS_URL}
      - CARRIER_STATUS_TOKEN=${CARRIER_STATUS_TOKEN}
      # Poll cadence in seconds (default 15).
      - POLL_INTERVAL=${POLL_INTERVAL:-15}
      # ---- Ops-agent command API ----
      # Force the SBC role (ctl socket also auto-detects it; explicit is robust).
      - OPS_AGENT_ROLE=${OPS_AGENT_ROLE:-sbc}
      # Bearer token the console must present on POST /run. Fail-closed: if unset,
      # every /run is 401. MUST match the console's configured token.
      - OPS_AGENT_TOKEN=${OPS_AGENT_TOKEN}
      # Port the read-only command API listens on (default 8710).
      - OPS_AGENT_PORT=${OPS_AGENT_PORT:-8710}
      # ---- Live customer-trunk feeder (SBC role) ----
      # POSTs per-customer-trunk stats to the East API (/v1/live-trunk-stats/report).
      # Fail-closed: if URL/token are unset the feeder no-ops; the carrier-status
      # poll above is unaffected. Token MUST equal the API's LIVE_TRUNK_STATS_TOKEN.
      - LIVE_TRUNK_STATS_URL=${LIVE_TRUNK_STATS_URL:-}
      - LIVE_TRUNK_STATS_TOKEN=${LIVE_TRUNK_STATS_TOKEN:-}
      - LIVE_TRUNK_STATS_INTERVAL=${LIVE_TRUNK_STATS_INTERVAL:-15}
    volumes:
      # SAME named volume the kamailio service mounts — this is how the agent sees
      # /var/run/kamailio/kamailio_ctl (poller + SBC-role kamcmd commands). NOT
      # :ro — connecting to a UNIX socket needs write on the socket inode; a :ro
      # bind makes connect() fail (EROFS) even for root. The agent only issues
      # read-only RPCs regardless of the mount mode.
      - kamailio_ctl:/var/run/kamailio
      # Host Docker socket (READ-ONLY) for host.docker_ps / host.docker_logs. The
      # agent only runs `docker ps` / `docker logs` (reads); :ro is defense in
      # depth (the daemon API is still reachable, but the agent never calls a
      # mutating verb — the allow-list has none).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Repo checkout (READ-ONLY) for host.git_head (`git -C /opt/revup ...`).
      - /opt/revup:/opt/revup:ro
      # Host journal (READ-ONLY, best-effort) for host.journalctl. If absent the
      # command reports "unavailable" gracefully; docker_logs still covers logs.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 32M
    restart: unless-stopped

volumes:
  # Shared Kamailio ctl binrpc socket directory (kamailio writes, carrier-monitor
  # reads). Named volume so ownership/perms of the mount point are inherited from
  # the kamailio image (kamailio:kamailio) on first creation.
  kamailio_ctl:
  # vmagent remote_write on-disk buffer (survives store/WAN blips without loss).
  vmagent_data:
    driver: local
