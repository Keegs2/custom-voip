# WebSocket connection upgrade mapping.
# Used by the Homer reverse proxy to support WebSocket connections.
# Must live in a separate file because map{} is valid only in the http{} context,
# and conf.d/*.conf is included inside http{}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Visual Voicemail access log — never logs the query string. Playback URLs
# carry a short-lived bearer-equivalent token (`…/audio?t=<token>`), so the
# /api/v1/voicemail/ location logs the request PATH only. $vm_log_path is the
# path the client sent (before the /api rewrite) with everything from '?'
# dropped; otherwise identical to the stock `main` format of nginx:alpine.
map $request_uri $vm_log_path {
    ~^(?<vm_path>[^?]*) $vm_path;
    default             $uri;
}

log_format vm_noquery '$remote_addr - $remote_user [$time_local] "$request_method $vm_log_path $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
