# --- Dual HTTP + HTTPS ---
# Port 80: serves the full app over HTTP (needed for GCP Load Balancer backend).
# Port 443: serves the same app over HTTPS (needed for WebRTC getUserMedia).
# No redirect — both ports serve content so the LB path and direct HTTPS both work.
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Docker DNS resolver — needed for variable-based proxy_pass
    # so nginx doesn't crash at startup when optional services are down
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Serve the React SPA
    root /usr/share/nginx/html;
    index index.html;

    # --- Grafana (Homer 10 SIP visualization) ---
    # Must be before /api/ so it takes priority.
    location /grafana/ {
        # Variable upstream + resolver → resolved per-request, so nginx still
        # starts when grafana isn't running (e.g. local compose stack).
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Frame-Options;
        proxy_read_timeout 120s;
    }

    # --- Verto WebSocket proxy (FreeSWITCH mod_verto) ---
    # Browser connects to wss://host:8443/ws/verto/ and nginx proxies to
    # FreeSWITCH's plain ws:// on port 8082 (host networking).
    # This avoids mixed-content blocks when the page is loaded over HTTPS.
    location /ws/verto/ {
        proxy_pass         http://10.142.0.100:8082/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- WebSocket proxy (chat, presence) ---
    # Must come before /api/ so WebSocket upgrades are handled with proper headers.
    # TLS terminates here — backend proxy_pass stays http:// (wss→ws unwrap).
    location /api/ws/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API proxy ---
    # React app calls /api/rcf, /api/customers, etc.
    # Strip /api prefix and proxy to FastAPI backend on port 8000.
    # Use $http_host (preserves port) instead of $host (strips port)
    # so the backend can construct correct URLs with non-standard ports.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # --- FastAPI docs (direct, no /api prefix) ---
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- SIPp test runner ---
    location /api/sipp/ {
        rewrite ^/api/sipp/(.*)$ /sipp/$1 break;
        set $sipp_upstream http://sipp:8001;
        proxy_pass $sipp_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    10s;
    }

    # --- React SPA catch-all ---
    # Serve static files from disk; fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Health check (no prefix, for load balancer) ---
    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }
}
