<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/crag.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme before first paint (no flash). Mirrors src/styles/theme.ts:
      localStorage `crag_theme` ('light' | 'dark') wins, else the OS
      preference. The public landing page ('/') is always dark
      (data-landing); AppLayout keeps that attribute in step on navigation.
      Keep this tiny and dependency-free. If a CSP is ever added, allow it
      by hash.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          var saved = window.localStorage.getItem('crag_theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            theme = 'light';
          }
        }
        root.setAttribute('data-theme', theme);
        var landing = window.location.pathname === '/';
        if (landing) root.setAttribute('data-landing', '');
        root.style.colorScheme = landing ? 'dark' : theme;
      })();
    </script>
    <title>Granite CRAG</title>
    <meta
      name="description"
      content="Remote call forwarding, SIP trunking and encrypted voicemail on Granite's three-region voice platform, with STIR/SHAKEN signing and full SIP capture."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wdth,wght@62..125,600..900&family=Public+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
