# vmagent scrape config — Media (FreeSWITCH) VMs
# ---------------------------------------------------------------------------
# Runs host-networked on each FreeSWITCH VM (docker-compose.media.yml).
# FreeSWITCH is host-net, so the ESL exporter in the carrier-monitor sidecar
# (:9103) binds on the VM interface — vmagent scrapes it at 127.0.0.1:9103
# alongside the co-located node_exporter. (mod_prometheus / :9102 was dropped: it
# failed to build/load; its two series moved into the :9103 ESL exporter.)
#
# %{ZONE} / %{INSTANCE_ID} are expanded by vmagent at load time because the
# container runs with `-envflag.enable=true`; the compose service sets
#   ZONE=${METRICS_ZONE}  INSTANCE_ID=${FS_NODE_ID}.
global:
  scrape_interval: 15s
  external_labels:
    zone: "%{ZONE}"
    reporting_instance: "%{INSTANCE_ID}"

scrape_configs:
  # FreeSWITCH ESL exporter (carrier-monitor sidecar, ops_metrics.py) — bounded
  # live splits (freeswitch_channels_active{direction,on_net}, …) PLUS the two
  # aggregate series mod_prometheus used to serve on :9102
  # (freeswitch_sessions_total, freeswitch_calls_active). The exporter stamps
  # freeswitch_node itself (= FREESWITCH_NODE env = FS_NODE_ID), so the
  # dashboard's `sum by (freeswitch_node)` / `sum(...)` resolve unchanged.
  - job_name: freeswitch_esl
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9103"]

  # node_exporter — host CPU / memory / disk / network for this media VM.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # vm-forwarder (docker-compose.media.yml) — the voicemail outage spool
  # (docs/VOICEMAIL_OUTAGE_RESILIENCE.md): vm_spool_messages{state},
  # vm_spool_bytes{state}, vm_spool_oldest_age_seconds, vm_spool_forwarded_total,
  # vm_spool_dropped_total, vm_spool_api_reachable. Dashboard tile only — no
  # alert rule (owner: no pagers). A scrape failure before the forwarder is
  # deployed is harmless (up=0 for this job).
  - job_name: vm_forwarder
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9105"]

  # ---------------------------------------------------------------------------
  # vz_gateway — the zone's two Verizon IPsec gateways (infra/vz-ipsec; as-built
  # inventory docs/VERIZON_IPSEC_TRUNKS_PLAN.md §4.1). Plain Debian VMs with no
  # Docker and therefore no vmagent of their own: node_exporter listens on the
  # gateway NIC IP :9100 with --collector.xfrm (kernel node_xfrm_* counters) plus
  # the textfile vz-healthd rewrites every 2 s (vz_ipsec_*{zone,gw}; gw = a|b =
  # gateway-ILB primary|failover). This media vmagent is the scraper: it is the
  # zone-local host-net vmagent on a subnet the gateway firewall already admits
  # (vz-ipsec-allow-internal-fwd: zone/media/gateway subnets -> tag vz-ipsec,
  # all ports) — no new firewall rule, no cross-zone scrape.
  #
  # ONE shared file serves all three zones, so every gateway is listed with a
  # __tmp_zone selector and the keep-relabel keeps only THIS vmagent's zone
  # (%{ZONE} — the same env expansion external_labels uses; unset ZONE keeps
  # nothing). `zone` on the stored series is the external label; vz-healthd's
  # identical zone label survives as exported_zone (honor_labels is off).
  # `node` is the GCE instance name (what infra/monitoring's vm_down and the
  # pager text use); `role` tags the series for dashboards.
  #
  # BOTH media VMs of a zone (*-fs and the *-fs-2 hot standby) run this file,
  # so each gateway is scraped twice and the series differ only by
  # reporting_instance. Deliberate: gateway visibility survives either FS VM
  # dying. Every rule in docker/vmalert/rules/vz_ipsec.yml reduces with
  # max by (zone, node, gw) FIRST so the duplicate never double-counts; do the
  # same on any dashboard panel over these series. Before infra/vz-ipsec/
  # install.sh has run on a gateway the target is simply up=0 (harmless, like
  # vm_forwarder above); the rules gate on "ever healthy" so nothing pages.
  #
  # Confirm after deploy (from the media VM, single line):
  #   curl -s http://192.168.11.2:9100/metrics | grep -c '^vz_ipsec_'
  # (expect 10) and curl -s http://127.0.0.1:8429/targets | grep vz_gateway.
  - job_name: vz_gateway
    metrics_path: /metrics
    static_configs:
      # East (us-east1) — ILB 192.168.11.4
      - targets: ["192.168.11.2:9100"]
        labels:
          __tmp_zone: east
          node: east-vz-gw-a
          role: vz-gw
      - targets: ["192.168.11.3:9100"]
        labels:
          __tmp_zone: east
          node: east-vz-gw-b
          role: vz-gw
      # West (us-west1) — ILB 192.168.21.4
      - targets: ["192.168.21.2:9100"]
        labels:
          __tmp_zone: west
          node: west-vz-gw-a
          role: vz-gw
      - targets: ["192.168.21.3:9100"]
        labels:
          __tmp_zone: west
          node: west-vz-gw-b
          role: vz-gw
      # Central (us-central1) — ILB 192.168.31.2; gw-a/-b are .4/.5 (b/c zones
      # were stocked out of n2-standard-2, so the pair landed in -a/-f)
      - targets: ["192.168.31.4:9100"]
        labels:
          __tmp_zone: central
          node: central-vz-gw-a
          role: vz-gw
      - targets: ["192.168.31.5:9100"]
        labels:
          __tmp_zone: central
          node: central-vz-gw-b
          role: vz-gw
    relabel_configs:
      # Keep only the gateways of this vmagent's own zone.
      - source_labels: [__tmp_zone]
        regex: "%{ZONE}"
        action: keep
