# vmagent scrape config — East services VM
# ---------------------------------------------------------------------------
# Runs on the compose bridge network (docker-compose.services.yml). node_exporter
# is host-net and postgres/pgbouncer exporters are bridge but published on the
# host, so this vmagent reaches all three via the docker host-gateway alias
# `host.docker.internal` (added to the service with extra_hosts). It remote-writes
# to VictoriaMetrics by service name (http://victoriametrics:8428) in-network.
#
# %{ZONE} / %{INSTANCE_ID} are expanded by vmagent at load time because the
# container runs with `-envflag.enable=true`; the compose service sets
#   ZONE=${METRICS_ZONE}  INSTANCE_ID=${SERVICES_NODE_ID}.
global:
  scrape_interval: 15s
  external_labels:
    zone: "%{ZONE}"
    reporting_instance: "%{INSTANCE_ID}"

scrape_configs:
  # node_exporter — host CPU / memory / disk / network for the services VM.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # postgres_exporter — East PRIMARY health: replication lag / slots / sessions.
  - job_name: postgres
    static_configs:
      - targets: ["host.docker.internal:9187"]

  # pgbouncer_exporter — pool saturation (cl_waiting, sv_idle, …).
  - job_name: pgbouncer
    static_configs:
      - targets: ["host.docker.internal:9127"]

  # ---------------------------------------------------------------------------
  # blackbox — app-service up/down for every platform service on this VM.
  # Standard Prometheus blackbox relabel pattern: each target is the real probe
  # URL/host:port; the `service` label is the friendly display name (the CONTRACT
  # the NOC dashboard depends on). relabel: __address__ -> __param_target, pin
  # __param_module, then rewrite __address__ to the in-network blackbox-exporter.
  # Result: probe_success{service="<name>"} = 1 (up) / 0 (down).
  #
  # Two sub-jobs because the module differs per target:
  #   blackbox_http  -> module=http_2xx  (services with a reliable HTTP health path)
  #   blackbox_tcp   -> module=tcp_connect (services with no clean HTTP health path)
  # ---------------------------------------------------------------------------
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api:8000/health"]
        labels:
          service: "API"
      - targets: ["http://clickhouse-server:8123/ping"]
        labels:
          service: "ClickHouse"
      - targets: ["http://grafana:3000/api/health"]
        labels:
          service: "Grafana"
      - targets: ["http://victoriametrics:8428/health"]
        labels:
          service: "VictoriaMetrics"
      # heplify-server's Prometheus metrics endpoint (HEPLIFYSERVER_PROMADDR=
      # 0.0.0.0:9096) — its real HTTP liveness surface. NOTE: HEP on :9060 is
      # UDP (HEPADDR), so a TCP probe there always reads down; :9096 is the app's
      # own HTTP metrics port and returns 200 while heplify-server is running.
      - targets: ["http://heplify-server:9096/metrics"]
        labels:
          service: "Homer (HEP)"
      # STIR/SHAKEN x5u publish surface (isolated Caddy, docker-compose.x5u.yml)
      # probed via the PUBLIC URL — the exact path other carriers' verifiers and
      # our SBC crons use, so DNS + LE cert + firewall are all in the probe.
      # Two signals: /healthz = the endpoint/container is up at all;
      # /stir/sti-pa-trust-bundle.pem = the STI-PA trust bundle is actually
      # PUBLISHED (404s until the first refresh-stir-trust-bundle.sh --install).
      # NOTE: this egresses via the VM's own external IP (34.26.57.37) back to
      # itself — proven to work on this VM (the refresh script's publish
      # self-probe and the runbook's verification curls do the same). If GCE
      # hairpin ever breaks it, fall back to http://host.docker.internal:80/healthz.
      - targets: ["https://fs-cert.granitevoip.com/healthz"]
        labels:
          service: "x5u (fs-cert)"
      - targets: ["https://fs-cert.granitevoip.com/stir/sti-pa-trust-bundle.pem"]
        labels:
          service: "x5u trust bundle"
    relabel_configs:
      # Move the probe URL into the module's ?target= param.
      - source_labels: [__address__]
        target_label: __param_target
      # Keep a human-readable `instance` = the probed URL (not blackbox's addr).
      - source_labels: [__param_target]
        target_label: instance
      # Actually scrape the blackbox-exporter (in-network, by service name).
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      # qryn (Homer Loki API) has no stable HTTP health path — TCP accept = up.
      - targets: ["qryn:3100"]
        labels:
          service: "Homer (qryn)"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
