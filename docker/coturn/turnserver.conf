# =============================================================================
# coturn — TURN/STUN server for WebRTC / Verto media relay
# =============================================================================
# Browsers behind symmetric NAT cannot use STUN-only: their server-reflexive
# candidate is unreachable from the peer. A TURN relay is mandatory for those
# clients. This server relays Verto/WebRTC media for the UCaaS softphone and
# video conferences.
#
# CREDENTIALS — shared-secret (ephemeral / time-limited) scheme:
#   `use-auth-secret` + `static-auth-secret` enables RFC 5766 / "REST API"
#   time-limited credentials. The API (docker/api, webrtc.py) mints them with
#   the SAME secret:
#       username = "<unix-expiry-ts>[:<user>]"
#       password = base64( HMAC-SHA1( static-auth-secret, username ) )
#   So `static-auth-secret` here MUST equal the API's TURN_SECRET env var, and
#   `realm` here MUST equal the API's TURN_REALM.
#
# !!! PRODUCTION — READ THIS !!!
# coturn does NOT expand environment variables inside this file, and the local
# docker-compose mounts it read-only and launches coturn with
# `-c /etc/coturn/turnserver.conf`. The secret/realm/cert values below are DEV
# DEFAULTS and MUST be replaced for production. Two supported ways to inject the
# real values WITHOUT editing the compose file:
#   1. Template at deploy time (Ansible / an entrypoint wrapper):
#        envsubst < turnserver.conf.tmpl > turnserver.conf
#      substituting ${TURN_SECRET}, ${TURN_REALM}, ${EXTERNAL_IP}, cert paths.
#   2. Append CLI overrides to the container command (CLI wins over the file):
#        command: ["-c","/etc/coturn/turnserver.conf",
#                  "--static-auth-secret=$TURN_SECRET","--realm=$TURN_REALM",
#                  "--cert=/certs/fullchain.pem","--pkey=/certs/privkey.pem"]
# The dev secret below MUST match docker-compose's
# TURN_SECRET=${TURN_SECRET:-dev-turn-secret-change-me}.
# =============================================================================

# --- Listeners ---------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# Relay (media) port range handed out for allocations. Kept small for the dev
# stack; widen substantially for production capacity (e.g. 49152-65535).
min-port=49160
max-port=49200

# --- Authentication (time-limited shared-secret credentials) -----------------
use-auth-secret
# DEV secret — MUST equal the API's TURN_SECRET. CHANGE IN PRODUCTION.
static-auth-secret=dev-turn-secret-change-me
# DEV realm — MUST equal the API's TURN_REALM. CHANGE IN PRODUCTION.
realm=voip.local

# --- TLS (turns: / DTLS) -----------------------------------------------------
# PRODUCTION: mount CA-issued certs and ENABLE the two lines below (point them
# at the mounted cert + key). They are intentionally left disabled for dev
# because the coturn image ships no cert and the compose mounts no cert volume;
# with these commented, coturn starts cleanly and serves plain STUN/TURN on
# 3478/5349 (the TLS listener simply isn't armed). Self-signed dev certs can be
# generated and mounted at /etc/coturn/certs to exercise turns: locally.
#cert=/etc/coturn/certs/turn_server_cert.pem
#pkey=/etc/coturn/certs/turn_server_pkey.pem
# PRODUCTION hardening for TLS:
#dh-file=/etc/coturn/certs/dhparam.pem
#cipher-list="ECDHE+AESGCM:!aNULL:!MD5"

# --- Security / hardening ----------------------------------------------------
# Add a FINGERPRINT attribute to relayed messages (WebRTC expects it).
fingerprint
# Legacy TLS 1.0/1.1 are already unsupported by this coturn build (only TLS
# 1.2/1.3 and DTLS 1.2 are compiled in), so no explicit no-tlsv1/no-tlsv1_1 is
# needed — and on recent coturn those directives are rejected as unknown.
# PRODUCTION: pin a strong cipher-list alongside the mounted cert (see above).
# Never relay to multicast peers.
no-multicast-peers
# Admin CLI: bind it to loopback only and require a password (the legacy
# `no-cli` flag is deprecated/removed on recent coturn). PRODUCTION: set a
# strong cli-password (or firewall :5766). Dev value below is non-default.
cli-password=dev-turn-cli-change-me
# Rotate nonces so harvested credentials expire.
stale-nonce=600
# PRODUCTION: lock relaying away from internal infrastructure. Permit only the
# public destinations WebRTC needs; deny RFC1918 + link-local so a compromised
# client can't pivot into the VPC. Left commented for the local all-in-one
# stack (where the relay legitimately stays on the host).
#denied-peer-ip=10.0.0.0-10.255.255.255
#denied-peer-ip=172.16.0.0-172.31.255.255
#denied-peer-ip=192.168.0.0-192.168.255.255
#denied-peer-ip=169.254.0.0-169.254.255.255

# --- Logging -----------------------------------------------------------------
# Log to stdout so `docker compose logs coturn` shows listener/alloc lines.
log-file=stdout
# Quieten per-session spam in steady state; raise for debugging.
no-stdout-log=false
simple-log
