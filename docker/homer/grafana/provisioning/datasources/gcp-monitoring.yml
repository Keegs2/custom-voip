# Google Cloud Monitoring (Stackdriver) datasource — Production NOC infra track.
# ---------------------------------------------------------------------------
# Feeds the fleet / uptime / DB-VM panels in the "Production NOC" dashboards.
# `type: stackdriver` is the BUILT-IN core datasource shipped with
# grafana/grafana-oss:10.4.3 (the plugin was renamed "Google Cloud Monitoring"
# but the datasource `type` string stayed `stackdriver` — verified against
# grafana v10.4.3 source: public/app/plugins/datasource/cloud-monitoring/plugin.json
# still declares id "stackdriver"). NO plugin install needed — do not add it to
# GF_INSTALL_PLUGINS.
#
# UID is FIXED as `gcp-monitoring` — dashboard JSON targets reference it by this
# uid, and the parallel voice-product NOC track relies on the same uid.
#
# ── AUTH — GCE metadata auth (keyless), because the org blocks SA keys ────────
# The org enforces constraints/iam.managed.disableServiceAccountKeyCreation, so
# downloadable SA keys (JWT/key-file auth) cannot be created. This datasource
# uses GCE metadata auth: Grafana borrows the `services` VM's attached SA
# (562404538544-compute@..., cloud-platform scope) which holds
# roles/monitoring.viewer. No key file, no secret, nothing to rotate. The
# JWT/key-file notes below are retained ONLY for reference / orgs that allow keys.
#
#   How it works: the grafana container (compose bridge net) reaches the GCE
#   metadata server at 169.254.169.254 THROUGH the host, so Grafana mints tokens
#   for the VM's attached SA with no key material. One-time grant (operator):
#     gcloud projects add-iam-policy-binding rugged-night-193017 \
#       --member serviceAccount:562404538544-compute@developer.gserviceaccount.com \
#       --role roles/monitoring.viewer --condition=None
#   The VM SA also needs the cloud-platform (or monitoring) access scope — the
#   East `services` VM already has cloud-platform.
#
# ── FOR REFERENCE ONLY — key-file (JWT) auth, if an org ever allows SA keys ───
# Set authenticationType: jwt + clientEmail (the SA email, from GCM_SA_EMAIL —
# not a secret) + tokenUri, and privateKeyPath pointing at a mounted *.json SA
# key (Grafana's google-sdk auto-extracts `private_key` from a downloaded key
# JSON — grafana-google-sdk-go/pkg/utils/utils.go). That path is BLOCKED here by
# constraints/iam.managed.disableServiceAccountKeyCreation, hence GCE auth above.
apiVersion: 1

datasources:
  - name: GCP Monitoring
    uid: gcp-monitoring
    type: stackdriver
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      # KEYLESS: Grafana borrows the services VM's attached service account via
      # the GCE metadata server. The org enforces
      # constraints/iam.managed.disableServiceAccountKeyCreation (no downloadable
      # SA keys), so key-file (jwt) auth is unavailable. Requires the VM's SA
      # (562404538544-compute@developer.gserviceaccount.com, cloud-platform scope)
      # to hold roles/monitoring.viewer. The bridge container reaches the
      # 169.254.169.254 metadata server via the host.
      authenticationType: gce
      defaultProject: rugged-night-193017
