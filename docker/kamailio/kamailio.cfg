# Inbound carrier CPS flood backstop (env-driven via BW_CPS_LIMIT, templated
# by entrypoint.sh; default 100). Max NEW initial INVITEs per second per
# STATIC carrier source IP (all carrier ingress — Bandwidth AND Sinch; the
# name keeps its historical "BW_" prefix for env/tooling continuity).
# DB-authenticated carriers (route[CARRIER_TRUST]) use their per-row
# carrier_trunks.cps_limit instead. This is a flood backstop, NOT a traffic
# shaper — the default is well above normal per-PoP traffic and only trips on
# runaway carrier-side floods (misroute loops, upstream retry storms).
#!define BW_CPS_LIMIT __BW_CPS_LIMIT__

# FS-aware SIP-honest OPTIONS toggle (env-driven via FS_AWARE_OPTIONS).
# When ENABLED (default), the inbound OPTIONS keepalive handler answers
# EXTERNAL monitors (Bandwidth / DNS health checker / customer PBX) with 503
# instead of 200 while the local FreeSWITCH is DOWN — the SIP-layer signal
# that drains a dead-FS zone via carrier/DNS failover (the fail-open NLB
# cannot do this). Set FS_AWARE_OPTIONS=0 in the SBC .env to force the legacy
# always-200 behavior WITHOUT a code change.
#
# Implemented as a COMPILE-TIME define (like WITH_TLS), not a runtime integer
# compare: entrypoint.sh substitutes the line below with either
#   #!define FS_AWARE_OPTIONS      (env FS_AWARE_OPTIONS != 0 — the default)
# or a plain comment (env FS_AWARE_OPTIONS == 0), and the OPTIONS handler wraps
# the 503 branch in `#!ifdef FS_AWARE_OPTIONS ... #!endif`. This avoids any
# bare-literal expression parsing question and mirrors the file's existing
# preprocessor-toggle convention exactly.
__FS_AWARE_OPTIONS_DEFINE__

# ---- STIR/SHAKEN outbound signing (env-driven, templated by entrypoint.sh) ----
# Signs the outbound SIP Identity header (PASSporT) at the carrier border in
# route[TO_CARRIER] via the secsipid module. DARK BY DEFAULT: gated on the
# compile-time define STIR_SHAKEN_SIGN, which entrypoint.sh emits ONLY when
# STIR_SHAKEN_SIGN=on in the SBC .env. When off, the placeholder below becomes a
# plain comment, the `#!ifdef STIR_SHAKEN_SIGN` block in TO_CARRIER is compiled
# OUT, and the carrier path is byte-identical to the pre-STIR config. This
# mirrors the FS_AWARE_OPTIONS toggle mechanism exactly (compile-time, not a
# runtime integer compare) — see entrypoint.sh.
__STIR_SHAKEN_SIGN_DEFINE__
# x5u: the public HTTPS URL of our STI cert repo, embedded in every signed
# PASSporT's `info=`/x5u. STIR_KEY_PATH: container path to the EC P-256 private
# key PEM used to sign (a SECRET, mounted at runtime — NEVER in git). Both are
# env-templated by entrypoint.sh (STIR_CERT_URL / STIR_KEY_PATH). Harmless
# placeholder defaults when unset; only referenced inside the STIR_SHAKEN_SIGN
# ifdef, so an unset key/URL with signing OFF changes nothing.
#
# These are #!substdef (RAW text replacement), NOT #!define, deliberately — same
# mechanism as ADVERTISE_IP / FS_PUBLIC_IP. That lets the value be dropped BOTH
# inside a larger string literal (the PASSporT JSON and the Identity `info=<...>`
# param) AND as a quoted function argument. A #!define would embed its own quotes
# and break the in-string uses.
#!substdef "!STIR_CERT_URL!__STIR_CERT_URL__!g"
#!substdef "!STIR_KEY_PATH!__STIR_KEY_PATH__!g"

# ---- STIR/SHAKEN inbound verification toggle (Phase 2B — BUILT, dark by
# default). Compile-time, same mechanism as STIR_SHAKEN_SIGN: entrypoint emits a
# plain comment unless STIR_SHAKEN_VERIFY=on (default off), so the
# `#!ifdef STIR_SHAKEN_VERIFY` verify block in request_route (Bandwidth inbound
# branch, right after the Task 1.4 Identity capture) is compiled OUT when off —
# the inbound call path is then byte-identical to the pre-verify config. When on,
# that block runs secsipid_check_identity() on the inbound Identity and records a
# verstat ($dlg_var(verstat) / internal X-Verstat) FAIL-OPEN (annotate-only,
# never rejects/reroutes). CA trust anchors for the fetched x5u chain are the
# secsipid `libopt` CertVerify/CertCAFile modparams (see the modparam section).
__STIR_SHAKEN_VERIFY_DEFINE__

# ---- UDP MTU / oversized-INVITE handling (env-driven via UDP_MTU) -----------
# DARK BY DEFAULT: UDP_MTU unset/0/non-numeric => entrypoint.sh renders the
# placeholder below as a comment, the #!ifdef block compiles OUT, and UDP
# behavior is byte-identical to today (oversized datagrams IP-fragment).
#
# WHY THIS EXISTS: with STIR signing ON, a carrier-bound INVITE carries the
# preserved base Identity (~800B) + our div PASSporT (~700B) — and with the
# multi-Identity chain preservation, up to 4 preserved elements — on top of an
# already ~1100B INVITE, pushing the UDP datagram past the 1500B path MTU into
# IP fragmentation. Bandwidth currently reassembles fragments fine (observed in
# production), but fragmentation is fragile: some middleboxes drop fragments,
# and one lost fragment loses the whole INVITE with no partial retransmit. The
# textbook remedy is RFC 3261 §18.1.1 (switch to a congestion-controlled
# transport when a request nears the path MTU) = core udp_mtu +
# udp_mtu_try_proto=TCP.
#
# WHY IT SHIPS DARK — READ BEFORE ENABLING (operator decision):
#   * udp_mtu is GLOBAL. Kamailio cannot scope it per-destination, so it
#     affects EVERY UDP send from this SBC: carrier egress, the FS :5080
#     dispatch, AND customer-PBX trunk delivery. A >MTU inbound INVITE would be
#     tried over TCP toward FreeSWITCH, and a >MTU PBX-bound INVITE over TCP
#     toward the customer PBX — not just the carrier leg this is aimed at.
#   * TCP fallback to Bandwidth is UNVERIFIED from our side: the dispatcher
#     keepalives probe UDP only, and the Bandwidth SIP peer (account 9900717,
#     peer 1162116) TCP listening status is unconfirmed. If the peer refuses
#     TCP, exactly the LARGEST (fully signed, div-chained) INVITEs would fail —
#     strictly worse than today's fragmentation, which works.
#   * FS sofia has no transport restriction on :5080/:5090 (TCP accepted by
#     default) but SIP-over-TCP has never carried production load here.
# ACTIVATION CRITERIA (in order, before setting UDP_MTU anywhere):
#   1. Bandwidth confirms SIP-over-TCP is enabled on peer 1162116 (their SIP
#      peer config), THEN a TCP canary INVITE from a lab/test SBC completes.
#   2. Verify FS accepts a TCP INVITE on :5080 (sofia status, test call).
#   3. Enable on ONE SBC only (UDP_MTU=1300 in that SBC's .env + restart),
#      watch carrier 4xx/5xx + ASR before any fleet rollout.
# Suggested value: 1300 (headroom under the 1460 GCP VPC MTU and the 1500
# internet path MTU). entrypoint.sh sanitizes non-numeric/<=0 to OFF.
__UDP_MTU_DEFINE__
#!ifdef UDP_MTU_FALLBACK
udp_mtu=__UDP_MTU_VALUE__
udp_mtu_try_proto=TCP
#!endif

