# Internal sources — FreeSWITCH on host networking sends from VM's internal VPC IP
#!define DOCKER_NETWORK "172.28.0.0/16"
#!define LOCALHOST_NETWORK "127.0.0.0/8"
# PER-ZONE internal trust (env-driven, templated by entrypoint.sh).
# Each zone trusts ONLY its OWN VPC subnet and its OWN FS media subnet
# (per-zone self-containment — no SBC ever needs to trust another zone's
