# Bandwidth uses multiple origination IPs across their network
#!define BANDWIDTH_NET_1 "67.231.0.0/16"
#!define BANDWIDTH_NET_2 "216.82.224.0/19"

# Sinch ORIGINATION signaling IPs (env-driven, templated by entrypoint.sh,
# same pattern as the BANDWIDTH_* defines above; defaults are the production
