####### Module Parameters ########

# ----- Transaction Module (tm) -----
# Tuned for carrier interconnect - fast failure detection
# Final response timeout 3s (carrier should respond fast)
# fr_timer: non-INVITE final response timeout
# Set to 30s for carrier interconnect (carriers need time to route)
modparam("tm", "fr_timer", 30000)
# INVITE final response 120s (allows for call setup)
modparam("tm", "fr_inv_timer", 120000)
# Wait timer for ACK 2s
modparam("tm", "wt_timer", 2000)
# Initial retransmit 500ms
modparam("tm", "retr_timer1", 500)
# Max retransmit interval 4s
modparam("tm", "retr_timer2", 4000)
# Verbose CANCEL timer
modparam("tm", "noisy_ctimer", 1)
# Reset timer on provisional
modparam("tm", "restart_fr_on_each_reply", 1)
# Auto-send 100 Trying
modparam("tm", "auto_inv_100", 1)
modparam("tm", "auto_inv_100_reason", "Trying")
# Pass 1xx responses
modparam("tm", "pass_provisional_replies", 1)

# ----- Control Interface (ctl / binrpc) -----
# UNIX socket for kamcmd/kamctl and the Docker healthcheck (`kamcmd core.uptime`).
# Path matches BOTH the compiled-in default of kamcmd AND ctl.so
# (/var/run/kamailio/kamailio_ctl; /var/run -> /run), so plain `kamcmd` with no
# -s flag connects automatically. The /run/kamailio directory is created and
# chown'd to the kamailio user in the Dockerfile. Default perms let root (the
# healthcheck runs as root via docker exec) connect. Local-only; no routing impact.
modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")

# ----- Record-Route Module -----
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
# Double Record-Route enabled for multi-SBC NLB deployments.
# BOTH the A-leg (Bandwidth->FS) and B-leg (FS->Bandwidth) use
# record_route_preset() with two URIs:
#   outer = NLB VIP (ADVERTISE_IP) — carrier/external side
#   inner = SIGNALING_VIP — FS/internal side. Under active/standby HA this
#           is the per-zone INTERNAL NLB VIP (always the active SBC); when
#           SBC_SIGNALING_VIP is unset it renders as SBC_INTERNAL_IP (the
#           legacy specific-SBC pin, bypassing the NLB).
# In-dialog requests from BOTH sides reach an SBC that can route them:
# statelessly via the §8.10 ;fs= markers on any SBC, or via local dialog
# state on the SBC that handled the INVITE. Without the inner RR on the
# A-leg, Bandwidth's ACK/BYE would route to a random SBC via the NLB,
# causing dropped ACKs and retransmission storms when the wrong SBC is hit.
# enable_double_rr also affects plain record_route(): it emits a second
# ;r2=on RR when rcv/snd socket BINDS differ (COND_IF_DIFF_REALMS) — see
# the SIGNALING_VIP listen comment for why that socket advertises
# ADVERTISE_IP (keeps the X-PBX-Dest trunk-delivery RRs on the external
# VIP once FS targets the signaling VIP).
modparam("rr", "enable_double_rr", 1)

# ----- Pike (Rate Limiting) -----
# 1 second window
modparam("pike", "sampling_time_unit", 1)
modparam("pike", "reqs_density_per_unit", PIKE_THRESHOLD)
modparam("pike", "remove_latency", PIKE_TIMEOUT)

# ----- Hash Tables -----
# Blocked IPs (auto-expire after 300 seconds)
modparam("htable", "htable", "blocked=>size=12;autoexpire=300")
# Failed auth tracking for scanner detection
modparam("htable", "htable", "failedauth=>size=12;autoexpire=3600")
# IP reputation
modparam("htable", "htable", "ipreputation=>size=12;autoexpire=86400")
# Call tracking per IP
modparam("htable", "htable", "ipcalls=>size=12;autoexpire=60")

# Carrier inbound INVITE dedup (all carrier ingress — Bandwidth, Sinch, and
# any DB-authenticated carrier via route[CARRIER_TRUST]).
# Bandwidth sends the same inbound call from multiple edge proxies
# simultaneously (different source IPs, different Call-IDs, but same
# From/To). Without dedup the platform creates duplicate call legs.
# Key = From-user::To-user, TTL = 3 seconds. The first INVITE stores
# the key; any subsequent INVITE with the same key within the TTL
# window is rejected with 482 Merged.
# DO NOT add $si/carrier to the key: duplicates arrive from DIFFERENT
# edge IPs — the source-independent key is the thing doing the dedup.
# (Name kept "bw_dedup" for htable RPC/tooling continuity.)
# ACTIVE/STANDBY NOTE: this htable is per-SBC (no replication). Under the
# old active/active NLB, two edge-proxy duplicates could land on DIFFERENT
# SBCs and both pass dedup (each SBC saw one). With the active/standby
# failover policy the single active SBC sees ALL carrier ingress, so
# cross-edge duplicates are now deterministically caught — a semantic
# IMPROVEMENT, not just equivalence. (Same single-viewer improvement
# applies to bw_cps/carrier_cps/pike counters — with the flip side that
# the active SBC now counts the FULL zone load against the same limits;
# BW_CPS_LIMIT default 100/PoP-IP retains ample headroom, env-tunable.)
modparam("htable", "htable", "bw_dedup=>size=10;autoexpire=3")

# Carrier inbound CPS flood backstop (all STATIC carrier ingress — Bandwidth
# and Sinch; DB-authenticated carriers use the per-row carrier_cps below).
# Key = carrier source IP ($si), value = count of NEW initial INVITEs in
# the current second. autoexpire=1 + updateexpire=0 = true per-second
# window (increments do not extend the entry's life). Checked ONLY in the
# inbound-from-carrier initial-INVITE path — never for FreeSWITCH or
# other internal traffic, never for in-dialog requests or OPTIONS.
# Limit is BW_CPS_LIMIT (env: BW_CPS_LIMIT, default 100).
# (Name kept "bw_cps" for htable RPC/tooling continuity.)
modparam("htable", "htable", "bw_cps=>size=10;autoexpire=1;updateexpire=0")

# Per-carrier CPS limit for DB-authenticated carriers (route[CARRIER_TRUST]).
# Key = "<carrier>::<pop>" (from the matched carrier_trunks row), value =
# count of NEW initial INVITEs in the current second. Same fixed 1-second
# window semantics as bw_cps/trunk_cps (autoexpire=1, updateexpire=0). The
# limit is PER ROW (carrier_trunks.cps_limit), not the global BW_CPS_LIMIT,
# so a runtime-added carrier gets its own admission rate without a redeploy.
modparam("htable", "htable", "carrier_cps=>size=10;autoexpire=1;updateexpire=0")

# ----- Dispatcher (Load Balancing + Carrier Health Monitoring) -----
# Dispatcher serves two purposes:
#   Group 1: FreeSWITCH load balancing (used by ds_select_dst in route[DISPATCH])
#   Groups 2-7: carrier keepalive/health monitoring ONLY
#               (actual carrier routing is in route[TO_CARRIER] via $rd/$du;
#                Sinch is origination-only — never a TO_CARRIER target)
#               Group 2: BW TC4 Dallas, Group 3: BW TC4 LA
#               Group 4: BW TC1 NY + Atlanta, Group 5: BW TC2 Dallas + LA
#               Group 6: Sinch Denver, Group 7: Sinch Chicago
#
# The OPTIONS probes to the carriers (groups 2-3, 6-7) serve as SIP NAT
# keepalive: GCE has a 30-second UDP idle timeout. Without periodic SIP
# traffic to the carrier, the NAT pinhole for signaling would expire and
# inbound SIP from it (new INVITEs for inbound calls) may not arrive.
# Probing every 5 seconds keeps the pinhole open with comfortable margin.
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
# Failover support
modparam("dispatcher", "flags", 2)
# XAVP-based destination and context (Kamailio 5.8+ style)
modparam("dispatcher", "xavp_dst", "ds_dst")
modparam("dispatcher", "xavp_ctx", "ds_ctx")
# Ping every 5 seconds — applies to all groups (FS + Bandwidth)
# For FS (group 1): health checking for load balancing failover
# For Bandwidth (groups 2-3): SIP signaling NAT keepalive + health monitoring
modparam("dispatcher", "ds_ping_interval", 5)
# Probe all destinations continuously (mode 1), not just inactive ones
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_from", "sip:ping@voiceplatform.local")
# 3 failures = inactive
modparam("dispatcher", "ds_probing_threshold", 3)
# 3 successes = active
modparam("dispatcher", "ds_inactive_threshold", 3)
# Accept any class 2xx, plus 404/480/405/500 as "alive" responses.
# FreeSWITCH responds 200 OK to OPTIONS. Bandwidth may respond 200, 404,
# 480, or 405 (Method Not Allowed) depending on configuration — all indicate
# the signaling path is alive and the NAT pinhole is refreshed.
# code=500 ACCEPTED as alive (operator decision 2026-09-02): the Sinch orig
# TGs (groups 6/7) answer 500 to ALL OPTIONS — captured 2026-09-01 from both
# the SBC public IPs AND the NLB VIP (after the per-dest socket=/ping_from
# VIP-sourcing, see the group 6 note in dispatcher.list), and Granite's
# other telephony platform receives the same 500 from these TGs: it is
# Sinch's STANDARD OPTIONS response there, not an auth artifact. A 500
# proves the far-end SIP stack is up (a dead PoP sends nothing) — which is
# the keepalive question. TRADE-OFF (param is module-global, no per-dest
# override in 5.8): a 500 from Bandwidth / Sinch TERM now also counts as
# alive. Accepted because carrier-group flags are MONITORING-only (FS owns
# call failover via TCP pre-check + INVITE-level attempts; Kamailio's own
# 5xx carrier flip keys on INVITE replies, not probes) — we lose only the
# distinction between "up" and "up but erroring on OPTIONS".
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=404;code=405;code=480;code=500")

# ----- Dialog Module -----
modparam("dialog", "dlg_flag", 4)
modparam("dialog", "timeout_avp", "$avp(dlg_timeout)")
# 12 hour max call
modparam("dialog", "default_timeout", 43200)
# "carrier_trunk" (valued) tracks live active calls per carrier trunk-config +
# direction ("<carrier>:<inbound|outbound>") for the Prometheus
# trunk_active_calls gauge, refreshed on scrape via get_profile_size() in
# event_route[xhttp:request]. Appended to the existing "caller" profile — same
# semicolon-separated modparam, no second modparam (a second one would override).
modparam("dialog", "profiles_with_value", "caller;carrier_trunk")
# No DB persistence (stateless SBC)
modparam("dialog", "db_mode", 0)
# Dialog matching mode for the rr-callback path (dlg_onroute). NOTE — verified
# against 5.8 dlg_handlers.c: this modparam does NOT affect $dlg_var() reads.
# $dlg_var -> dlg_get_msg_dialog -> dlg_lookup_msg_dialog does an UNCONDITIONAL
# get_dlg(Call-ID + from-tag + to-tag) lookup regardless of dlg_match_mode, so
# route[TO_FS_INDIALOG]'s tier-3 $dlg_var(fs_port) resolves on the dialog-owning
# SBC either way (route[FROM_NET_INDIALOG] never calls loose_route(), so the
# dlg_onroute callback never fires for that traffic at all). Mode 1 is kept as
# the harmless, more tolerant setting for any path that DOES go through
# loose_route(); matching is still exact on all three dialog identifiers.
modparam("dialog", "dlg_match_mode", 1)

# ----- NAT Helper -----
# NAT pinging disabled — SBC mode, no registered endpoints to ping
modparam("nathelper", "natping_interval", 0)
modparam("nathelper", "received_avp", "$avp(RECEIVED)")

