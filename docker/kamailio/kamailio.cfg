#!KAMAILIO
#
# Kamailio SBC Configuration - Production Ready
# Front-end SBC for High-Volume Voice Platform (500+ CPS target)
#
# Features:
# - SIP rate limiting (pike + htable)
# - Explicit topology hiding (header scrub in route[TO_CARRIER])
# - Attack prevention (sanity, scanner detection)
# - Load balancing to FreeSWITCH with failover
# - NAT traversal
# - Dialog tracking for in-dialog requests
# - Proper SIP timer tuning for carrier interconnect
#

####### Global Parameters #########

# Process/threading configuration
children=16
tcp_children=8

# TCP tuning
tcp_max_connections=4096
tcp_connection_lifetime=300
tcp_connect_timeout=10
tcp_send_timeout=3
tcp_accept_aliases=yes
tcp_async=yes
tcp_rd_buf_size=16384
# Accept TCP requests that arrive WITHOUT a Content-Length header.
# REQUIRED for the xhttp_prom /metrics scrape on the :8080 TCP listener:
# SIP-over-TCP mandates Content-Length to frame a message, but HTTP GET
# requests (Prometheus/vmagent scrapes) send none. Without this, the core
# TCP reader (tcp_read.c tcp_read_req) rejects the GET as a malformed SIP
# message — "bad request, state=7, error=4" — closes the socket with an
# empty reply, and event_route[xhttp:request] never fires. See the xhttp
# module docs: "the core must be configured to allow incoming requests
# without content length header."
#
# SIP-SAFETY: this is the PERMISSIVE direction of a framing rule and does
# NOT weaken SIP handling on :5060:
#   - The primary carrier/FS SIP path here is UDP — UDP framing is
#     datagram-bounded and never consulted Content-Length, so it is
#     completely unaffected by this global.
#   - Real SIP-over-TCP peers (all of ours) still send Content-Length on
#     every request, so their messages frame exactly as before. This flag
#     only changes behavior for the pathological case of a CL-less TCP
#     request (an HTTP GET), which previously errored and now frames as a
#     header-only body-less request — precisely what xhttp needs.
tcp_accept_no_cl=yes

# Memory is set via CMD args: -M (shared MB) -m (pkg MB)

# Logging
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

# Network
mhomed=1
auto_aliases=no

# SIP options
sip_warning=0
server_signature=no
user_agent_header="User-Agent: VoicePlatform-SBC"
server_header="Server: VoicePlatform-SBC"

# Listen addresses - advertise external IP so SIP headers show public IP
#!substdef "!ADVERTISE_IP!__ADVERTISE_IP__!g"
# SBC's own internal (VPC) IP — historically the inner Record-Route in both
# presets (FS pinned in-dialog requests to this specific SBC, bypassing the
# NLB). Still a live listen: (a) in-flight dialogs established before the
# active/standby cutover carry it in their route sets, (b) FreeSWITCH's
# SBC_PROXY_IP_FAILOVER belt-and-braces path targets it directly, (c) the
# xhttp_prom listener and TEST-PATH use it. Templated by entrypoint.sh from
# SBC_INTERNAL_IP env var.
#!substdef "!SBC_INTERNAL_IP!__SBC_INTERNAL_IP__!g"
# SIGNALING_VIP — the per-zone INTERNAL passthrough-NLB VIP for the TRUE
# active/standby SBC pair. FreeSWITCH targets this VIP for B-leg bridging and
# in-dialog requests, and it replaces SBC_INTERNAL_IP as the FS-facing inner
# Record-Route entry in BOTH presets, so FS->SBC in-dialog traffic always
# reaches the ONE active SBC (a mid-call SBC death no longer strands FS's
# BYE on a dead pinned IP; the ILB fails the VIP over to the standby).
#
# Templated by entrypoint.sh from SBC_SIGNALING_VIP. When that env var is
# UNSET, entrypoint substitutes SBC_INTERNAL_IP here, so every SIGNALING_VIP
# occurrence renders byte-identical to the pre-HA config, and the mode define
# below compiles the dedicated listen/alias OUT (no duplicate listen lines).
#!substdef "!SIGNALING_VIP!__SIGNALING_VIP__!g"
# Replaced by entrypoint.sh with `#!define SBC_SIGVIP_DEDICATED` when
# SBC_SIGNALING_VIP is set to a dedicated ILB VIP, or a comment when not.
__SBC_SIGVIP_MODE_DEFINE__
# Carrier-facing: binds to NLB VIP (on loopback via ip addr add for hairpin NAT)
# HEP will report ADVERTISE_IP as the SBC's address for carrier traffic
listen=udp:ADVERTISE_IP:5060 advertise ADVERTISE_IP:5060
listen=tcp:ADVERTISE_IP:5060 advertise ADVERTISE_IP:5060

# FS-facing: binds to VPC internal IP for FreeSWITCH traffic
listen=udp:SBC_INTERNAL_IP:5060 advertise ADVERTISE_IP:5060
listen=tcp:SBC_INTERNAL_IP:5060 advertise ADVERTISE_IP:5060

#!ifdef SBC_SIGVIP_DEDICATED
# Signaling-VIP listeners (active/standby HA): receive everything FreeSWITCH
# sends to the internal NLB VIP (B-leg INVITEs to SBC_PROXY_IP, in-dialog
# requests following the SIGNALING_VIP inner Record-Route, and the Lua TCP
# :5060 health pre-check). The VIP is bound on loopback by entrypoint.sh —
# GCP internal passthrough NLB delivers packets with dst still = the VIP.
#
# advertise ADVERTISE_IP — DELIBERATELY the external VIP, NOT SIGNALING_VIP
# (verified against 5.8 source; do not "fix" this):
#   1. Nothing FS-facing is built from this socket's advertise. The FS-facing
#      route-set entries come from the LITERAL record_route_preset() strings
#      (record.c:512 builds preset RRs verbatim — no SUBST/advertise lumps),
#      which now carry SIGNALING_VIP explicitly. The Via FS replies to is the
#      SEND socket's (SBC_INTERNAL, mhomed) — also not this socket.
#   2. Plain record_route() IS advertise-sensitive, and with
#      enable_double_rr=1 it emits a SECOND ;r2=on RR when the receive
#      socket's BIND differs from the send socket's BIND
#      (record.c:459-462 COND_IF_DIFF_REALMS; msg_translator.c:484-498
#      compares bind addresses). That fires for the X-PBX-Dest trunk-delivery
#      leg once FS targets this VIP (rcv bind = SIGNALING_VIP != snd bind =
#      SBC_INTERNAL). The RR addresses render from the sockets' ADVERTISED
#      addresses (msg_translator.c:805-853). Advertising ADVERTISE_IP makes
#      both RRs render the external VIP — the address a customer PBX can
#      actually reach — and keeps every externally visible address identical
#      to the pre-HA config. Advertising SIGNALING_VIP instead would (a) leak
#      the RFC1918 ILB address to external PBXs and (b) make the r2
#      double-pop force the ILB socket as send socket for the PBX-side BYE
#      toward FS's PUBLIC Contact (loose.c:924-934 + rr_do_force_send_socket
#      loose.c:822-833) — an ILB-sourced packet to a public destination,
#      which the GCP fabric cannot NAT and drops. See GCP_DEPLOYMENT_PLAN.md
#      ("Active/standby SBC pair").
listen=udp:SIGNALING_VIP:5060 advertise ADVERTISE_IP:5060
listen=tcp:SIGNALING_VIP:5060 advertise ADVERTISE_IP:5060
# HTTP :8080 on the signaling VIP too: if the internal passthrough NLB's HC
# probes are VIP-addressed like the external NLB's proved to be (dst =
# forwarding-rule IP), this answers them; if they are VM-addressed, the
# SBC_INTERNAL_IP:8080 bind below answers instead. Covers both without
# assuming which — the external-VIP lesson, applied. Guarded: only emitted in
# dedicated mode, so it can never duplicate the SBC_INTERNAL_IP:8080 bind.
listen=tcp:SIGNALING_VIP:8080
#!endif

# Local: for kamcmd, health checks, and local tools
listen=udp:127.0.0.1:5060

# HTTP listeners on :8080 (xhttp: GET /healthz + xhttp_prom GET /metrics).
# NON-SIP. Three binds, each load-bearing:
#   - SBC_INTERNAL_IP: the co-located per-zone vmagent scrape + VPC tooling.
#   - 127.0.0.1: local curl/health.
#   - ADVERTISE_IP (the external NLB VIP): REQUIRED for the GCP NLB health
#     check. PROVEN 2026-08-26 (West tcpdump): external passthrough-NLB HC
#     probes arrive addressed to the FORWARDING-RULE IP — i.e. dst=VIP:8080,
#     NOT this VM's own IP — and originate from 209.85.152.0/22,
#     209.85.204.0/22 and 35.191.0.0/16. Without this bind the kernel RSTs
#     VIP:8080, so the fs-aware HC NEVER passed and every zone silently rode
#     the NLB all-unhealthy fail-open since 2026-07-30. Exposure is
#     firewall-bounded (only Google probe ranges may reach :8080 —
#     allow-hc-sbc-healthz + default-allow-health-check); the VIP is already
#     on lo (entrypoint.sh), and VIP-sourced DSR replies are GCP-legal for LB
#     backends (the observed RST itself egressed source=VIP).
# Never used for SIP — event_route[xhttp:request] serves only GET /healthz and
# GET /metrics and 404s everything else. No carrier/Bandwidth SIP exposure.
listen=tcp:SBC_INTERNAL_IP:8080
listen=tcp:127.0.0.1:8080
listen=tcp:ADVERTISE_IP:8080

#!ifdef WITH_TLS
listen=tls:ADVERTISE_IP:5061 advertise ADVERTISE_IP:5061
#!endif

# Alias for SBC's own VPC IP so loose_route() recognizes it as local.
# Without this, the inner Record-Route (SBC_INTERNAL_IP) from double RR
# is not stripped by loose_route(), causing an infinite loop. Still required
# after the active/standby cutover: in-flight dialogs established before it
# carry SBC_INTERNAL_IP route sets that must keep terminating here.
alias=SBC_INTERNAL_IP:5060

#!ifdef SBC_SIGVIP_DEDICATED
# Same self-recognition for the signaling VIP (the NEW inner Record-Route in
# both presets): loose_route()/is_myself() match own addresses via
# check_self() -> grep_sock_info() OR grep_aliases() (core/forward.c:424-442).
# The listen above already makes grep_sock_info() match; the alias is the
# same belt-and-braces the SBC_INTERNAL_IP entry has. It also lets the
# WITHINDIALOG is_myself("$rd") guards classify a SIGNALING_VIP R-URI as
# "ours" (mixed-state relay shapes), same as SBC_INTERNAL today.
alias=SIGNALING_VIP:5060
#!endif

# DNS - enable for Docker DNS resolution of service names (e.g., "freeswitch")
dns=yes
rev_dns=no
dns_try_ipv6=no
use_dns_cache=on
dns_cache_flags=1

# FreeSWITCH backend IP — templated by entrypoint.sh at startup
#!define FREESWITCH_IP "__FS_IP__"
#!define FREESWITCH_PORT 5080

# ---- Strict active/standby FreeSWITCH pair (FS media HA) ----
# FS_HA_PAIR is defined by entrypoint.sh ONLY when FREESWITCH_IP_2 is set to a
# second, distinct media node (the mode-define line below renders as a comment
# otherwise — same mechanism as SBC_SIGVIP_DEDICATED). Every pair-mode block in
# this file sits inside `#!ifdef FS_HA_PAIR`, so an unset var compiles them ALL
# out and the effective config is identical to the single-FS config.
#
# The __FS_IP_2__ token below is raw-sed-templated like __FS_IP__ (it renders
# as FREESWITCH_IP when the var is unset, and is then only referenced from
# compiled-out blocks). Model — mirrors the SBC active/standby pair:
#   - FS-1 (__FS_IP__)   = ACTIVE:  serves ALL new calls while healthy.
#   - FS-2 (__FS_IP_2__) = STANDBY: fully hot (sofia up, DB connected,
#     answering the same dispatcher OPTIONS probes) but receives ZERO new
#     calls until dispatcher marks FS-1 INACTIVE; automatic failback when
#     FS-1 recovers. Selection = ds_select_dst alg 8 on the priority-ordered
#     group 1 (see route[DISPATCH] and dispatcher.list for the 5.8 source
#     citations). During failover/failback windows BOTH nodes hold live
#     calls, so per-call node identity travels in the Record-Route ;fsn=
#     marker + $dlg_var(fs_node) (see TO_FS_INDIALOG).
__FS_HA_MODE_DEFINE__

# FreeSWITCH public IP for RTP media — used in SDP body rewrites.
# This is the FS VM's own public IP (e.g., 34.139.119.135), NOT the NLB VIP.
# When Kamailio scrubs internal/private IPs from SDP bodies, it must replace
# them with the FS public IP (where RTP actually goes), not ADVERTISE_IP
# (the NLB VIP, which only forwards SIP on port 5060, not RTP).
# If unset, falls back to ADVERTISE_IP (breaks RTP when NLB is in use).
#!substdef "!FS_PUBLIC_IP!__FS_PUBLIC_IP__!g"

