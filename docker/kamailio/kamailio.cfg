# ----- SIP Trace (HEP to Homer) -----
# Kamailio uses host networking, so Homer's published port is on localhost
# Configuration follows the official Homer 7 wiki example for Kamailio
modparam("siptrace", "duplicate_uri", "sip:__HOMER_IP__:9060")
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_version", 3)
modparam("siptrace", "hep_capture_id", __HEP_CAPTURE_ID__)
modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "trace_flag", 22)
modparam("siptrace", "trace_on", 1)
# data_mode=0: use the socket-layer (bind) address in HEP src/dst fields.
# Now that listen directives bind to real IPs (ADVERTISE_IP and SBC_INTERNAL_IP)
# instead of 0.0.0.0, the socket address is already correct. data_mode=1
# (use advertise address) is no longer needed and would hide which interface
# actually received/sent the packet.
modparam("siptrace", "data_mode", 0)

# ----- Prometheus Exporter (xhttp_prom) -----
# Serves a Prometheus text scrape on the dedicated :8080 listener via
# event_route[xhttp:request] (below). Local/VPC-internal only — the per-zone
# vmagent scrapes 127.0.0.1:8080. Does NOT touch SIP routing.
#
# xhttp_prom_stats="all" auto-exposes Kamailio's internal statistics
# (tm reply codes, dialog active, shmem, dispatcher, htable, sl, etc.) as
# metrics, so SBC health is available with zero extra script.
modparam("xhttp_prom", "xhttp_prom_stats", "all")
# Custom carrier-trunk metrics. NOTE on 5.8 syntax: the metric is DECLARED here
# with the module's own prom_counter/prom_gauge modparams (format
# "name=NAME; label=L1:L2;"), NOT a single "prom_metric" param — that form does
# not exist in the kamailio-prometheus-modules 5.8 build. The "trunk" label is
# the CARRIER/trunk-config enum (primary|secondary|tc1|tc2|tc4) — a small closed
# set, NEVER a customer identifier. "direction" is inbound|outbound.
# The exporter prepends xhttp_prom_beginning (default "kamailio_"), so these are
# scraped as kamailio_trunk_cps / kamailio_trunk_active_calls.
modparam("xhttp_prom", "prom_counter", "name=trunk_cps; label=trunk:direction;")
modparam("xhttp_prom", "prom_gauge", "name=trunk_active_calls; label=trunk:direction;")

# ----- STIR/SHAKEN observability counters (additive; scraped as
# kamailio_stir_attest_signed_total / kamailio_stir_inbound_verstat_total) -----
# Both are pure OBSERVABILITY: incremented from the same routing blocks that
# already exist (the Step 8.5 signing block in route[TO_CARRIER] and the inbound
# Bandwidth branch in request_route). They NEVER gate a call and do not touch the
# SIP message — same posture as trunk_cps above. Low-cardinality labels only:
#
#   stir_attest_signed{attestation, zone}
#     attestation ∈ {A,B,C,div,unsigned} — the ACTUAL outbound outcome Kamailio
#       produced on the carrier-bound leg (the effective SHAKEN level after the
#       div→C gateway fallback is resolved, or "unsigned"/"div" as emitted).
#       A closed 5-value enum — NEVER a phone number or customer id.
#     zone = SBC_ID (east-sbc-1 …) — a handful of fixed node ids; stamped so a
#       per-zone breakdown is possible without the vmagent having to relabel.
#
#   stir_inbound_verstat{verstat, source, zone}
#     verstat ∈ {TN-Validation-Passed, TN-Validation-Failed, No-TN-Validation}
#       — the SHAKEN verification RESULT recorded for the inbound leg. Closed set.
#     source  ∈ {self, carrier, none} — WHERE the result came from: "self" = our
#       own secsipid_check_identity (Phase 2B), "carrier" = Bandwidth's verstat=
#       param lifted off the inbound P-Asserted-Identity, "none" = neither. Closed.
#     zone = SBC_ID, as above.
#
# The exporter prepends xhttp_prom_beginning ("kamailio_"), so the scraped names
# are kamailio_stir_attest_signed and kamailio_stir_inbound_verstat (the _total
# suffix is Prometheus-convention shorthand; the metric type is counter).
modparam("xhttp_prom", "prom_counter", "name=stir_attest_signed; label=attestation:zone;")
modparam("xhttp_prom", "prom_counter", "name=stir_inbound_verstat; label=verstat:source:zone;")

# ----- PostgreSQL Database Connection -----
# Used for SIP trunk IP authentication (trunk_auth_ips table lookup)
# Kamailio uses host networking, so DB is on localhost via PgBouncer
# The freeswitch DB user has SELECT access on trunk tables
modparam("sqlops", "sqlcon", "trunk=>postgres://__DB_USER__:__DB_PASS__@__DB_HOST__:__DB_PORT__/voip")

# ----- Hash Table for Trunk CPS Rate Limiting -----
# Per-trunk CPS tracking: key = trunk_id, value = call count in current second.
# autoexpire=1: the counter window is exactly one second. The previous value
# (autoexpire=2) let a counter span 2 seconds, allowing up to 2x the
# configured CPS limit through before the counter reset.
# updateexpire=0: do NOT refresh the expiry on each increment. Without this,
# sustained traffic (>= 1 call/sec) keeps pushing the expiry forward, the
# counter never resets, and it accumulates across seconds until it falsely
# trips the limit on legitimate traffic. With updateexpire=0 the entry
# expires 1s after creation regardless of updates — a true per-second window.
modparam("htable", "htable", "trunk_cps=>size=10;autoexpire=1;updateexpire=0")

# ----- Hash Table for Dispatcher-Event Monitor (carrier-monitor sidecar) -----
# Holds a single monotonically-increasing generation counter, "gen", that is
# bumped by event_route[dispatcher:dst-up|dst-down] on EVERY carrier gateway
# up/down transition (see the event routes near the end of this file).
#
# The co-located carrier-monitor sidecar cheaply reads this counter every few
# seconds via `kamcmd htable.get dsmon gen`; when the value changes it knows a
# transition just happened and fires an immediate full dispatcher.list snapshot
# + report to the API, instead of waiting up to its heartbeat interval. This is
# a pure read-side accelerator — it does NOT influence SIP routing or probing.
#
# size=2  -> 2^2 = 4 slots. Only ONE key ("gen") is ever stored, so the table
#            is deliberately tiny. (htable "size" is a power-of-2 exponent.)
# autoexpire=0 -> the counter NEVER expires. It must persist for the life of
#            the process so a monotonic delta is always meaningful to the reader
#            (an expiring counter could reset to $null between reads and be
#            misread as "no change" or spuriously "changed").
modparam("htable", "htable", "dsmon=>size=2;autoexpire=0")

# ----- Hash Table for FS-Aware Zone Health (FS-aware health, PR: FS-aware) -----
# Holds a single key, "fs_up", that reflects the reachability of the LOCAL
# FreeSWITCH dispatcher destination (group 1, sip:FREESWITCH_IP:5080):
#   1 = FS is ACTIVE (dispatcher probes are being answered)
#   0 = FS is DOWN   (dispatcher marked it inactive after ds_probing_threshold
#                     failed OPTIONS probes)
#
# It is maintained AUTHORITATIVELY by event_route[dispatcher:dst-up|dst-down]
# (near the end of this file), which the dispatcher module fires on every
# reachability transition. Reading this flag (rather than calling
# ds_is_active() inline) is deliberate: (a) it reuses the exact event-driven
# pattern the dsmon counter above already relies on in production, and (b) it
# sidesteps a known Kamailio 5.8 dispatcher bug (upstream issue #4001) where
# ds_is_active() can return true for a destination that is in the inactive+
# probing ("IP") state. The event routes only ever fire on a real state
# change, so the flag is a faithful mirror of dispatcher's own view.
#
# Consumers (both READ-ONLY, side-effect-free):
#   1. event_route[xhttp:request] GET /healthz  -> 200 when fs_up=1, 503 otherwise
#      (probed by the GCP NLB HTTP health check AND the DNS health check).
#   2. The inbound OPTIONS keepalive handler -> replies 503 instead of 200 to
#      external monitors when fs_up=0 (SIP-honest health; drains a dead-FS zone
#      via carrier/DNS failover, which the fail-open NLB alone cannot do).
#
# size=2 -> 4 hash buckets (buckets chain; not a capacity cap). autoexpire=0 ->
# the flags must persist for the life of the process (levels, not events); they
# are seeded to 1 in event_route[htable:mod-init] so that during the brief
# startup window BEFORE dispatcher completes its first probe cycle the zone
# advertises HEALTHY (fail-safe: a just-started SBC whose FS is fine must not
# 503 its way out of rotation before the first probe lands; a genuinely dead FS
# flips it to 0 within the probe-detection window — see the detection-window
# note in event_route[dispatcher:dst-down]).
#
# FS_HA_PAIR mode (FREESWITCH_IP_2 set) stores TWO extra per-node keys,
# "fs1_up" and "fs2_up", maintained by the same event routes; "fs_up" then
# becomes the ANY-NODE aggregate (fs1_up OR fs2_up). The /healthz and
# SIP-honest OPTIONS consumers read ONLY the aggregate, so a single-node death
# with a healthy standby does NOT drain the zone — the zone drains exactly and
# only when BOTH media nodes are down (today's single-FS zone-dark chain,
# unchanged). fs1_up/fs2_up additionally feed the A-leg Record-Route ;fsn=
# marker prediction (see the preset in request_route).
modparam("htable", "htable", "fshealth=>size=2;autoexpire=0")

#!ifdef WITH_TLS
# ----- TLS Module -----
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("tls", "tls_force_run", 1)
#!endif

# ----- STIR/SHAKEN (secsipid) -----
# Loaded unconditionally (harmless when signing is OFF); the signing calls
# themselves are gated by `#!ifdef STIR_SHAKEN_SIGN` in route[TO_CARRIER].
# Params are safe with signing OFF and correct for the future verify phase:
#   cache_dir    — on-disk cache for fetched x5u public keys (verify path,
#                  Phase 2B). Harmless for the signing-only path (we sign with a
#                  local key, no fetch). Kept small + world-nothing; the kamailio
#                  user owns /var/lib/kamailio (created + chowned in Dockerfile).
#   cache_expire — 3600s: how long a fetched cert stays cached (verify path).
#   timeout      — 5s: HTTP GET timeout for x5u fetch (verify path). Bounds any
#                  future cert-fetch so it can never hang the inbound INVITE.
#   expire       — 300s: max PASSporT `iat` age the module will accept when
#                  verifying. Does NOT affect our outbound `iat` (we set a fresh
#                  $Ts). Signing is unaffected by this value.
# NOTE: signing is local-key only and makes NO outbound HTTPS call; the fetch
# behavior above matters only once STIR_SHAKEN_VERIFY is wired (Phase 2B).
modparam("secsipid", "cache_dir", "/var/lib/kamailio/secsipid_cache")
modparam("secsipid", "cache_expire", 3600)
modparam("secsipid", "timeout", 5)
modparam("secsipid", "expire", 300)

# ----- STIR/SHAKEN inbound verify — CA trust anchors (Phase 2B) -----
# secsipid_check_identity() fetches the leaf cert from the Identity `info=`/x5u
# URL and verifies the PASSporT signature with that leaf's public key. Whether it
# ALSO validates the fetched cert CHAIN up to a trusted STI-CA root is controlled
# ENTIRELY by the libsecsipid `CertVerify` bitmask + the CA files below, set via
# the `libopt` modparam (name=value; may be repeated). These are NOT arguments to
# secsipid_check_identity — the function's only arg is keyPath (we pass "" so it
# downloads via x5u). Confirmed against Kamailio 5.8 secsipid_mod.c cmds[]/params[]
# and asipto/secsipidx SJWTLibOptSetS()/SJWTLibOptSetN() + pubKeyVerify().
#
# libsecsipid CertVerify flags (bitmask, verified against secsipidx
# secsipid/secsipid.go consts + pubKeyVerify()):
#   0       = NO chain validation — accept the fetched leaf as-is, verify only the
#             JWT signature. THIS IS THE DEFAULT and is byte-identical to a build
#             with no libopt lines at all. (Verifying INBOUND multi-carrier calls
#             this way trusts ANY reachable x5u — structural check only.)
#   1 (1<<0)= CertVerifyOptTime — validate the fetched x5u CERT's NotBefore/
#             NotAfter window. (PASSporT iat freshness is separate: checked
#             unconditionally in SJWTGetValidPayload regardless of this bitmask.)
#   2 (1<<1)= chain to the SYSTEM CA pool.
#   4 (1<<2)= chain to CertCAFile (custom root bundle — the iconectiv STI-PA list).
#   8 (1<<3)= use CertCAInter as intermediates.
#   16(1<<4)= CRL: screen the leaf's serial against CertCRLFile. CAUTION: the
#             library reads+parses the CRL per verification and its CRL branch
#             dereferences the x509.ParseCRL result WITHOUT checking the parse
#             error — a corrupt CertCRLFile would panic the Go runtime inside
#             Kamailio. ONLY the gated refresh tooling may write that file
#             (refresh-sbc-trust-bundle.sh: pinned-signature + freshness gates,
#             atomic rename), and deploy-sbc-verify.sh refuses bit 16 without a
#             parseable CRL on disk.
# For real STIR/SHAKEN inbound trust you want CertVerify=5 (time|custCA) with the
# STI-PA root bundle in CertCAFile; 21 (5|16) adds CRL screening once the CRL
# lifecycle is live.
#
# TEMPLATED, SAFE DEFAULT: entrypoint.sh emits `__STIR_VERIFY_CERT_MODE__` = 0 and
# `__STIR_VERIFY_CA_FILE__`/`__STIR_VERIFY_CA_INTER__` = empty unless the operator
# sets them. With CertVerify=0 these files are never opened, so an unset bundle is
# harmless and NEVER blocks a call (structural verify still runs, still fail-open).
# The OPERATOR populates CertCAFile with the STI-PA trusted-root list and sets
# STIR_VERIFY_CERT_MODE (e.g. 7) in the SBC .env to turn on true chain validation.
# NOTE: these apply process-wide, but no fetch/verify happens at all unless the
# STIR_SHAKEN_VERIFY ifdef block below actually calls secsipid_check_identity();
# with verify OFF the whole call path is byte-identical regardless of these values.
modparam("secsipid", "libopt", "CertVerify=__STIR_VERIFY_CERT_MODE__")
modparam("secsipid", "libopt", "CertCAFile=__STIR_VERIFY_CA_FILE__")
modparam("secsipid", "libopt", "CertCAInter=__STIR_VERIFY_CA_INTER__")
modparam("secsipid", "libopt", "CertCRLFile=__STIR_VERIFY_CRL_FILE__")

####### Routing Logic ########

# ============================================================================
# Prometheus metrics HTTP handler (xhttp_prom). NON-SIP path.
# ============================================================================
# Fires for HTTP requests arriving on the :8080 listener (SBC_INTERNAL_IP +
# 127.0.0.1). This is a completely separate event_route from the SIP
# request_route below — it never sees or touches SIP traffic and cannot affect
# call routing. The per-zone vmagent scrapes GET http://127.0.0.1:8080/metrics.
#
# Security posture: serve ONLY GET /metrics; reply 404 to anything else (no
# other path/verb is exposed, no admin surface). The listener is VPC-internal
# and not advertised, and firewall rules restrict :8080 to the zone vmagent.
event_route[xhttp:request] {
    # ---- FS-aware zone health probe: GET /healthz ----
    # Tiny, side-effect-free liveness signal for load balancers and DNS health
    # checks. Returns HTTP 200 while fshealth=>fs_up == 1 and HTTP 503 when it
    # is 0. fs_up semantics:
    #   - single-FS zone: the local FreeSWITCH dispatcher destination is ACTIVE.
    #   - FS_HA_PAIR zone: ANY-NODE aggregate — 1 while AT LEAST ONE of
    #     FS-1/FS-2 is active. A single media-node death with a healthy
    #     standby keeps /healthz at 200: the standby serves all new calls and
    #     the zone MUST NOT drain (that is the point of the pair). 503 means
    #     the zone has NO working media plane at all.
    # This is the endpoint the GCP regional NLB HTTP health check (port 8080,
    # path /healthz) AND the cross-zone DNS health check probe.
    #
    # IMPORTANT — what this does and does NOT achieve:
    #   - It DOES let an external DNS health checker and any HTTP monitor observe
    #     that this SBC's zone has lost its ENTIRE media plane, so DNS failover
    #     can remove the zone's VIP from the SIP hostname answer.
    #   - It does NOT, by itself, drain a fully-dead-media zone at the GCP NLB:
    #     GCP external passthrough NLBs FAIL OPEN (drop_traffic_if_unhealthy
    #     defaults to false), so when BOTH of a zone's SBCs report unhealthy —
    #     which is exactly what happens when all the zone's media nodes are
    #     down — the NLB keeps distributing inbound packets to them anyway. The
    #     effective full-zone drain therefore comes from the SIP-honest OPTIONS
    #     503 (below) and the DNS health check, NOT from this NLB health check.
    #
    # Reads the htable flag maintained by the dispatcher event routes — it does
    # NOT call ds_is_active() (see the fshealth htable note re: 5.8 issue #4001).
    # No dialog, no SIP message, no routing side effects.
    if ($rm == "GET" && $hu == "/healthz") {
        if ($sht(fshealth=>fs_up) == 1) {
            xhttp_reply("200", "OK", "text/plain", "OK fs_up=1\n");
        } else {
            xhttp_reply("503", "Service Unavailable", "text/plain", "UNAVAILABLE fs_up=0\n");
        }
        exit;
    }

    # Only GET /metrics is served; everything else is a hard 404.
    if ($rm != "GET" || $hu != "/metrics") {
        xhttp_reply("404", "Not Found", "text/plain", "not found");
        exit;
    }

    # Refresh the per-carrier-trunk active-call gauge from the "carrier_trunk"
    # valued dialog profile just before rendering. The value set into the
    # profile (in route[TO_CARRIER] and the inbound Bandwidth branch) is
    # "<carrier>:<direction>", where <carrier> is the fixed trunk-config enum.
    # We enumerate that closed set explicitly (dozens at most, NEVER a customer
    # id) and set kamailio_trunk_active_calls{trunk,direction} to the current
    # size. prom_gauge_set() exists in the 5.8 xhttp_prom build, so we set the
    # value directly (no reset+inc dance needed). get_profile_size() returns 0
    # into $var(n) when a profile value has no active dialogs, which correctly
    # publishes a 0 gauge for idle carrier/direction combinations.
    #
    # Outbound carrier values (from route[TO_CARRIER] X-Carrier selection):
    get_profile_size("carrier_trunk", "primary:outbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "primary", "outbound");
    get_profile_size("carrier_trunk", "secondary:outbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "secondary", "outbound");
    get_profile_size("carrier_trunk", "tc1:outbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "tc1", "outbound");
    get_profile_size("carrier_trunk", "tc2:outbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "tc2", "outbound");
    get_profile_size("carrier_trunk", "tc4:outbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "tc4", "outbound");
    # Inbound trunk-config values (from the inbound Bandwidth branch X-Inbound-TC):
    get_profile_size("carrier_trunk", "tc1:inbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "tc1", "inbound");
    get_profile_size("carrier_trunk", "tc2:inbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "tc2", "inbound");
    get_profile_size("carrier_trunk", "tc4:inbound", "$var(n)");
    prom_gauge_set("trunk_active_calls", "$var(n)", "tc4", "inbound");

    # Render all metrics (custom + xhttp_prom_stats="all" internals) and reply.
    prom_dispatch();
    exit;
}

# Helper: is the request/reply source ($si) an internal platform component?
# Covers FreeSWITCH and local tooling across all the network modes we run:
#   DOCKER_NETWORK       172.28.0.0/16   — local dev bridge network
#   LOCALHOST_NETWORK    127.0.0.0/8     — host-networking loopback
#   GCE_INTERNAL_NETWORK INTERNAL_SUBNET — this zone's VPC subnet
#   VOIP_SUBNET          MEDIA_SUBNET    — this zone's FS media subnet
# Returns 1 (true) for internal sources, -1 (false) otherwise, so callers
# use: if (route(IS_INTERNAL_SOURCE)) { ... }  /  if (!route(...)) { ... }
# NOTE: must return -1 for false, NOT 0 — in Kamailio, return 0 from a
# sub-route behaves like exit() and would silently stop the caller.
# Callable from request, failure, and reply routes ($si is valid in all).
route[IS_INTERNAL_SOURCE] {
    if (is_in_subnet($si, DOCKER_NETWORK) || is_in_subnet($si, LOCALHOST_NETWORK) || is_in_subnet($si, GCE_INTERNAL_NETWORK) || is_in_subnet($si, VOIP_SUBNET)) {
        return 1;
    }
    return -1;
}

# Main request route
request_route {
    # Per-request logging (L_DBG: fires on EVERY request — too hot for
    # L_INFO at 500+ CPS; raise debug level to see these breadcrumbs)
    xlog("L_DBG", ">>> $rm from $fu ($si:$sp) to $ru\n");

    # Trace all SIP messages to Homer via HEP — EXACTLY ONCE per hop.
    #
    # setflag(22) = trace_flag. When the flag is set, sip_trace() runs in
    # TRANSACTION mode (siptrace.c: "msg->flags & trace_flag -> the
    # SIPTRACE_TRANSACTION type"), which does TWO things:
    #   1. Traces THIS received request immediately (one row).
    #   2. Registers tm callbacks on the transaction that trace, once each:
    #        TMCB_REQUEST_SENT   — every forwarded branch (incl. the B-leg
    #                              carrier-facing INVITE/BYE after TO_CARRIER
    #                              cleanup — this is why the flag is required)
    #        TMCB_RESPONSE_IN    — every received reply
    #        TMCB_RESPONSE_SENT  — every relayed AND locally-generated reply
    #                              (e.g. our auto 100 Trying)
    #      Stateless sl replies (482 Merged, 403, OPTIONS 200) are traced via
    #      the module's SLCB_REPLY_READY callback (gated on FL_SIPTRACE,
    #      which transaction-mode tracing sets on the request).
    #
    # DO NOT add sip_trace() to reply_route for transaction-matched replies:
    # TMCB_RESPONSE_IN already captures them, and a second sip_trace() stores
    # every received reply TWICE (the historical node-100 duplicate rows in
    # the Homer SIP ladder). reply_route only traces the stateless residue —
    # see the comment there.
    setflag(22);
    sip_trace();

    # Enforce max forwards
    if (!mf_process_maxfwd_header("10")) {
        xlog("L_WARN", "Too many hops: $fu -> $ru\n");
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Determine if source is trusted (carrier or internal FreeSWITCH)
    # Flag 5 = trusted source (skip rate limiting and attack detection)
    # Static carriers: Bandwidth (IPs + subnets) and Sinch (origination-only
    # PoP IPs). Runtime-added carriers are NOT in this list — they are
    # DB-authenticated per-INVITE in route[CARRIER_TRUST] (which runs after
    # the untrusted-source pike/scanner gates, same as customer trunk auth).
    if ($si == BANDWIDTH_IP_1 || $si == BANDWIDTH_IP_2 || is_in_subnet($si, BANDWIDTH_NET_1) || is_in_subnet($si, BANDWIDTH_NET_2)) {
        setflag(5);
        xlog("L_DBG", "Trusted source: Bandwidth $si\n");
    } else if ($si == SINCH_DENVER_IP || $si == SINCH_CHICAGO_IP) {
        setflag(5);
        xlog("L_DBG", "Trusted source: Sinch $si\n");
    } else if (route(IS_INTERNAL_SOURCE)) {
        setflag(5);  # Trusted: Docker internal network (FreeSWITCH)
        xlog("L_DEBUG", "Trusted source: Docker internal $si\n");
    } else if ($si == SIPP_TESTING_IP) {
        setflag(5);
        xlog("L_INFO", "Trusted source: SIPp testing $si\n");
    }

    # Check if source IP is blocked (skip for trusted sources)
    if (!isflagset(5) && $sht(blocked=>$si) != $null) {
        xlog("L_WARN", "Blocked IP attempt: $si\n");
        # Silently drop - don't even respond (makes scanning harder)
        exit;
    }

    # Sanity checks - detect malformed SIP (always check, even trusted)
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp - $rm\n");
        if (!isflagset(5)) {
            $sht(ipreputation=>$si) = $sht(ipreputation=>$si) + 1;
            if ($sht(ipreputation=>$si) > 10) {
                $sht(blocked=>$si) = 1;
                xlog("L_WARN", "Blocking IP due to malformed SIP: $si\n");
            }
        }
        exit;
    }

    # Rate limiting with pike - SKIP for trusted sources (Bandwidth, FreeSWITCH)
    if (!isflagset(5)) {
        if (!pike_check_req()) {
            xlog("L_WARN", "Rate limit exceeded: $si ($rm)\n");
            $sht(blocked=>$si) = 1;
            sl_send_reply("503", "Service Unavailable - Rate Limited");
            exit;
        }

        # Scanner/attack detection - only for untrusted sources
        route(SCANNER_DETECT);
    }

    # CANCEL handling - must be processed before t_precheck_trans
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Retransmission handling
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # Handle in-dialog requests (BYE, re-INVITE, etc.)
    if (has_totag()) {
        route(WITHINDIALOG);
        exit;
    }

    # ---- Initial requests (no to-tag) ----

    # Record route for dialog-initiating requests so Kamailio stays in
    # the signaling path for in-dialog requests (BYE, re-INVITE, etc.)
    #
    # SKIP record_route() for FS-originated traffic (trusted + FS User-Agent):
    #   - TO_CARRIER path: doesn't need it, and it breaks msg_apply_changes()
    #     ("cannot apply msg changes after adding record-route header").
    #     All header cleanup in TO_CARRIER silently fails without this fix.
    #   - X-PBX-Dest path: adds its own record_route() later (line ~485).
    #
    # Double Record-Route for A-leg (Bandwidth -> Kamailio -> FS):
    #   Uses record_route_preset() with two URIs, same pattern as TO_CARRIER:
    #     outer = NLB VIP (ADVERTISE_IP) — Bandwidth sends ACK/BYE here
    #     inner = SIGNALING_VIP — FS sends in-dialog requests to the per-zone
    #             internal NLB VIP, which delivers to the ACTIVE SBC. (Before
    #             the active/standby cutover this token renders as
    #             SBC_INTERNAL_IP — FS pinned in-dialog requests to this
    #             specific SBC. With the ILB, a mid-call SBC death no longer
    #             strands FS's in-dialog requests: the VIP fails over.)
    #   Without this, enable_double_rr causes plain record_route() to put
    #   ADVERTISE_IP in BOTH entries (since all listen directives advertise
    #   the VIP). Bandwidth's ACK Route headers then both point to the VIP,
    #   the NLB picks a random SBC, and if it hits the wrong one the ACK is
    #   dropped (no dialog context) — causing 200 OK retransmission storms
    #   and eventual call teardown via "ACK Timeout" BYE from FreeSWITCH.
    #
    #   A-LEG ORDER IS REVERSED from B-leg (RFC 3261 Section 12.1.2):
    #   UAC (Bandwidth) REVERSES Record-Route to build Route headers.
    #   So we put SIGNALING_VIP FIRST, VIP SECOND in the Record-Route.
    #   Bandwidth reverses them → Route: VIP (reachable!), SIGNALING_VIP.
    #   If we used the B-leg order (VIP first), Bandwidth would reverse to
    #   Route: SIGNALING_VIP first — a private IP Bandwidth can't reach.
    #   ;r2=on ON THE FS-FACING (SIGNALING_VIP) ENTRY ONLY — FS-direction
    #   hairpin fix (loose.c after_loose()/is_2rr(), verified against the 5.8
    #   source): when loose_route() pops an own FIRST Route carrying r2 (and
    #   enable_double_rr=1), it ALSO consumes the next Route and forces the
    #   send socket to that URI's listen socket (loose.c:924-934 — the forced
    #   socket comes from the SECOND consumed Route, which is ALWAYS the
    #   ADVERTISE_IP entry here, so carrier-bound sends leave the external
    #   VIP socket regardless of whether the first Route was SIGNALING_VIP
    #   or a legacy SBC_INTERNAL_IP). FS's in-dialog ACK/BYE
    #   (Route: [SIGNALING_VIP;r2, VIP]) is therefore fully consumed in ONE
    #   traversal and relayed straight to the carrier from the VIP socket.
    #   Without r2 (removed 2026-08-03..2026-08-21) the leftover VIP Route
    #   made the SBC send the request TO ITSELF over loopback (the VIP is a
    #   local address) and stack a second own Via. r2 does NOTHING in the
    #   carrier->FS direction (the VIP is the first Route there and never
    #   carries r2) — carrier-side in-dialog requests are handled WITHOUT
    #   loose_route() by route[FROM_NET_INDIALOG]. See CLAUDE.md §8.10.
    #
    #   ;fs=5080 ON BOTH ENTRIES — the stateless carrier-side dispatch marker
    #   (CLAUDE.md §8.10): this preset creates A-LEG dialogs (carrier/PBX ->
    #   FS internal profile :5080; $dlg_var(fs_port)="5080" is set on the same
    #   path). Both sides echo our Record-Route set verbatim in their Route
    #   headers (and some shapes echo an RR URI as the R-URI), so ANY SBC —
    #   with ZERO dialog state — can read fs= from the incoming request and
    #   deliver a carrier-side in-dialog request to the correct FreeSWITCH
    #   profile port. The B-leg preset in TO_CARRIER carries ;fs=5090.
    #   Parameters on our own RR entries are inert to the rr module (is_myself
    #   matches host:port only; is_2rr/is_strict key on r2/lr specifically).
    if (is_method("INVITE|SUBSCRIBE")) {
        # TEST-PATH ONLY (SIPp load generator, $si == SIPP_TESTING_IP):
        # Use a SINGLE, plain Record-Route on the FS-facing internal socket
        # instead of the carrier double-RR (VIP + SBC_INTERNAL).
        #
        # Why the double-RR breaks the SIPp leg: SIPp lives INSIDE
        # INTERNAL_SUBNET and sends the INVITE straight to SBC_INTERNAL_IP
        # (not the NLB VIP). Its in-dialog ACK/BYE therefore never need to
        # traverse the VIP, and the VIP-rewritten Contact + the carrier
        # self-loop redirect in WITHINDIALOG (which sends "internal-source"
        # in-dialog requests to Bandwidth) misroute the test BYE to the
        # carrier instead of FS -> 200 OK retransmits, BYE 481. A single
        # plain RR makes the SIPp leg loose-route in ONE hop to FS exactly
        # like a simple internal call.
        #
        # SIPP_TESTING_IP defaults to 255.255.255.255 (disabled) in
        # production and can NEVER equal a Bandwidth carrier source IP, so
        # this branch is unreachable on the production carrier path — the
        # double-RR below is used for ALL real carrier and FS traffic.
        if ($si == SIPP_TESTING_IP) {
            record_route_preset("SBC_INTERNAL_IP:5060;lr");
        } else if (!(isflagset(5) && ($ua =~ "VoicePlatform" || $ua =~ "FreeSWITCH"))) {
#!ifdef FS_HA_PAIR
            # ;fsn=<node> — per-call FS NODE marker (strict active/standby FS
            # pair), companion to ;fs=<port>. The preset runs BEFORE
            # route[DISPATCH]'s ds_select_dst, and record_route_preset() may
            # not be called twice (rr_mod.c:419 FL_RR_ADDED "Double attempt to
            # record-route"), so the marker is the PREDICTED selection: alg 8
            # is deterministic (first non-INACTIVE in priority order), and the
            # fshealth fs1_up/fs2_up flags mirror dispatcher's own INACTIVE
            # transitions (event routes below), so predicting from the flags
            # equals the selection alg 8 makes microseconds later. fsn=2 is
            # emitted ONLY in the exact state where alg 8 will skip FS-1
            # (fs1_up=0, fs2_up=1); every other state (healthy, both-down,
            # startup-optimistic) predicts FS-1. A sub-millisecond
            # flag-vs-selection race, or an in-transaction ds_next_dst rescue,
            # can make the marker point at the non-serving node — the
            # $dlg_var(fs_node) tier in TO_FS_INDIALOG (written from the REAL
            # $du after selection) outranks the marker on the dialog-owning
            # SBC, which under SBC active/standby is where carrier in-dialog
            # requests land; the marker is the any-SBC stateless fallback.
            # NOTE both preset variants are STATIC literals (mechanism (a)).
            # 5.8's rr would also support PV args — it_list_fixup parses them
            # with pv_parse_format (rr_mod.c:110-113,223-237) and
            # w_record_route_preset evaluates per-request via pv_printf_s
            # (rr_mod.c:429/439) — but static variants keep the exact wire
            # strings grep-able here and in Homer.
            if ($sht(fshealth=>fs1_up) == 0 && $sht(fshealth=>fs2_up) == 1) {
                record_route_preset("SIGNALING_VIP:5060;r2=on;fs=5080;fsn=2;lr", "ADVERTISE_IP:5060;fs=5080;fsn=2;lr");
            } else {
                record_route_preset("SIGNALING_VIP:5060;r2=on;fs=5080;fsn=1;lr", "ADVERTISE_IP:5060;fs=5080;fsn=1;lr");
            }
#!else
            record_route_preset("SIGNALING_VIP:5060;r2=on;fs=5080;lr", "ADVERTISE_IP:5060;fs=5080;lr");
#!endif
        }
    }

    # Handle REGISTER - we don't accept registrations (Bandwidth uses IP auth)
    if (is_method("REGISTER")) {
        xlog("L_INFO", "Rejecting REGISTER from $si\n");
        sl_send_reply("403", "Forbidden - Registration Not Accepted");
        exit;
    }

    # Handle OPTIONS - respond for health checks
    if (is_method("OPTIONS")) {
        if (!isflagset(5)) {
            # Track OPTIONS floods (scanner behavior) only from untrusted sources
            $sht(ipcalls=>$si::options) = $sht(ipcalls=>$si::options) + 1;
            if ($sht(ipcalls=>$si::options) > OPTIONS_FLOOD_THRESHOLD) {
                xlog("L_WARN", "OPTIONS flood from $si - blocking\n");
                $sht(blocked=>$si) = 1;
                exit;
            }
        }

        # ---- FS-aware SIP-honest health (the piece the fail-open NLB can't do) ----
        # When the zone's media plane is DOWN (fs_up=0: the single FS in a
        # single-FS zone, or ALL nodes of an FS_HA_PAIR — one dead node with a
        # live standby keeps fs_up=1 and full 200 behavior), answer EXTERNAL
        # SIP health monitors with 503 instead of 200. This is the actual
        # mechanism that lets a fully-dead-media zone drain via the SIP/DNS
        # layer:
        #   - Bandwidth's OPTIONS keepalive toward this VIP sees the peer as
        #     unhealthy and stops offering inbound calls to this zone (exactly
        #     what we want for a zone that can no longer terminate a call), and
        #   - an external DNS health checker probing via SIP OPTIONS pulls this
        #     zone's VIP out of the trunk hostname's answer.
        # Kamailio itself is still up (it answers, just with 503) — without this,
        # every SBC keeps replying 200 to OPTIONS and NOTHING at the SIP layer
        # can tell that the zone lost its media server.
        #
        # SAFETY — the whole 503 branch is compiled in ONLY when FS_AWARE_OPTIONS
        # is defined (env default ON; set FS_AWARE_OPTIONS=0 to compile it out
        # with no code change). Two runtime guards keep it off the live healthy
        # path and off the internal plane:
        #   1. fshealth=>fs_up == 0   (local FS is actually down; when FS is
        #      healthy this whole block is skipped and OPTIONS get the usual 200,
        #      so Bandwidth's steady-state keepalive expectation is unchanged and
        #      there is no flapping risk while FS is up).
        #   2. NOT an internal source  (FreeSWITCH's own OPTIONS keepalive to
        #      this SBC, and local tooling/SIPp, MUST still get 200 — a 503 to
        #      the internal plane would be self-inflicted. route(IS_INTERNAL_SOURCE)
        #      returns true only for our VPC/media/loopback/docker subnets, so
        #      Bandwidth and customer-PBX monitors correctly fall through to 503
        #      while FS is the only thing that changed its answer.)
#!ifdef FS_AWARE_OPTIONS
        if ($sht(fshealth=>fs_up) == 0 && !route(IS_INTERNAL_SOURCE)) {
            xlog("L_WARN", "FS-aware OPTIONS: local FreeSWITCH DOWN — replying 503 to external monitor $si (drains this zone)\n");
            append_to_reply("Retry-After: 30\r\n");
            sl_send_reply("503", "Service Unavailable - Media Plane Down");
            exit;
        }
#!endif

        sl_send_reply("200", "OK");
        exit;
    }

    # Reject unsupported methods
    if (!is_method("INVITE|ACK|BYE|CANCEL|PRACK|NOTIFY|REFER|MESSAGE|SUBSCRIBE|UPDATE|INFO")) {
        xlog("L_WARN", "Unsupported method $rm from $si\n");
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # --- Source-based INVITE routing ---
    if (is_method("INVITE")) {
        # Set dialog flag for tracking
        setflag(4);

        if ($si == BANDWIDTH_IP_1 || $si == BANDWIDTH_IP_2 || is_in_subnet($si, BANDWIDTH_NET_1) || is_in_subnet($si, BANDWIDTH_NET_2) || $si == SINCH_DENVER_IP || $si == SINCH_CHICAGO_IP) {
            # INBOUND: carrier (Bandwidth or Sinch) -> Kamailio -> FreeSWITCH
            # All STATIC carrier ingress shares this branch: dedup, CPS
            # backstop, STIR capture, dispatch. Carrier-specific bits are
            # only the attribution headers (X-Inbound-Carrier/PoP) and the
            # X-Inbound-TC outbound-trunk selector below. Sinch is
            # origination-only — its calls still EGRESS via Bandwidth.

            # ---- Carrier duplicate INVITE suppression (all carrier ingress) ----
            # Bandwidth sends the same inbound call from multiple edge
            # proxies simultaneously (different source IPs and Call-IDs,
            # but identical From-user + To-user). Key on caller+DID so
            # only the first INVITE proceeds; duplicates arriving within
            # the 3-second TTL window are rejected per RFC 3261 sec 8.2.2.2.
            # The key is deliberately SOURCE-INDEPENDENT (no $si/carrier):
            # duplicates arrive from DIFFERENT edge IPs — that is the very
            # thing being deduplicated. Sinch round-robins whole calls (one
            # INVITE per call), so for Sinch this is an inert safety net.
            # Build dedup key using htable directly with inline PV expansion
            # Check if this caller+DID combo already has an in-flight call
            if ($sht(bw_dedup=>$fU::$tU) != $null) {
                xlog("L_WARN", "Duplicate carrier INVITE suppressed: $fU -> $tU from $si\n");
                sl_send_reply("482", "Loop Detected - Merged");
                exit;
            }
            # First occurrence — mark as in-flight (expires in 3s)
            $sht(bw_dedup=>$fU::$tU) = 1;

            # ---- Carrier inbound CPS flood backstop (all carrier ingress) ----
            # Counts NEW initial INVITEs per carrier source IP per second
            # (bw_cps htable: autoexpire=1, updateexpire=0 = fixed 1s window).
            # Keyed by $si, so Bandwidth and Sinch PoPs each get their own
            # independent BW_CPS_LIMIT backstop automatically.
            # Placement guarantees this NEVER throttles legitimate traffic
            # classes:
            #   - retransmissions: absorbed earlier by t_precheck_trans()
            #   - in-dialog requests: short-circuited earlier by has_totag()
            #   - OPTIONS keepalives: answered earlier in the OPTIONS block
            #   - carrier edge-proxy duplicates: rejected 482 by bw_dedup
            #     above, so they never reach this counter
            #   - FreeSWITCH/internal traffic: this is the carrier-source
            #     branch only — internal sources take the else-if below
            # Over-limit INVITEs get 503 + Retry-After so the carrier fails
            # over to another PoP / retries after backoff instead of
            # hammering this SBC.
            $sht(bw_cps=>$si) = $sht(bw_cps=>$si) + 1;
            if ($sht(bw_cps=>$si) > BW_CPS_LIMIT) {
                xlog("L_WARN", "Carrier CPS flood backstop tripped: $si at $sht(bw_cps=>$si) new INVITEs/sec — rejecting 503 ($fU -> $tU)\n");
                # Roll back the bw_dedup marker set above: a 503 tells
                # Bandwidth to try its next PoP for this call, and that
                # retry (same From/To, different edge proxy) must NOT be
                # 482'd as a duplicate — without this rollback, a
                # threshold-clipped legitimate call would be hard-killed
                # across all PoPs for the 3s dedup TTL.
                $sht(bw_dedup=>$fU::$tU) = $null;
                append_to_reply("Retry-After: 5\r\n");
                sl_send_reply("503", "Service Unavailable - Rate Limited");
                exit;
            }

            # Store FS port in dialog variable for in-dialog routing.
            # Inbound calls land on FS internal profile (5080).
            # This is read by route[WITHINDIALOG] to route BYE/re-INVITE
            # to the correct FS profile instead of hardcoding 5090.
            # dlg_manage() forces early dialog creation so $dlg_var() works
            # before t_relay() (which normally creates the dialog).
            dlg_manage();
            $dlg_var(fs_port) = "5080";

            # Stamp SBC identity for CDR/Homer tracking (inbound from carrier)
            append_hf("X-SBC-ID: __SBC_ID__\r\n");

            # ----------------------------------------------------------------
            # STIR/SHAKEN: preserve the inbound SHAKEN Identity CHAIN across
            # the FS B2BUA (Task 1.4). If Bandwidth sent Identity header(s),
            # the RCF `div` PASSporT built in route[TO_CARRIER] MUST re-emit
            # them as the base chain (RFC 8946 — never a bare `div`). The A-leg
            # (this INVITE) and the B-leg (FS -> carrier) are DIFFERENT dialogs
            # across the B2BUA, so the original Identity does NOT survive on its
            # own. We (a) stash it in a dialog var for logging/observability and
            # (b) pass it to FreeSWITCH as the custom header X-In-Identity so FS
            # can echo it back on the outbound B-leg (Task 2.4), where TO_CARRIER
            # re-emits every element byte-for-byte as the base Identity set. This
            # is capture-only and unconditional — it does NOT depend on the
            # signing toggle (harmless extra header when signing is OFF, and it
            # is stripped from the carrier-bound INVITE in TO_CARRIER regardless).
            # dlg_manage() already ran above, so $dlg_var() is valid here.
            #
            # MULTI-IDENTITY (RFC 8224 §4 permits several Identity header
            # fields): an ALREADY-DIVERTED inbound call arrives with base +
            # upstream div PASSporTs as SEPARATE Identity headers. Bare $hdr()
            # returns only the FIRST instance, which silently dropped the
            # upstream div chain across the B2BUA. Capture ALL instances
            # (capped at 4 = base + 3 divs; more is header-stuffing), joined
            # with '|' into ONE X-In-Identity value — FS reliably passes ONE
            # custom header through (repeated custom headers are NOT reliably
            # exposed/re-emitted by mod_sofia; session:getVariable returns one
            # value). DELIMITER CHOICE: '|' cannot occur inside a well-formed
            # Identity value — the JWS token is base64url + '.', the params are
            # tokens or an info=<absoluteURI>, and RFC 3986 gives '|' no place
            # in a URI (it MUST be %-encoded), unlike ',' which is a legal URI
            # sub-delim and could legally appear un-encoded inside info=<...>.
            # NOTE: Identity is NOT a comma-list header per the RFC 8224 ABNF
            # (one value per header field), so instance-wise capture is the
            # complete story — no intra-header comma splitting is ever needed.
            # FS treats the joined value as an opaque string; TO_CARRIER splits
            # on '|' and appends one "Identity: <element>" per element in the
            # ORIGINAL order, before appending our own div PASSporT.
            #
            # SPOOF-STRIP FIRST: the internal STIR annotation headers below
            # must only ever be OURS (this block / the verify block) or
            # FreeSWITCH's — a wire-supplied copy would shadow the trusted
            # value through FS's B-leg X-header echo (first-instance-wins in
            # $hdr()/session:getVariable), poisoning the div base chain or the
            # CDR verstat/attest facts. Same spoof-proofing as
            # X-Inbound-Carrier below. remove_hf marks RECEIVED headers only;
            # the append_hf lumps added afterwards are unaffected.
            remove_hf("X-In-Identity");
            remove_hf("X-Attestation");
            remove_hf("X-Verstat");
            remove_hf("X-Verstat-Source");
            remove_hf("X-Inbound-Attest");
            if (is_present_hf("Identity")) {
                $var(in_id_all) = $(hdr(Identity)[0]);
                if ($hdrc(Identity) > 1) {
                    $var(in_id_all) = $var(in_id_all) + "|" + $(hdr(Identity)[1]);
                }
                if ($hdrc(Identity) > 2) {
                    $var(in_id_all) = $var(in_id_all) + "|" + $(hdr(Identity)[2]);
                }
                if ($hdrc(Identity) > 3) {
                    $var(in_id_all) = $var(in_id_all) + "|" + $(hdr(Identity)[3]);
                }
                if ($hdrc(Identity) > 4) {
                    xlog("L_WARN", "STIR: inbound INVITE carried $hdrc(Identity) Identity headers — preserving first 4 only ($fU -> $tU, src $si)\n");
                }
                $dlg_var(inbound_identity) = $var(in_id_all);
                append_hf("X-In-Identity: $var(in_id_all)\r\n");
                xlog("L_DBG", "STIR: captured $hdrc(Identity) inbound Identity header(s) ($fU -> $tU), carrying to FS as X-In-Identity\n");
            }

#!ifdef STIR_SHAKEN_VERIFY
            # ----------------------------------------------------------------
            # STIR/SHAKEN inbound cryptographic verification (Phase 2B).
            # DARK BY DEFAULT: this whole block is compiled OUT unless
            # STIR_SHAKEN_VERIFY=on in the SBC .env (entrypoint emits the
            # #!define). With it OFF the call path is byte-identical to today.
            #
            # 100% FAIL-OPEN + ANNOTATE-ONLY. We run our OWN crypto check
            # (secsipid_check_identity) — we do NOT consume Bandwidth's result.
            # The outcome is stashed as a verstat for Homer/CDR correlation and
            # NOTHING ELSE: this block never sl_send_reply / 4xx / drop / exit,
            # never changes routing, and never touches the div chain. Every
            # path below falls straight through to the dispatch code that runs
            # today. secsipid's `timeout` (5s) bounds the x5u HTTPS fetch and
            # `cache_dir`/`cache_expire` (3600s) mean only the FIRST call per new
            # cert blocks on the fetch — steady state is an in-cache pubkey read.
            #
            # $dlg_var(verstat) is INTERNAL/observability only. It is NOT
            # surfaced to the downstream/terminating party (no P-Attestation-
            # Indicator / verstat toward FS or the forwarded-to leg) — that is
            # Phase 5 (deferred). It is stamped as an internal X-Verstat header
            # for HEP/Homer visibility; TO_CARRIER already strips FS-internal
            # X-* headers before the carrier, and this leg goes to FS (internal),
            # not the carrier, so it never leaks to Bandwidth.
            #
            # secsipid_check_identity(keyPath): keyPath "" => download the cert
            # via the Identity `info=`/x5u URL (Kamailio 5.8 docs). Returns 1 on
            # a valid PASSporT, negative (<0) on ANY failure — bad signature,
            # cert-fetch timeout, HTTP/URL error, expired iat, or module error.
            # The wrapper exposes only this int (no result pvar in 5.8), so we
            # map pass vs. fail; chain-to-CA is governed by the libopt CertVerify
            # modparams above, NOT by an argument here.
            #
            # SOURCE MARKER: when THIS block runs it is our OWN cryptographic
            # verdict, so every branch stamps X-Verstat-Source: self and records
            # $dlg_var(verstat_source)="self". The carrier-PAI capture below reads
            # that dlg var and DEFERS if self already produced a result (self wins
            # the precedence: self-verify > carrier PAI verstat > none).
            if (is_present_hf("Identity")) {
                if (secsipid_check_identity("")) {
                    # PASS — PASSporT signature valid (and, if CertVerify>0, the
                    # cert chained to a trusted STI-CA root).
                    $dlg_var(verstat) = "TN-Validation-Passed";
                    $dlg_var(verstat_source) = "self";
                    append_hf("X-Verstat: TN-Validation-Passed\r\n");
                    append_hf("X-Verstat-Source: self\r\n");
                    xlog("L_INFO", "STIR verify: PASS ($fU -> $tU, src $si) — TN-Validation-Passed (source=self)\n");
                } else {
                    # FAIL-OPEN — invalid signature / cert / fetch timeout /
                    # module error. Annotate and CONTINUE routing normally.
                    $dlg_var(verstat) = "TN-Validation-Failed";
                    $dlg_var(verstat_source) = "self";
                    append_hf("X-Verstat: TN-Validation-Failed\r\n");
                    append_hf("X-Verstat-Source: self\r\n");
                    xlog("L_WARN", "STIR verify: FAIL ($fU -> $tU, src $si) — TN-Validation-Failed, failing open (call proceeds, source=self)\n");
                }
            } else {
                # No Identity present on the inbound INVITE — nothing for OUR
                # crypto check to verify. Do NOT stamp a verstat/source here:
                # leaving it unset lets the carrier-PAI capture below still lift
                # Bandwidth's own verstat= (a PAI verstat can accompany a call
                # even when no Identity was relayed — e.g. the upstream verified
                # but did not pass the PASSporT along).
                # If the carrier path finds nothing either, it records "none".
                xlog("L_DBG", "STIR verify: no Identity header ($fU -> $tU, src $si) — deferring to carrier PAI verstat\n");
            }
#!endif

            # ----------------------------------------------------------------
            # STIR/SHAKEN inbound verstat CAPTURE — carrier-provided (T1).
            # ----------------------------------------------------------------
            # UNCONDITIONAL + additive + fail-open. This is NOT gated on
            # STIR_SHAKEN_VERIFY: Bandwidth PASSES the full inbound SHAKEN
            # Identity through to us (captured above for div chaining — proven
            # by live div-chain traces and the attestation capture below; an
            # early integration note claiming Bandwidth stripped Identity was
            # historical and wrong) and ALSO puts its own SHAKEN verdict in the
            # inbound P-Asserted-Identity as a `verstat=` user-part param,
            # e.g. (real trace):
            #   P-Asserted-Identity: "NAME" <sip:+15087282017;verstat=TN-Validation-Passed@67.231.13.185:5060>
            # so the carrier verstat is readable with our own verify OFF — it is
            # just reading a header. It NEVER rejects/reroutes and never touches
            # the SIP message except to append two internal X- headers that FS
            # reads (and that TO_CARRIER strips before any carrier ever sees them).
            #
            # PRECEDENCE (net rule): prefer OUR self-verify; else carrier PAI
            # verstat; else none. If the Phase 2B block above already set
            # $dlg_var(verstat_source) == "self", we DO NOT override it — self
            # wins. Otherwise we try to lift the carrier's verstat here.
            #
            # ROBUST PARSE: extract the verstat value from the PAI URI's user
            # part. In Bandwidth's format the param sits on the userinfo (before
            # the '@'), so $(hdr(P-Asserted-Identity){nameaddr.uri}) and the
            # tofrom/uri.param PVs (which parse only host-side URI params) do NOT
            # see it. We regex the raw header for `verstat=<token>` and accept only
            # the three canonical SHAKEN tokens (closed set) — anything else is
            # ignored, so a malformed/garbage param can never become a value or a
            # metric label. re.subst returns the input UNCHANGED on no match, so we
            # detect "matched" by the result differing from a sentinel.
            if ($dlg_var(verstat_source) == "self") {
                # Self-verify already produced the authoritative result above —
                # keep it, do nothing here (self > carrier).
                $var(vstat_final) = $dlg_var(verstat);
                $var(vstat_src_final) = "self";
            } else if (is_present_hf("P-Asserted-Identity")) {
                # Pull the whole PAI header text and try each canonical token in
                # turn. Bandwidth emits exactly one verstat token; testing the
                # closed set is simpler and safer than a capture-group regex.
                $var(pai_raw) = $hdr(P-Asserted-Identity);
                $var(vstat_final) = "";
                # Test the three canonical SHAKEN tokens against the raw header.
                # If none match (the common "carrier sent no verstat" case) the
                # value stays "" and we fall through to "none" below. Order:
                # Passed/Failed before No-TN-Validation (distinct literals; no
                # substring overlap, so order is not load-bearing — kept for
                # readability). =~ is a POSIX-regex match on the header string.
                if ($var(pai_raw) =~ "verstat=TN-Validation-Passed") {
                    $var(vstat_final) = "TN-Validation-Passed";
                } else if ($var(pai_raw) =~ "verstat=TN-Validation-Failed") {
                    $var(vstat_final) = "TN-Validation-Failed";
                } else if ($var(pai_raw) =~ "verstat=No-TN-Validation") {
                    $var(vstat_final) = "No-TN-Validation";
                }
                if ($var(vstat_final) != "") {
                    $dlg_var(verstat) = $var(vstat_final);
                    $dlg_var(verstat_source) = "carrier";
                    $var(vstat_src_final) = "carrier";
                    append_hf("X-Verstat: $var(vstat_final)\r\n");
                    append_hf("X-Verstat-Source: carrier\r\n");
                    xlog("L_INFO", "STIR verstat: carrier PAI verstat=$var(vstat_final) ($fU -> $tU, src $si) — source=carrier\n");
                } else {
                    # PAI present but no recognizable verstat param.
                    $var(vstat_final) = "No-TN-Validation";
                    $var(vstat_src_final) = "none";
                    xlog("L_DBG", "STIR verstat: PAI present but no verstat param ($fU -> $tU, src $si) — none\n");
                }
            } else {
                # No self-verify result and no PAI at all — nothing to record.
                $var(vstat_final) = "No-TN-Validation";
                $var(vstat_src_final) = "none";
                xlog("L_DBG", "STIR verstat: no self result and no PAI ($fU -> $tU, src $si) — none\n");
            }

            # ----------------------------------------------------------------
            # STIR/SHAKEN inbound ATTESTATION CAPTURE — carrier-provided (T1).
            # ----------------------------------------------------------------
            # UNCONDITIONAL + additive + fail-open, exactly like the verstat
            # capture above. This is NOT gated on STIR_SHAKEN_VERIFY: it is our
            # OWN crypto verdict (self-verify) that is gated — reading a plain
            # inbound header the carrier already put there is not. Now that
            # Bandwidth passes full SHAKEN, the inbound INVITE carries the
            # ORIGINATING carrier's attestation of the caller as a plain header,
            # e.g. (real trace):
            #   P-Attestation-Indicator: A
            # This is the caller's attestation (A/B/C), COMPLEMENTARY to verstat
            # (which is the pass/fail of THIS hop's verification). We lift it into
            # an internal X-Inbound-Attest header that FS reads into the CDR so
            # the UI can show the caller's attestation, not just pass/fail.
            #
            # NEVER rejects/reroutes and never touches the SIP message except to
            # append the internal X- header (+ a $dlg_var for symmetry with
            # verstat). TO_CARRIER already strips FS-internal X-* before any
            # carrier ever sees them, and this leg goes to FS (internal), so it
            # never leaks to Bandwidth. SANITIZE to the closed SHAKEN set
            # (A/B/C): match the raw header text with =~ against each canonical
            # letter (same closed-enum discipline as the verstat tokens above),
            # so a malformed/garbage indicator can never become a CDR value —
            # anything outside {A,B,C} is simply omitted (no header forwarded).
            if (is_present_hf("P-Attestation-Indicator")) {
                $var(attest_raw) = $hdr(P-Attestation-Indicator);
                $var(attest_final) = "";
                # Anchor on the header-name form (attestation=... is how the
                # value appears when Bandwidth folds it into PAI on some PoPs);
                # fall back to the bare letter for the plain-header form. Closed
                # set, so a stray letter elsewhere can never widen the value.
                if ($var(attest_raw) =~ "^[[:space:]]*A[[:space:]]*$" || $var(attest_raw) =~ "attest[a-z]*[=:][[:space:]]*A") {
                    $var(attest_final) = "A";
                } else if ($var(attest_raw) =~ "^[[:space:]]*B[[:space:]]*$" || $var(attest_raw) =~ "attest[a-z]*[=:][[:space:]]*B") {
                    $var(attest_final) = "B";
                } else if ($var(attest_raw) =~ "^[[:space:]]*C[[:space:]]*$" || $var(attest_raw) =~ "attest[a-z]*[=:][[:space:]]*C") {
                    $var(attest_final) = "C";
                }
                if ($var(attest_final) != "") {
                    $dlg_var(inbound_attest) = $var(attest_final);
                    append_hf("X-Inbound-Attest: $var(attest_final)\r\n");
                    xlog("L_INFO", "STIR attest: inbound P-Attestation-Indicator=$var(attest_final) ($fU -> $tU, src $si)\n");
                } else {
                    # Header present but not a recognizable A/B/C — omit (do not
                    # forward garbage). FS then records "" for stir_inbound_attest.
                    xlog("L_DBG", "STIR attest: P-Attestation-Indicator present but not A/B/C ($fU -> $tU, src $si) — omitting\n");
                }
            } else {
                # No P-Attestation-Indicator on the inbound INVITE — nothing to
                # capture. FS records "" for stir_inbound_attest (fail-open).
                xlog("L_DBG", "STIR attest: no P-Attestation-Indicator ($fU -> $tU, src $si) — none\n");
            }

            # Prometheus (T2): count the inbound verstat result + source + zone.
            # Low-cardinality closed enums only (verstat ∈ 3 values, source ∈
            # {self,carrier,none}, zone = SBC_ID). Pure metric — no SIP change.
            prom_counter_inc("stir_inbound_verstat", "1", "$var(vstat_final)", "$var(vstat_src_final)", "__SBC_ID__");

            # ----------------------------------------------------------------
            # Detect inbound trunk config from the carrier source IP.
            # FreeSWITCH uses X-Inbound-TC to select the matching outbound
            # trunk config, so the forwarded leg terminates through the same
            # trunk config the inbound arrived on. This avoids trunk mismatch
            # 603 Decline errors from Bandwidth.
            # Sinch-originated calls get tc4: termination stays Bandwidth
            # (Sinch is origination-only), and TC4 is the default egress
            # trunk config — there is no "matching" Sinch outbound trunk.
            # ----------------------------------------------------------------
            # Prometheus: inbound carrier-trunk label mirrors the X-Inbound-TC
            # value set in each branch — the fixed trunk-config enum
            # (tc1|tc2|tc4), never a customer id — EXCEPT the Sinch arm, which
            # labels "sinch" (still a closed enum: tc1|tc2|tc4|sinch) so
            # inbound metrics attribute traffic to the actual ingress carrier
            # instead of polluting the Bandwidth tc4 series. The HEADER stays
            # tc4 there (it selects the EGRESS trunk config, which is
            # Bandwidth); the label reports INGRESS.
            if ($si == SINCH_DENVER_IP || $si == SINCH_CHICAGO_IP) {
                append_hf("X-Inbound-TC: tc4\r\n");
                $var(inbound_tc_label) = "sinch";
                xlog("L_DBG", "Inbound trunk config: TC4 egress for Sinch origination (source $si)\n");
            } else if ($si == BANDWIDTH_TC1_NY || $si == BANDWIDTH_TC1_ATL) {
                append_hf("X-Inbound-TC: tc1\r\n");
                $var(inbound_tc_label) = "tc1";
                xlog("L_DBG", "Inbound trunk config: TC1 (source $si)\n");
            } else if ($si == BANDWIDTH_TC2_DAL || $si == BANDWIDTH_TC2_LA) {
                append_hf("X-Inbound-TC: tc2\r\n");
                $var(inbound_tc_label) = "tc2";
                xlog("L_DBG", "Inbound trunk config: TC2 (source $si)\n");
            } else if ($si == BANDWIDTH_IP_1 || $si == BANDWIDTH_IP_2) {
                append_hf("X-Inbound-TC: tc4\r\n");
                $var(inbound_tc_label) = "tc4";
                xlog("L_DBG", "Inbound trunk config: TC4 (source $si)\n");
            } else {
                # Unknown Bandwidth IP within trusted range — default to TC4
                append_hf("X-Inbound-TC: tc4\r\n");
                $var(inbound_tc_label) = "tc4";
                xlog("L_DBG", "Inbound trunk config: TC4 (default, source $si)\n");
            }

            # ---- Prometheus: per-carrier-trunk inbound CPS + active-call profile ----
            # Counterpart of the outbound emission in route[TO_CARRIER], with
            # direction "inbound". dlg_manage() ran above, so the dialog exists
            # for set_dlg_profile(). Neither call modifies the SIP message.
            #   trunk_cps{trunk,direction="inbound"}: +1 per inbound call attempt
            #     (this is the initial-INVITE path — retransmits/in-dialog/OPTIONS
            #     were all short-circuited earlier, and duplicates were 482'd, so
            #     each accepted inbound call is counted exactly once).
            #   carrier_trunk profile "<tc>:inbound": drives the scrape-time
            #     kamailio_trunk_active_calls{trunk,direction="inbound"} gauge.
            prom_counter_inc("trunk_cps", "1", "$var(inbound_tc_label)", "inbound");
            set_dlg_profile("carrier_trunk", "$var(inbound_tc_label):inbound");

            # ----------------------------------------------------------------
            # Inbound carrier attribution (CDR) — X-Inbound-Carrier/PoP.
            # ----------------------------------------------------------------
            # FS reads these into the `inbound_carrier`/`inbound_carrier_pop`
            # channel variables (inbound_router.lua) so every CDR records
            # which carrier and PoP originated the call. SPOOF-PROOF: strip
            # any wire-supplied copies FIRST — the values on the FS-bound leg
            # must be OURS, derived from the verified source IP, never
            # attacker/carrier-supplied text. (remove_hf marks received
            # headers for deletion; the append below is a separate add lump,
            # so ordering here is remove-then-append by construction. Plain
            # header lumps — same mechanism as X-SBC-ID/X-Inbound-TC above;
            # no msg_apply_changes() on this path, and record_route ordering
            # rules are unaffected.) TO_CARRIER strips both headers before
            # the B-leg reaches Bandwidth (FS copies received X-* headers to
            # the bridged leg — same reason X-Inbound-TC is stripped there).
            #
            # PoP mapping is BY MATCHED IP, not by define position:
            # BANDWIDTH_IP_1/IP_2 swap meaning per zone (East primary=Dallas,
            # West primary=LA), so the two carrier-routing PoPs are matched
            # as literals; TC1/TC2 PoPs via their fixed defines. An
            # unrecognized-but-trusted Bandwidth IP (subnet match) gets
            # carrier=bandwidth with NO PoP header — FS defaults the PoP to
            # "" (closed, bounded values only; never a raw IP in the CDR).
            remove_hf("X-Inbound-Carrier");
            remove_hf("X-Inbound-PoP");
            # Spoof-strip the table-driven egress selectors too:
            # X-Carrier-IP / X-Carrier-Label are FS-internal (set per
            # bridge attempt by inbound_router.lua) and must ONLY ever
            # reach route[TO_CARRIER] from FreeSWITCH. A wire-supplied
            # copy would ride the A-leg to FS, be echoed onto the bridged
            # B-leg like any received X-* header, and steer the outbound
            # egress IP. Stripped at every ingress (here, CARRIER_TRUST,
            # TRUNK_AUTH) — same spoof-proofing as X-Inbound-Carrier.
            remove_hf("X-Carrier-IP");
            remove_hf("X-Carrier-Label");
            if ($si == SINCH_DENVER_IP) {
                append_hf("X-Inbound-Carrier: sinch\r\n");
                append_hf("X-Inbound-PoP: denver\r\n");
            } else if ($si == SINCH_CHICAGO_IP) {
                append_hf("X-Inbound-Carrier: sinch\r\n");
                append_hf("X-Inbound-PoP: chicago\r\n");
            } else {
                append_hf("X-Inbound-Carrier: bandwidth\r\n");
                if ($si == "67.231.2.12" || $si == BANDWIDTH_TC2_DAL) {
                    append_hf("X-Inbound-PoP: dallas\r\n");
                } else if ($si == "216.82.238.134" || $si == BANDWIDTH_TC2_LA) {
                    append_hf("X-Inbound-PoP: la\r\n");
                } else if ($si == BANDWIDTH_TC1_NY) {
                    append_hf("X-Inbound-PoP: ny\r\n");
                } else if ($si == BANDWIDTH_TC1_ATL) {
                    append_hf("X-Inbound-PoP: atlanta\r\n");
                }
            }

            # NAT detection for inbound carrier traffic
            route(NAT_DETECT);
            xlog("L_DBG", "Inbound INVITE from carrier ($si) to $rU\n");
            route(DISPATCH);
        } else if (route(IS_INTERNAL_SOURCE)) {
            # TEST-PATH MARKER (SIPp load generator, $si == SIPP_TESTING_IP).
            #
            # MUST be set HERE, at the TOP of the internal-source INVITE
            # branch, BEFORE the UA-based sub-classification below. The SIPp
            # generator lives INSIDE INTERNAL_SUBNET, so its INVITE matches
            # route(IS_INTERNAL_SOURCE) and NEVER reaches the standalone
            # "else if ($si == SIPP_TESTING_IP)" test-dispatch branch further
            # down (that branch is shadowed for any internal source). Which
            # internal sub-branch a test INVITE lands in depends on its
            # User-Agent (SIPp sends none, so the empty-UA else at line ~824
            # is the common case, but a custom UA could match the FS regex and
            # fall into the TO_CARRIER sub-branch) — so the marker is hoisted
            # to the ONE point ALL internal INVITEs pass through, making it
            # independent of that sub-classification.
            #
            # dlg_manage() forces early dialog creation so the $dlg_var()
            # survives to in-dialog requests (BYE/ACK). Without a dialog the
            # var is dropped and the in-dialog BYE falls through to the carrier
            # self-loop redirect in WITHINDIALOG -> misrouted to Bandwidth ->
            # 481 + 200 OK retransmits. It is idempotent w.r.t. the sub-branch
            # dlg_manage() calls below (dialog module no-ops on the 2nd call).
            #
            # PRODUCTION SAFETY: gated entirely on $si == SIPP_TESTING_IP,
            # which defaults to 255.255.255.255 (unset in prod) and can NEVER
            # equal a Bandwidth carrier or FreeSWITCH source IP. On every real
            # call this block is a single false compare and sets nothing.
            if ($si == SIPP_TESTING_IP) {
                dlg_manage();
                $dlg_var(test_path) = "1";
            }
            # Distinguish FreeSWITCH (outbound) from SIPp/test tools (inbound test)
            # FreeSWITCH sends User-Agent: VoicePlatform/1.0 or FreeSWITCH
            # SIPp sends User-Agent: SIPp (or similar)
            if ($ua =~ "VoicePlatform" || $ua =~ "FreeSWITCH") {
                # OUTBOUND: FreeSWITCH -> Kamailio -> Bandwidth
                #
                # CRITICAL: Do NOT call route(NAT_DETECT) here.
                # NAT_DETECT calls force_rport() and fix_nated_contact(),
                # which cause two corruptions:
                #   1. force_rport() triggers Kamailio's core to add
                #      ;received=172.28.0.10;rport=5090 to FS's Via header.
                #      This annotation leaks Docker IPs and, when combined
                #      with Via line folding, merges with Max-Forwards.
                #   2. fix_nated_contact() rewrites FS's clean Contact
                #      (sip:mod_sofia@34.74.71.32:5090) to use the Docker
                #      source IP (172.28.0.10), which then appears as a raw
                #      line merged with Content-Type in the relayed INVITE.
                #
                # FreeSWITCH already sends correct public IPs via ext-sip-ip
                # and ext-rtp-ip. No NAT fixup is needed for outbound traffic.
                # Check if this is a trunk inbound delivery to a customer PBX
                # X-PBX-Dest header set by inbound_router.lua for trunk DID calls
                if (is_present_hf("X-PBX-Dest")) {
                    $var(pbx_ip) = $hdr(X-PBX-Dest);
                    xlog("L_DBG", "Trunk inbound delivery: routing to PBX at $var(pbx_ip)\n");

                    # Set destination and Request-URI to customer PBX IP
                    $du = "sip:" + $var(pbx_ip) + ":5060";
                    $rd = $var(pbx_ip);
                    $rp = 5060;

                    # Fix To header: replace 127.0.0.1 with public IP
                    # (subst requires constant patterns — can't use $var in replacement)
                    subst('/^(To:.*sip:[^@]+@)127\.0\.0\.1[^>]*/\1ADVERTISE_IP/');

                    # Fix From header: replace internal IPs with public
                    subst('/^(From:.*sip:[^@]+@)(10\.142\.[0-9]+\.[0-9]+|127\.0\.0\.1)[^>;]*/\1ADVERTISE_IP/');
                    subst('/^(P-Asserted-Identity:.*sip:[^@]+@)(10\.142\.[0-9]+\.[0-9]+|127\.0\.0\.1)[^>;]*/\1ADVERTISE_IP/');

                    # Remove ALL internal X- headers before the call leaves the
                    # platform toward customer PBX equipment. FreeSWITCH copies
                    # received X-* headers from the carrier A-leg onto this
                    # bridged leg (the same echo route[TO_CARRIER] compensates
                    # for), so besides the FS-set X-PBX-Dest this INVITE can
                    # carry X-In-Identity, X-Verstat / X-Verstat-Source,
                    # X-Inbound-Attest, X-Inbound-Carrier / X-Inbound-PoP /
                    # X-Inbound-TC, X-SBC-ID, X-FS-Support — none of which may
                    # reach a customer (internal STIR/routing observability +
                    # topology data). Regex strip (textops remove_hf_re, plain
                    # remove lumps applied at relay — same mechanism as the old
                    # explicit trio) instead of an allow-list, so any FUTURE
                    # internal X- header can never leak here by omission: NO X-
                    # header is ever intentionally delivered to a PBX on this
                    # path. Case-insensitive class because remove_hf_re matches
                    # the header name as a regex (no builtin case folding).
                    remove_hf_re("^[Xx]-");

                    # Record-Route for this leg so BYE/re-INVITE from PBX
                    # routes back through Kamailio. Use lr (loose route).
                    # The inbound leg (Bandwidth->FS) has its own Record-Route.
                    # This is a separate dialog leg (FS->PBX) that needs its own.
                    record_route();

                    # Fix SDP: replace any internal/loopback IPs with FS public IP.
                    # RTP goes to/from FS directly, not through the NLB.
                    if (has_body("application/sdp")) {
                        subst_body('/IN IP4 10\.142\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
                        subst_body('/IN IP4 127\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
                    }

                    # Record-Route already added on inbound leg — don't double-add
                    t_on_failure("TRUNK_DELIVERY_FAILURE");

                    if (!t_relay()) {
                        xlog("L_ERR", "Failed to relay to PBX $var(pbx_ip)\n");
                        sl_send_reply("503", "Service Unavailable");
                    }
                    exit;
                }

                xlog("L_DBG", "Outbound INVITE from FreeSWITCH ($si) to $rU via $du\n");
                route(TO_CARRIER);
            } else {
                # TEST TRAFFIC: SIPp or other internal test tools -> treat as inbound
                append_hf("X-SBC-ID: __SBC_ID__\r\n");
                route(NAT_DETECT);
                dlg_manage();
                $dlg_var(fs_port) = "5080";
                # test-path marker already set at the top of this internal-source
                # INVITE branch (gated on $si == SIPP_TESTING_IP), so WITHINDIALOG
                # skips the carrier topology-hide (Contact->VIP) and self-loop
                # redirect for this call's in-dialog ACK/BYE (from EITHER leg —
                # SIPp or the FS echo leg).
                xlog("L_INFO", "Test INVITE from $si (UA: $ua) to $rU - dispatching to FreeSWITCH\n");
                route(DISPATCH);
            }
        } else if ($si == SIPP_TESTING_IP) {
            # EXTERNAL SIPP TESTING: treat as inbound test traffic through SBC
            append_hf("X-SBC-ID: __SBC_ID__\r\n");
            route(NAT_DETECT);
            dlg_manage();
            $dlg_var(fs_port) = "5080";
            # Tag the dialog as test-path (see WITHINDIALOG). SIPP_TESTING_IP
            # can never equal a carrier IP, so this never affects production.
            $dlg_var(test_path) = "1";
            xlog("L_INFO", "SIPp test INVITE from $si to $rU - dispatching to FreeSWITCH\n");
            route(DISPATCH);
        } else {
            # UNKNOWN source — could be a SIP trunk customer (PBX) or a
            # runtime-added (DB-registered) origination carrier.
            #
            # PROTECTION PROFILE: both lookups below run ONLY here — after
            # the gates every untrusted source already traversed this
            # request: blocked-htable check, sanity_check, pike (50 req/s
            # per IP -> auto-block), SCANNER_DETECT (30 INVITEs/min -> auto-
            # block), t_precheck_trans retransmission absorption, and the
            # has_totag() short-circuit (in-dialog never reaches here). A
            # scanner therefore pays SIP-layer rejection long before it can
            # farm SQL: at most ~30 indexed point lookups per source IP per
            # minute, then it is blocked and silently dropped. This is the
            # SAME cost profile the existing TRUNK_AUTH query has had in
            # production.
            #
            # Order: TRUNK_AUTH first (existing customer path keeps its exact
            # position/latency), then CARRIER_TRUST as the fallback for
            # DB-registered carriers (rare path: day-one carriers are static-
            # trusted above; the DB path exists so a NEW carrier can be
            # admitted at runtime with an INSERT — no SBC redeploy).
            route(TRUNK_AUTH);
            # If TRUNK_AUTH returns (didn't exit), the IP is not a customer
            # trunk — try the DB-backed carrier trust fallback.
            route(CARRIER_TRUST);
            # If CARRIER_TRUST also returns, the IP is not authorized
            xlog("L_WARN", "INVITE from untrusted source: $si\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        exit;
    }

    # Non-INVITE initial requests from untrusted sources
    if (!isflagset(5)) {
        xlog("L_WARN", "Non-INVITE initial request $rm from untrusted $si\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Other initial requests from trusted sources - dispatch to FreeSWITCH
    route(DISPATCH);
}

# ====================================================================
# route[TO_FS_INDIALOG] — the ONE terminal delivery path for any in-dialog
# request that belongs to FreeSWITCH. Always exits.
# ====================================================================
# Resolves the FS profile port DETERMINISTICALLY and with ZERO dialog state
# where possible (CLAUDE.md §8.10):
#   1. ;fs=508x marker in a Route header — inserted in both Record-Route
#      entries at dialog establishment (A-leg preset: fs=5080, TO_CARRIER
#      preset: fs=5090) and echoed verbatim by the peer. Works on ANY SBC.
#   2. ;fs=508x marker in the R-URI — covers peers that use an RR URI as the
#      R-URI (observed Bandwidth behavior) and mixed-state strict-promoted
#      shapes where an RR URI was moved into the R-URI.
#   3. $dlg_var(fs_port) — dialog-owning SBC only (dialog db_mode=0), for
#      dialogs established BEFORE the fs= marker deploy. Needs
#      dlg_match_mode=1 (SIP-element fallback) because loose_route() has not
#      processed a ;did= here.
#   4. Guess 5090 (external profile) + serial 481-failover to the other
#      profile port (failure_route[FS_PORT_FAILOVER]) — pre-fs= dialogs
#      landing on the non-owner. ACK cannot be retried (no transaction);
#      a wrong-port pre-fs= ACK on the non-owner is accepted-lossy for the
#      deploy window (it was 100% lost before this fix).
# R-URI user: preserve $rU — for clean shapes it IS FS's own Contact user
# echoed back (A-leg: the TN; B-leg: mod_sofia), the exact target Sofia
# expects. Promoted/hostless shapes have no user -> fall back to $tU (the
# established behavior of the prior carrier->FS arms).
# Egress: $du = FREESWITCH_IP (192.168.x media subnet) is reachable ONLY via
# the VPC internal interface, so mhomed deterministically picks the internal
# socket (same mechanism as every route[DISPATCH] INVITE) — the BYE arrives
# at FS from an internal 10.x source, never from the SBC public IP and never
# via a VIP hairpin.
route[TO_FS_INDIALOG] {
    $var(fs_port) = 0;
    if ($hdr(Route) != $null && $hdr(Route) =~ "fs=5080") {
        $var(fs_port) = 5080;
    } else if ($hdr(Route) != $null && $hdr(Route) =~ "fs=5090") {
        $var(fs_port) = 5090;
    } else if ($(hdr(Route)[1]) != $null && $(hdr(Route)[1]) =~ "fs=5080") {
        $var(fs_port) = 5080;
    } else if ($(hdr(Route)[1]) != $null && $(hdr(Route)[1]) =~ "fs=5090") {
        $var(fs_port) = 5090;
    } else if ($ru =~ "fs=5080") {
        $var(fs_port) = 5080;
    } else if ($ru =~ "fs=5090") {
        $var(fs_port) = 5090;
    } else if ($dlg_var(fs_port) != $null) {
        # Pre-fs=-marker dialog, we are the owner. $dlg_var resolves via the
        # dialog module's unconditional Call-ID+from-tag+to-tag lookup
        # (dlg_get_msg_dialog — independent of dlg_match_mode; verified in
        # 5.8 dlg_handlers.c). Trust the port recorded at INVITE time.
        $var(fs_port) = $dlg_var(fs_port);
    } else {
        # Pre-fs=-marker dialog on the NON-owner (no dialog state here).
        # Guess the external profile and arm a one-shot 481 retry to the
        # internal profile. FS answers a wrong-profile in-dialog request
        # with 481 in <1ms on the internal net, so the retry is invisible
        # to the far end.
        $var(fs_port) = 5090;
        if (!is_method("ACK")) {
            $avp(fs_port_guess) = 5090;
            t_on_failure("FS_PORT_FAILOVER");
        }
        xlog("L_INFO", "TO_FS_INDIALOG: no fs= marker / no dialog state for $rm ($ci) — guessing port 5090 with 481-failover\n");
    }

#!ifdef FS_HA_PAIR
    # ---- FS NODE (host) resolution — strict active/standby pair only ----
    # Same tier philosophy as the port above, one level up (WHICH media box):
    #   1. $dlg_var(fs_node) — dialog-owning SBC only. Written in
    #      route[DISPATCH] from the REAL post-selection $du (and updated by
    #      DISPATCH_FAILURE's ds_next_dst rescue) and in TO_CARRIER from the
    #      B-leg source $si — ground truth, outranks the marker (the marker is
    #      a preset-time PREDICTION; see the A-leg preset). Under SBC
    #      active/standby the dialog owner is the active SBC, i.e. this tier
    #      decides nearly all production in-dialog requests.
    #   2. ;fsn=1/;fsn=2 marker in a Route header / the R-URI — stateless,
    #      works on ANY SBC (same echo mechanics as ;fs=). "fsn=" cannot
    #      false-match the port marker: "fs=5080"/"fs=5090" contain no 'n'
    #      between "fs" and "=", and the port regexes require the literal
    #      digit strings 5080/5090 which "fsn=1"/"fsn=2" never contain.
    #   3. Absent everywhere -> FS-1 (__FS_IP__). Pre-pair (legacy) dialogs
    #      carry no fsn and no fs_node and ALL live on FS-1 by construction —
    #      unchanged behavior — but the host was still a GUESS, so non-ACK
    #      requests arm the one-shot 481 OTHER-HOST retry (FS_PORT_FAILOVER).
    #      A genuine 481 from a KNOWN host (tier 1/2) is NEVER host-retried —
    #      it belongs to the carrier.
    $var(fs_host) = "__FS_IP__";
    $var(fs_host_known) = 0;
    if ($dlg_var(fs_node) != $null) {
        $var(fs_host_known) = 1;
        if ($dlg_var(fs_node) == "2") {
            $var(fs_host) = "__FS_IP_2__";
        }
    } else if (($hdr(Route) != $null && $hdr(Route) =~ "fsn=") || ($(hdr(Route)[1]) != $null && $(hdr(Route)[1]) =~ "fsn=") || $ru =~ "fsn=") {
        $var(fs_host_known) = 1;
        if (($hdr(Route) != $null && $hdr(Route) =~ "fsn=2") || ($(hdr(Route)[1]) != $null && $(hdr(Route)[1]) =~ "fsn=2") || $ru =~ "fsn=2") {
            $var(fs_host) = "__FS_IP_2__";
        }
    }
    if ($var(fs_host_known) == 0 && !is_method("ACK")) {
        $avp(fs_host_guess) = 1;
        t_on_failure("FS_PORT_FAILOVER");
        xlog("L_INFO", "TO_FS_INDIALOG: no fsn marker / no fs_node for $rm ($ci) — defaulting host FS-1 with 481 other-host failover\n");
    }
    # Carry the resolved target to failure_route[FS_PORT_FAILOVER] via avps
    # ($var is per-process scratch and does NOT survive into a failure route;
    # avps are transaction-bound). Only needed when a retry is armed.
    if ($avp(fs_port_guess) != $null || $avp(fs_host_guess) != $null) {
        $avp(fs_port_used) = $var(fs_port);
        if ($var(fs_host) == "__FS_IP_2__") {
            $avp(fs_node_used) = 2;
        } else {
            $avp(fs_node_used) = 1;
        }
    }
#!endif

    # NOTE: test the source PVs directly — a $var() can never hold $null
    # (a null assignment coerces to int 0, which would silently build
    # "sip:0@..."), so the null checks MUST be on $rU/$tU themselves.
    $var(fs_user) = "";
    if ($rU != $null) {
        $var(fs_user) = $rU;
    } else if ($tU != $null) {
        $var(fs_user) = $tU;
    }

    # Our Record-Route pair is the ENTIRE remaining route set for this
    # direction — FS is the endpoint and must not see Route headers (an
    # unconsumed Route would make Sofia try to route by it). Terminate the
    # set here instead of letting loose_route()'s RFC2543 strict-router
    # compatibility mangle it (see §8.10).
    remove_hf("Route");

#!ifdef FS_HA_PAIR
    if ($var(fs_user) == "") {
        $ru = "sip:" + $var(fs_host) + ":" + $var(fs_port);
    } else {
        $ru = "sip:" + $var(fs_user) + "@" + $var(fs_host) + ":" + $var(fs_port);
    }
    $du = "sip:" + $var(fs_host) + ":" + $var(fs_port);
#!else
    if ($var(fs_user) == "") {
        $ru = "sip:__FS_IP__:" + $var(fs_port);
    } else {
        $ru = "sip:" + $var(fs_user) + "@__FS_IP__:" + $var(fs_port);
    }
    $du = "sip:__FS_IP__:" + $var(fs_port);
#!endif
    xlog("L_INFO", "TO_FS_INDIALOG: $rm from $si -> $ru\n");
    route(RELAY);
    exit;
}

# One-shot serial failover for a GUESSED FS target (TO_FS_INDIALOG only —
# never armed when the markers/dialog vars fully resolved the target). FS's
# Sofia profiles are independent SIP agents: a wrong-profile OR wrong-node
# in-dialog request gets 481 "Call Leg/Transaction Does Not Exist". Exactly
# ONE retry total ($avp(fs_port_retried) guard); any second failure is
# relayed upstream as-is (a genuine 481 — dead dialog — must reach the
# carrier).
#   - Port guessed (pre-§8.10 legacy shape, tier 4): flip 5090 <-> 5080 on
#     the SAME host — the long-standing behavior. (Legacy dialogs predate the
#     pair, so they live on FS-1; when both port and host were guesses, the
#     port flip is the operative one and host correctly stays FS-1.)
#   - FS_HA_PAIR only — host guessed but port KNOWN from a ;fs= marker (no
#     ;fsn=, no $dlg_var(fs_node) — possible only for pre-pair dialogs
#     hitting a non-owner SBC): flip FS-1 <-> FS-2, keep the marker port. A
#     481 from a KNOWN host is never host-retried (see TO_FS_INDIALOG).
failure_route[FS_PORT_FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }
#!ifdef FS_HA_PAIR
    if (t_check_status("481") && ($avp(fs_port_guess) != $null || $avp(fs_host_guess) != $null) && $avp(fs_port_retried) == $null) {
        $avp(fs_port_retried) = 1;
        # Rebuild the target from the transaction-carried avps set in
        # TO_FS_INDIALOG ($var is per-process scratch and does not survive
        # into a failure route).
        $var(fs_host) = "__FS_IP__";
        if ($avp(fs_node_used) == 2) {
            $var(fs_host) = "__FS_IP_2__";
        }
        $var(fs_port) = $avp(fs_port_used);
        if ($avp(fs_port_guess) != $null) {
            # Port flip, same host (legacy-shape priority — see route header).
            if ($avp(fs_port_guess) == 5090) {
                $var(fs_port) = 5080;
            } else {
                $var(fs_port) = 5090;
            }
        } else {
            # Host flip, same (marker-known) port.
            if ($avp(fs_node_used) == 2) {
                $var(fs_host) = "__FS_IP__";
            } else {
                $var(fs_host) = "__FS_IP_2__";
            }
        }
        # Same $null coercion caveat as TO_FS_INDIALOG: test $rU/$tU directly.
        $var(fs_user) = "";
        if ($rU != $null) {
            $var(fs_user) = $rU;
        } else if ($tU != $null) {
            $var(fs_user) = $tU;
        }
        if ($var(fs_user) == "") {
            $ru = "sip:" + $var(fs_host) + ":" + $var(fs_port);
        } else {
            $ru = "sip:" + $var(fs_user) + "@" + $var(fs_host) + ":" + $var(fs_port);
        }
        $du = "sip:" + $var(fs_host) + ":" + $var(fs_port);
        xlog("L_INFO", "FS_PORT_FAILOVER: 481 on guessed target (port_guess=$avp(fs_port_guess) host_guess=$avp(fs_host_guess)) — retrying $rm ($ci) at $du\n");
        t_relay();
    }
#!else
    if (t_check_status("481") && $avp(fs_port_guess) != $null && $avp(fs_port_retried) == $null) {
        $avp(fs_port_retried) = 1;
        if ($avp(fs_port_guess) == 5090) {
            $var(fs_port) = 5080;
        } else {
            $var(fs_port) = 5090;
        }
        # Same $null coercion caveat as TO_FS_INDIALOG: test $rU/$tU directly.
        $var(fs_user) = "";
        if ($rU != $null) {
            $var(fs_user) = $rU;
        } else if ($tU != $null) {
            $var(fs_user) = $tU;
        }
        if ($var(fs_user) == "") {
            $ru = "sip:__FS_IP__:" + $var(fs_port);
        } else {
            $ru = "sip:" + $var(fs_user) + "@__FS_IP__:" + $var(fs_port);
        }
        $du = "sip:__FS_IP__:" + $var(fs_port);
        xlog("L_INFO", "FS_PORT_FAILOVER: 481 on guessed port $avp(fs_port_guess) — retrying $rm ($ci) on port $var(fs_port)\n");
        t_relay();
    }
#!endif
}

# ====================================================================
# route[FROM_NET_INDIALOG] — carrier/PBX-side in-dialog requests (§8.10).
# Called from route[WITHINDIALOG] BEFORE loose_route(). Always exits.
# ====================================================================
# Topology hiding rewrites FS's Contact to the VIP, so EVERY network-side
# in-dialog request arrives with R-URI == one of our own addresses. Feeding
# that to loose_route() triggers the rr module's RFC2543 strict-router
# compatibility (loose.c after_strict(): fires whenever R-URI==myself and a
# Route header exists): it sets $du to the FIRST Route (the VIP -> loopback
# self-hairpin), promotes the LAST Route into the R-URI verbatim, and leaves
# the route set destroyed. That promotion — not the NLB, not r2 — is what
# looped carrier BYEs into 481/408 (three prior partial fixes chased its
# output shapes; see CLAUDE.md §8.10 history). The request never needs rr:
# both Route entries are OURS and the real target is always this zone's
# FreeSWITCH — a deterministic rewrite, valid on ANY SBC with no dialog
# state and no owner/non-owner distinction.
#
# Re-INVITE (session refresh, hold): mirror the legacy in-dialog INVITE
# handling — NAT_DETECT (external source by construction of the caller's
# guard) + record_route() so this SBC stays in the path exactly as before;
# then the same deterministic FS delivery. In-dialog Record-Routes do not
# alter an established route set (RFC 3261 §12.2) — this matches the prior
# behavior byte-for-byte.
route[FROM_NET_INDIALOG] {
    # DIALOG TERMINATION on carrier/PBX-side in-dialog requests.
    #
    # This path DELIBERATELY bypasses loose_route() (§8.10), which means the
    # rr module's dlg_onroute callback — the ONLY way the dialog module
    # normally sees an in-dialog request — NEVER fires here. Without the
    # explicit dlg_manage() below, a carrier-originated BYE (caller-side
    # hangup of an inbound call) tears the media down correctly but the
    # dialog module never runs its state machine, so the CONFIRMED dialog
    # lingers until default_timeout (12h) as a ghost — inflating the
    # carrier_trunk active-call gauge and holding shared memory. (Verified
    # against 5.8 dlg_handlers.c: dlg_onroute is an rr-callback OR must be
    # invoked via dlg_manage(); there is no request-received hook.)
    #
    # dlg_manage() on a request WITH a to-tag (all of them here) runs
    # dlg_onroute(msg, NULL, NULL) with seq_match_mode=SEQ_MATCH_NO_ID, i.e.
    # it matches STRICTLY by Call-ID + from-tag + to-tag (get_dlg) — it does
    # NOT need loose_route()/;did= and cannot mis-match. It is idempotent
    # (dlg_onroute early-returns if the dialog is already bound to this msg),
    # so it can never double-count. For a BYE that reaches the dialog-OWNING
    # SBC it removes the dialog from the timer immediately and registers a
    # deferred TMCB_RESPONSE_OUT (register_tmcb(req,0,...)) that tm binds when
    # TO_FS_INDIALOG's t_relay() creates the transaction — so the dialog is
    # freed when FS's 200 OK is relayed back. For a re-INVITE it refreshes
    # the dialog's lifetime/state (which the bypass silently dropped before).
    # It ONLY touches dialog state — never the SIP message — so it is inert
    # to every §8.10 routing invariant.
    #
    # MULTI-SBC CAVEAT (not fully solvable without cross-SBC dialog sharing):
    # the carrier sends its in-dialog BYE to the VIP (the A-leg outer Route),
    # so the stateless NLB delivers it to EITHER SBC. dlg_manage() terminates
    # the dialog only when the BYE happens to land on the SBC that owns it
    # (db_mode=0, no replication). When it lands on the peer, get_dlg() finds
    # nothing locally and the owner's dialog still ages out at default_timeout.
    # This call is strictly an improvement (it eliminates the owner-hit ghosts
    # with zero call-path risk); eliminating the remaining peer-hit ghosts
    # needs dmq_dialog replication or a shorter default_timeout — a separate,
    # heavier decision, intentionally NOT bundled into this teardown fix.
    #
    # ACTIVE/STANDBY NOTE: with the NLB failover policy, ALL carrier traffic
    # lands on the ONE active SBC — the same SBC that owned the INVITE — so
    # the peer-hit ghost case above effectively disappears in steady state
    # (it can still occur transiently across a failover event, where the new
    # active SBC has no dialogs from before the switch; those age out at
    # default_timeout exactly as described).
    dlg_manage();
    if (is_method("INVITE")) {
        route(NAT_DETECT);
        record_route();
    }
    route(TO_FS_INDIALOG);
    exit;
}

# Within-dialog request handling
route[WITHINDIALOG] {
    # ================================================================
    # NETWORK-SIDE IN-DIALOG DISPATCH (carrier / trunk PBX) — §8.10 final.
    # MUST run BEFORE loose_route(): topology hiding makes R-URI == our own
    # address (the VIP) on every network-side in-dialog request, and
    # loose_route() answers R-URI==self + Route with its RFC2543 strict-
    # router recovery (after_strict), which destroys the route set (promoted
    # R-URI, $du = the VIP = a loopback self-hairpin). We never let rr see
    # these requests — see route[FROM_NET_INDIALOG].
    #
    # Guard anatomy (each clause is load-bearing):
    #   !IS_INTERNAL_SOURCE  — only carrier/PBX/public sources. FreeSWITCH
    #       (VOIP_SUBNET), peer SBCs + SIPp-internal + services
    #       (GCE_INTERNAL_NETWORK), docker and loopback all keep their
    #       existing loose_route() path below — including the TEST-PATH
    #       machinery, which is therefore untouchable by this arm.
    #   $si != SIPP_TESTING_IP — belt-and-suspenders for an EXTERNALLY
    #       homed SIPp (TESTING_IP set): test dialogs keep their dedicated
    #       TEST-PATH handling below. Defaults to 255.255.255.255 in prod.
    #   is_myself("$rd")     — the request targets one of OUR addresses (the
    #       VIP from the rewritten Contact, our SBC_INTERNAL from an echoed
    #       inner RR, incl. RR-URI-as-R-URI no-Route shapes). A trunk-
    #       delivery leg (X-PBX-Dest path) presents R-URI = FS's real
    #       Contact — NOT ours — and correctly stays on loose_route().
    # CANCEL never reaches WITHINDIALOG (handled at the top of
    # request_route via t_check_trans).
    if (!route(IS_INTERNAL_SOURCE) && $si != SIPP_TESTING_IP && is_myself("$rd")) {
        route(FROM_NET_INDIALOG);
        # not reached (FROM_NET_INDIALOG exits)
    }

    if (!loose_route()) {
        # Not a properly routed request
        if (is_method("ACK")) {
            # ACK without Route - check if we have the transaction
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            # ============================================================
            # ACK for 2xx: NOT an orphan — this is the normal case.
            #
            # Per RFC 3261 Section 17.1.1.3, the ACK for a 2xx response
            # is a SEPARATE transaction (not part of the INVITE transaction),
            # so t_check_trans() returns false. This is expected behavior.
            #
            # FreeSWITCH as a B2BUA generates the B-leg ACK independently.
            # It may not include Route headers from the Record-Route, so
            # loose_route() also fails. Without this fix, the ACK was
            # silently dropped here ("Orphan ACK"), causing the remote end
            # (Bandwidth) to never receive it. Bandwidth retransmits the
            # 200 OK and eventually sends BYE after ~28 seconds (64*T1
            # ACK timeout per RFC 3261 Section 13.3.1.4).
            #
            # For the outbound call (FS->Kamailio->Bandwidth):
            #   - Bandwidth's 200 OK Contact is NOT rewritten by REPLY_HANDLER
            #     (it only rewrites FS-originated replies)
            #   - So FS builds ACK with R-URI from Bandwidth's Contact:
            #     sip:+15087282017@67.231.2.12:5060
            #   - The R-URI already points to Bandwidth, so t_relay() will
            #     route correctly based on R-URI alone
            #   - We just need to topology-hide the FS headers before relay
            #
            # For inbound call (Bandwidth->Kamailio->FS):
            #   - FS's 200 OK Contact IS rewritten to Kamailio's address
            #   - Bandwidth sends ACK to Kamailio, R-URI may be our IP
            #   - We forward to FS using dispatcher/direct addressing
            # ============================================================
            xlog("L_DBG", "ACK for 2xx from $si (no Route header, no matching transaction) — R-URI: $ru\n");

            # TEST-PATH (SIPp): a no-Route ACK for the test call must reach FS,
            # never the carrier. With the single plain RR the ACK normally
            # loose-routes fine; this is a belt-and-suspenders fallback. Gated
            # on the dialog marker (set only for $si == SIPP_TESTING_IP), so it
            # is inert on every real carrier/FS call. See WITHINDIALOG TEST-PATH.
            if ($dlg_var(test_path) == "1") {
                $var(fs_port) = 5080;
                if ($dlg_var(fs_port) != $null) {
                    $var(fs_port) = $dlg_var(fs_port);
                }
#!ifdef FS_HA_PAIR
                # Pair mode: honor the node recorded at selection time so the
                # SIPp harness stays valid when the test call landed on FS-2.
                $var(fs_host) = "__FS_IP__";
                if ($dlg_var(fs_node) == "2") {
                    $var(fs_host) = "__FS_IP_2__";
                }
                $ru = "sip:" + $tU + "@" + $var(fs_host) + ":" + $var(fs_port);
                $du = "sip:" + $var(fs_host) + ":" + $var(fs_port);
#!else
                $ru = "sip:" + $tU + "@__FS_IP__:" + $var(fs_port);
                $du = "sip:__FS_IP__:" + $var(fs_port);
#!endif
                xlog("L_INFO", "TEST-PATH ACK (no Route) from $si — forwarding to FS $du\n");
                t_relay();
                exit;
            }

            # MIXED-STATE SAFETY NET (§8.10): a no-Route ACK whose R-URI is one
            # of OUR OWN addresses can only be a network-side ACK that came back
            # via our own Record-Route — either relayed here by a peer SBC still
            # running a pre-§8.10-final config (its strict-promotion left R-URI
            # = our SBC_INTERNAL and no Route), or a direct external ACK using
            # our RR URI as the R-URI (external ones are normally caught by the
            # FROM_NET_INDIALOG head arm; this catches internal-source relays).
            # It belongs to FS. Decide by R-URI, NOT $si: a relaying peer SBC
            # and FreeSWITCH are both IS_INTERNAL_SOURCE, but an FS-originated
            # no-Route ACK carries R-URI == the carrier Contact (never self).
            if (is_myself("$rd")) {
                xlog("L_INFO", "No-Route ACK from $si with R-URI=self ($rd) — delivering to FS\n");
                route(TO_FS_INDIALOG);
                # not reached (TO_FS_INDIALOG exits)
            }

            if (route(IS_INTERNAL_SOURCE)) {
                # ACK from FreeSWITCH heading to carrier.
                # R-URI points to Bandwidth's Contact (e.g., sip:+1xxx@67.231.2.12:5060).
                # (R-URI == self was already handled just above and sent to FS.)
                # Topology-hide FS headers before forwarding.
                xlog("L_DBG", "ACK from FS ($si) for 2xx — forwarding to carrier\n");

                remove_hf("Contact");
                msg_apply_changes();
                append_hf("Contact: <sip:$fU@ADVERTISE_IP:5060;transport=udp>\r\n");

                # Safety: if R-URI somehow points to ourselves (shouldn't happen
                # for outbound calls since Bandwidth's Contact is not rewritten),
                # force routing to Bandwidth.
                if (is_myself("$rd") || $rd == "127.0.0.1") {
                    # Reroute to this zone's primary PoP (BANDWIDTH_PRIMARY_IP).
                    $du = "sip:" + BANDWIDTH_IP_1 + ":5060";
                    xlog("L_WARN", "ACK R-URI pointed to self ($rd) — rerouting to Bandwidth $du\n");
                }

                t_relay();
                exit;
            } else {
                # ACK from external heading to FreeSWITCH with an R-URI that is
                # NOT ours (normal external R-URI==self ACKs are handled by the
                # FROM_NET_INDIALOG head arm). Same terminal delivery.
                xlog("L_DBG", "ACK from external ($si) for 2xx — R-URI was $ru — delivering to FS\n");
                route(TO_FS_INDIALOG);
                # not reached (TO_FS_INDIALOG exits)
            }
        }
        # ============================================================
        # In-dialog request (has To-tag) but no Route headers.
        #
        # This happens when Bandwidth sends BYE (or other in-dialog
        # requests) using the Record-Route URI as the R-URI. Per
        # RFC 3261 Section 12.2.1.1, the UAC sends the request to
        # the first Route URI, or if the route set is empty, to the
        # remote target (Contact). Bandwidth appears to use the
        # Record-Route URI directly as the R-URI without adding a
        # Route header, so loose_route() has nothing to process.
        #
        # The R-URI looks like:
        #   sip:34.74.71.32;lr=on;ftag=...;did=...
        # which is Kamailio's own address with RR params.
        #
        # For requests from Bandwidth (external), forward to FS.
        # For requests from FS (internal), forward to Bandwidth.
        # Same logic as the ACK handling above.
        # ============================================================
        if (is_method("BYE|CANCEL|UPDATE|PRACK|INFO|NOTIFY|REFER")) {
            # TEST-PATH (SIPp): a no-Route in-dialog request for the test call
            # must reach FS, never the carrier. Gated on the dialog marker
            # (set only for $si == SIPP_TESTING_IP) so it is inert on every
            # real carrier/FS call. This is the fallback that would have
            # prevented the misrouted-to-Bandwidth 481 even without the RR
            # change. See the WITHINDIALOG TEST-PATH fast exit above.
            if ($dlg_var(test_path) == "1") {
                $var(fs_port) = 5080;
                if ($dlg_var(fs_port) != $null) {
                    $var(fs_port) = $dlg_var(fs_port);
                }
#!ifdef FS_HA_PAIR
                # Pair mode: honor the node recorded at selection time (see
                # the TEST-PATH ACK arm above).
                $var(fs_host) = "__FS_IP__";
                if ($dlg_var(fs_node) == "2") {
                    $var(fs_host) = "__FS_IP_2__";
                }
                $ru = "sip:" + $tU + "@" + $var(fs_host) + ":" + $var(fs_port);
                $du = "sip:" + $var(fs_host) + ":" + $var(fs_port);
#!else
                $ru = "sip:" + $tU + "@__FS_IP__:" + $var(fs_port);
                $du = "sip:__FS_IP__:" + $var(fs_port);
#!endif
                xlog("L_INFO", "TEST-PATH $rm (no Route) from $si — forwarding to FS $du\n");
                t_relay();
                exit;
            }
            # MIXED-STATE SAFETY NET (§8.10): a no-Route in-dialog request whose
            # R-URI is one of OUR OWN addresses came back via our own Record-
            # Route — either relayed here by a peer SBC still running a
            # pre-§8.10-final config (its strict-promotion left R-URI = our
            # SBC_INTERNAL with no Route), or a direct external request using
            # our RR URI as the R-URI (external ones are normally caught by the
            # FROM_NET_INDIALOG head arm; this catches internal-source relays).
            # It belongs to FS. Decide by R-URI, NOT $si: a relaying peer SBC
            # and FreeSWITCH are both IS_INTERNAL_SOURCE, but an FS-originated
            # no-Route request carries R-URI == the carrier Contact (never
            # self) and falls through to the carrier arm below.
            if (is_myself("$rd")) {
                xlog("L_INFO", "No-Route $rm from $si with R-URI=self ($rd) — delivering to FS\n");
                route(TO_FS_INDIALOG);
                # not reached (TO_FS_INDIALOG exits)
            }
            if (route(IS_INTERNAL_SOURCE)) {
                # From FreeSWITCH heading to carrier — should be rare since
                # FS BYEs normally go through loose_route(), but handle it.
                # (R-URI is the carrier Contact here, NOT self — the is_myself
                # self case was already handled just above and sent to FS.)
                xlog("L_INFO", "$rm from FS ($si) without Route — forwarding to carrier\n");

                remove_hf("Contact");
                msg_apply_changes();
                append_hf("Contact: <sip:$fU@ADVERTISE_IP:5060;transport=udp>\r\n");

                if (is_myself("$rd") || $rd == "127.0.0.1") {
                    # Reroute to this zone's primary PoP (BANDWIDTH_PRIMARY_IP).
                    $du = "sip:" + BANDWIDTH_IP_1 + ":5060";
                    xlog("L_WARN", "$rm R-URI pointed to self ($rd) — rerouting to Bandwidth $du\n");
                }

                t_relay();
                exit;
            } else if (isflagset(5)) {
                # From a trusted external source heading to FreeSWITCH with an
                # R-URI that is NOT ours (normal external R-URI==self requests
                # are handled by the FROM_NET_INDIALOG head arm). Same terminal
                # delivery.
                xlog("L_DBG", "$rm from external ($si) without Route — R-URI was $ru — delivering to FS\n");
                route(TO_FS_INDIALOG);
                # not reached (TO_FS_INDIALOG exits)
            }
        }

        xlog("L_WARN", "In-dialog $rm without Route from $si (untrusted) — rejecting\n");
        sl_send_reply("404", "Not Found");
        exit;
    }

    # loose_route() succeeded — Route header was present and processed.
    #
    # ONLY internal-plane traffic reaches this branch (§8.10): every
    # network-side (carrier/PBX) in-dialog request has R-URI == our own
    # address (topology hiding) and exits via the FROM_NET_INDIALOG head arm
    # BEFORE loose_route(). What loose-routes here:
    #   - FS->carrier (ACK/BYE FS originates): Route [SIGNALING_VIP;r2, VIP]
    #     (legacy in-flight dialogs: [SBC_INTERNAL;r2, VIP] — both inner
    #     addresses are ours via listen+alias, handled identically),
    #     R-URI = the carrier's Contact (never rewritten). after_loose() pops
    #     the inner Route, sees r2 on it, consumes the VIP Route too and
    #     forces the VIP listen socket (from the SECOND consumed Route =
    #     ADVERTISE_IP in BOTH route-set generations) -> ONE traversal, one
    #     SBC Via, relayed straight to the carrier by R-URI (verified against
    #     5.8 loose.c).
    #     Dialogs established during the r2-less window (2026-08-03..21) pop
    #     only the inner Route; the leftover VIP Route wire-hairpins once via
    #     loopback and goes out on the second pass — degraded but functional,
    #     and it dies out with those dialogs.
    #   - SIPp TEST-PATH dialogs (single plain internal RR) -> the TEST-PATH
    #     fast exit below.
    #   - Trunk-delivery legs (X-PBX-Dest, plain record_route(), R-URI = FS's
    #     real Contact) -> own-Route pop, then relay by R-URI.

    # Log ACK specifically for debugging.
    if (is_method("ACK")) {
        xlog("L_DBG", "ACK routed via loose_route() from $si to $ru (du=$du) — forwarding\n");
    }

    # Validate dialog exists (if using dialog module)
    if (is_method("BYE|CANCEL")) {
        xlog("L_DBG", "$rm in dialog: $ci\n");
    }

    # ================================================================
    # TEST-PATH FAST EXIT (SIPp load generator only)
    # ================================================================
    # This dialog was tagged $dlg_var(test_path)=1 at INVITE time because
    # the A-party is the SIPp generator ($si == SIPP_TESTING_IP), which
    # lives INSIDE INTERNAL_SUBNET and signals directly to SBC_INTERNAL_IP
    # (bypassing the NLB VIP). Such a call uses a SINGLE plain Record-Route
    # (SBC_INTERNAL_IP), not the carrier double-RR, so loose_route() has
    # already consumed our one own-Route and set $du toward the far leg.
    #
    # We forward the in-dialog request (ACK/BYE/re-INVITE/UPDATE) straight
    # to FreeSWITCH on the dialog's fs_port and STOP — deliberately skipping
    # the two carrier-only behaviors below that break the test leg:
    #   1. the FS Contact -> VIP topology-hide rewrite, and
    #   2. the self-loop redirect that sends "internal-source" in-dialog
    #      requests to Bandwidth (which black-holed the SIPp BYE -> 481).
    # Both in-dialog directions of the test call are covered: the SIPp leg
    # ($si == SIPP_TESTING_IP) and the FS echo leg ($si == FS), because the
    # marker is dialog-scoped, not source-scoped.
    #
    # PRODUCTION SAFETY: $dlg_var(test_path) is set ONLY when the INVITE
    # source equals SIPP_TESTING_IP, which defaults to 255.255.255.255 and
    # can never be a Bandwidth carrier IP. On any real carrier/FS call this
    # variable is null and this block is skipped entirely.
    if ($dlg_var(test_path) == "1") {
        $var(fs_port) = 5080;  # test calls land on FS internal profile
        if ($dlg_var(fs_port) != $null) {
            $var(fs_port) = $dlg_var(fs_port);
        }
        # Rewrite R-URI to a clean FS target so FS matches the dialog even
        # if the far end used our Record-Route URI (VIP) as the R-URI.
#!ifdef FS_HA_PAIR
        # Pair mode: honor the node recorded at selection time (see the
        # TEST-PATH ACK arm above).
        $var(fs_host) = "__FS_IP__";
        if ($dlg_var(fs_node) == "2") {
            $var(fs_host) = "__FS_IP_2__";
        }
        $ru = "sip:" + $tU + "@" + $var(fs_host) + ":" + $var(fs_port);
        $du = "sip:" + $var(fs_host) + ":" + $var(fs_port);
#!else
        $ru = "sip:" + $tU + "@__FS_IP__:" + $var(fs_port);
        $du = "sip:__FS_IP__:" + $var(fs_port);
#!endif
        xlog("L_INFO", "TEST-PATH in-dialog $rm from $si — forwarding to FS $du (R-URI $ru)\n");
        route(RELAY);
        exit;
    }

    # (The 2026-08 "NON-OWNER SBC RELAY" and "STRICT-PROMOTED INNER-ROUTE"
    # guard blocks that used to live here are GONE — they were chasing
    # after_strict()'s output shapes. The FROM_NET_INDIALOG head arm removed
    # the generator: network-side requests never run loose_route() anymore,
    # so the shapes those blocks matched can no longer be produced on this
    # box. Mixed-state relays from peers still running the old config arrive
    # as internal-source no-Route requests and are handled by the
    # is_myself($rd) safety net in the no-Route arms above.)

    # Handle re-INVITEs (hold, codec changes, etc.)
    if (is_method("INVITE")) {
        # NAT handling ONLY for re-INVITEs from external sources (Bandwidth).
        # Do NOT apply NAT_DETECT to re-INVITEs from FreeSWITCH (Docker network)
        # because fix_nated_contact() would overwrite FS's clean Contact
        # (containing public IP via ext-sip-ip) with the Docker source IP.
        if (!route(IS_INTERNAL_SOURCE)) {
            route(NAT_DETECT);
        }
        record_route();
    }

    # Topology hiding for in-dialog requests from FreeSWITCH heading outbound
    # to Bandwidth. Covers re-INVITE (session refresh, hold/unhold, codec
    # change), BYE, UPDATE.
    #
    # CRITICAL: With host networking, FreeSWITCH sends from 127.0.0.1 and
    # its Contact already contains the public IP via ext-sip-ip, e.g.:
    #   Contact: <sip:mod_sofia@34.74.71.32:5090>
    # This does NOT match the old 172.28.* or sip:gw+ patterns, so the old
    # subst() calls did nothing and append_hf() added a SECOND Contact header.
    # Two Contact headers in a non-REGISTER request violates RFC 3261 and
    # causes Bandwidth to reject re-INVITEs, which kills session timer
    # refreshes and disconnects the call.
    #
    # Fix: Unconditionally remove_hf("Contact") + msg_apply_changes() +
    # append_hf() with Kamailio's identity. This ensures exactly one clean
    # Contact header regardless of what FreeSWITCH sent.
    if (route(IS_INTERNAL_SOURCE)) {
        # Remove FreeSWITCH's Contact unconditionally — it contains FS's
        # external profile address (34.74.71.32:5090) which would let
        # Bandwidth bypass Kamailio for subsequent requests.
        remove_hf("Contact");
        msg_apply_changes();
        # Present Kamailio's address so Bandwidth routes through us.
        append_hf("Contact: <sip:$fU@ADVERTISE_IP:5060;transport=udp>\r\n");

        # Rewrite private/internal IPs in SDP (re-INVITE, UPDATE with SDP).
        # ext-rtp-ip should handle this at FS level, but scrub as defense-in-depth.
        # Use FS_PUBLIC_IP: RTP goes to FS directly, not through the NLB.
        if (has_body("application/sdp")) {
            subst_body('/IN IP4 172\.28\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
            subst_body('/IN IP4 10\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
            subst_body('/IN IP4 127\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
        }
        xlog("L_DBG", "Topology-hid in-dialog $rm from FS ($si) — Contact rewritten to Kamailio\n");
    }

    # Self-loop detection: if after loose_route() the R-URI still points
    # to Kamailio, we must redirect to the actual destination instead of
    # relaying back to ourselves. Direction is decided by WHO SENT IT, with
    # "FS-ish" defined NARROWLY (media subnet / docker / loopback): a peer
    # SBC is IS_INTERNAL_SOURCE too, and a mixed-state peer relaying a
    # carrier request must land on the FS arm, never be bounced to the
    # carrier (that exact misclassification was one of the §8.10 failure
    # modes). Network-side sources normally never get here anymore (the
    # FROM_NET_INDIALOG head arm exits first) — this is pure belt-and-
    # suspenders for internal-plane shapes.
    xlog("L_DBG", "WITHINDIALOG self-loop check: rd=$rd rp=$rp ru=$ru si=$si method=$rm\n");
    if (is_myself("$rd")) {
        if (is_in_subnet($si, VOIP_SUBNET) || is_in_subnet($si, DOCKER_NETWORK) || is_in_subnet($si, LOCALHOST_NETWORK)) {
            # From FS but R-URI points to us — route to Bandwidth
            xlog("L_WARN", "In-dialog $rm from FS ($si) routed to self ($rd) after loose_route — rerouting to carrier\n");
            # Reroute to this zone's primary PoP (BANDWIDTH_PRIMARY_IP).
            $du = "sip:" + BANDWIDTH_IP_1 + ":5060";
        } else {
            # From anything that is NOT FreeSWITCH (peer SBC relay, or a
            # trusted external that slipped past the head arm) with R-URI ==
            # us: it came back via our own Record-Route and belongs to FS.
            xlog("L_WARN", "In-dialog $rm from $si routed to self ($rd) after loose_route — delivering to FS\n");
            route(TO_FS_INDIALOG);
            # not reached (TO_FS_INDIALOG exits)
        }
    }

    # ================================================================
    # FS->CARRIER in-dialog BYE — STATELESS forward (symptom 2 fix).
    # ================================================================
    # This is the loose_route()-succeeded tail; §8.10 guarantees only
    # internal-plane traffic reaches here. For an FS-originated BYE bound
    # to the carrier (R-URI = the carrier Contact, never one of ours),
    # t_relay() would create a UAC transaction whose 2xx can ONLY be
    # matched on THIS SBC (tm/t_lookup.c:t_reply_matching parses the top
    # Via branch's local hash_index+md5 — a per-proxy transaction key that
    # exists ONLY in the owning SBC's tm hash table; verified vs 5.8).
    # But loose_route()'s r2 double-pop already forced the VIP send socket
    # (rr/loose.c after_loose->rr_do_force_send_socket, arg 1), so this
    # SBC advertises the shared VIP in its Via. The carrier answers 200 OK
    # to the VIP; the stateless GCE NLB coin-flips it to EITHER SBC. When
    # it lands on the peer, t_check() finds no transaction (t_reply.c:2379
    # -> trans_not_found:2789 returns 1 = "core, forward statelessly"),
    # and core forward_reply() ships it to FS by via2 (FS's Via, which
    # carries received=<FS media IP>; core/forward.c:805 update_sock_
    # struct_from_via) — FS gets the reply, but the OWNER's UAC never does,
    # so tm retransmits the BYE on T1 back-off and emits a 408 at Timer F.
    # (Homer-confirmed: every 200 OK retransmit rode peer-SBC<->FS, never
    # the owner; the 408 carried FS's own BYE branch.) This is the exact
    # mirror of §8.10 — that fixed carrier->FS *requests* stranding on the
    # wrong SBC; this fixes FS->carrier *request replies* stranding.
    #
    # FIX: forward() this one shape STATELESSLY. No UAC transaction is
    # created, so nothing can strand: the 200 OK returns to the VIP, the
    # NLB delivers it to any SBC, and core forward_reply() ships it to FS
    # by via2 regardless of which SBC receives it — FS's own FS->SBC client
    # transaction matches it by FS's Via branch and closes the B-leg
    # cleanly (a single 200 OK, no T1 storm, no 408). Reliability lives at
    # the true endpoints (FS as UAC, carrier as UAS); any FS BYE retransmit
    # is simply re-forwarded (same From/To/Call-ID/CSeq branch — core/
    # forward.c:545 char_msg_val — so the carrier dedups it).
    #
    # SCOPE — EXACTLY FS-originated carrier-bound BYE, nothing else:
    #   - forward() honors the loose_route() output verbatim: it sends to
    #     $du (the carrier; core/action.c:412 uses msg->dst_uri) via
    #     msg->force_send_socket (get_send_socket(msg,...) -> core/
    #     forward.h:67 -> the VIP socket), and build_req_buf_from_sip_req()
    #     adds this SBC's Via advertising the VIP + received= on FS's Via
    #     (now via2) — byte-for-byte the wire shape t_relay() produced,
    #     minus the transaction. The r2 double-pop, ;fs= markers, topology
    #     hiding and the carrier egress IP all ran BEFORE this point and
    #     are untouched.
    #   - INVITE (re-INVITE session refresh/hold) is EXCLUDED: it needs the
    #     stateful onreply_route[REPLY_HANDLER] (183-SDP strip, Contact
    #     rewrite) + record_route() added just above — it stays on RELAY.
    #   - ACK is EXCLUDED: it awaits no reply, so it never stranded; leave
    #     its existing stateful relay unchanged.
    #   - Trunk/PBX-bound and every other in-dialog shape ($rd not carrier,
    #     or not from FS) stay on route(RELAY) exactly as before.
    # Observability note: the forwarded BYE copy loses only its tm
    # TMCB_REQUEST_SENT HEP row (no transaction); the received FS BYE is
    # still traced on ingress and the carrier's 200 OK is traced by the
    # reply_route stateless-residue sip_trace() — the ladder stays
    # reconstructable. This mirrors 81db4e5's accepted stateless-reply
    # tracing model.
    if (is_method("BYE") && route(IS_INTERNAL_SOURCE) && !is_myself("$rd")) {
        xlog("L_INFO", "FS->carrier BYE ($ci) — stateless forward to $du (NLB-safe 2xx return)\n");
        forward();
        exit;
    }

    # Sequential request - relay it
    route(RELAY);
    exit;
}

# NAT detection and handling
# Ensures external-facing SIP headers show the public IP, not Docker internal IPs
route[NAT_DETECT] {
    force_rport();

    if (nat_uac_test("19")) {  # Check private IP in Contact, Via received
        xlog("L_DEBUG", "NAT detected for $si\n");
        setbflag(6);  # Mark as NATted

        # Fix Contact header to use public IP
        if (is_method("INVITE|REGISTER|SUBSCRIBE")) {
            fix_nated_contact();
        }

        # Store original source for later
        $avp(RECEIVED) = $su;
    }
}

# Scanner/Attack detection
route[SCANNER_DETECT] {
    # Track authentication failures
    # This would be called after auth failure - placeholder for when we add auth

    # Detect INVITE floods (likely scanner or DoS)
    if (is_method("INVITE")) {
        $sht(ipcalls=>$si::inv) = $sht(ipcalls=>$si::inv) + 1;
        if ($sht(ipcalls=>$si::inv) > 30) {  # 30 INVITE/minute is suspicious
            xlog("L_WARN", "INVITE flood detected from $si\n");
            $sht(blocked=>$si) = 1;
            sl_send_reply("503", "Service Unavailable");
            exit;
        }
    }

    # Detect scanning patterns (sequential destinations)
    # Would need more sophisticated tracking in production
}

# ====================================================================
# SIP Trunk IP Authentication
# ====================================================================
# Authenticates outbound trunk calls from customer PBXs by source IP.
# Queries trunk_auth_ips table to find the matching trunk, then validates
# the trunk is enabled and applies CPS rate limiting.
#
# Call Flow:
#   Customer PBX (static IP) -> Kamailio:5060
#     -> IP lookup in trunk_auth_ips table
#     -> Verify trunk is enabled (sip_trunks.enabled = true)
#     -> Enforce per-trunk CPS rate limit
#     -> Set X-Trunk-ID and X-Customer-ID headers for FreeSWITCH
#     -> Dispatch to FreeSWITCH (same path as carrier inbound)
#     -> FreeSWITCH runs trunk_outbound.lua
#
# If authentication fails, the route returns (falls through) and the
# caller in request_route sends 403 Forbidden.
# If authentication succeeds, the route dispatches to FreeSWITCH and exits.
#
route[TRUNK_AUTH] {
    xlog("L_DBG", "Trunk auth check for IP: $si\n");

    # ----------------------------------------------------------------
    # Step 1: Look up source IP in trunk_auth_ips table
    # ----------------------------------------------------------------
    # Query joins trunk_auth_ips -> sip_trunks -> customers to get
    # trunk_id, customer_id, enabled status, and CPS limit in one query.
    # The INET column type in PostgreSQL handles IP comparison correctly.
    # We cast the IP string to INET for proper matching.
    sql_query("trunk",
        "SELECT t.id, t.customer_id, t.enabled, t.cps_limit, t.max_channels \
         FROM trunk_auth_ips i \
         JOIN sip_trunks t ON i.trunk_id = t.id \
         WHERE i.ip_address = '$si' \
         AND t.enabled = true \
         LIMIT 1",
        "ra");

    # Check if we got a result
    if ($dbr(ra=>rows) == 0) {
        # No trunk found for this IP — return to caller for 403
        xlog("L_INFO", "No trunk found for IP $si\n");
        return;
    }

    # Extract trunk details from query result
    $var(trunk_id) = $dbr(ra=>[0,0]);
    $var(customer_id) = $dbr(ra=>[0,1]);
    $var(trunk_enabled) = $dbr(ra=>[0,2]);
    $var(cps_limit) = $dbr(ra=>[0,3]);
    $var(max_channels) = $dbr(ra=>[0,4]);

    xlog("L_DBG", "Trunk auth matched: trunk_id=$var(trunk_id) customer=$var(customer_id) cps_limit=$var(cps_limit)\n");

    # ----------------------------------------------------------------
    # Step 2: Verify trunk is enabled
    # ----------------------------------------------------------------
    # Defense-in-depth: the SQL WHERE already filters enabled=true,
    # but check the value explicitly in case of query quirks.
    if ($var(trunk_enabled) != "t" && $var(trunk_enabled) != "true" && $var(trunk_enabled) != "1") {
        xlog("L_WARN", "Trunk $var(trunk_id) is disabled, rejecting $si\n");
        sl_send_reply("403", "Forbidden - Trunk Disabled");
        exit;
    }

    # ----------------------------------------------------------------
    # Step 3: Per-trunk CPS rate limiting
    # ----------------------------------------------------------------
    # Use htable to track calls per second per trunk.
    # The trunk_cps htable is a fixed 1-second window (autoexpire=1,
    # updateexpire=0) — see the modparam comment for the window semantics.
    # Key format: trunk_id::cps
    $sht(trunk_cps=>$var(trunk_id)::cps) = $sht(trunk_cps=>$var(trunk_id)::cps) + 1;
    if ($sht(trunk_cps=>$var(trunk_id)::cps) > $var(cps_limit)) {
        xlog("L_WARN", "CPS limit exceeded: trunk=$var(trunk_id) current=$sht(trunk_cps=>$var(trunk_id)::cps) limit=$var(cps_limit)\n");
        sl_send_reply("503", "Service Unavailable - CPS Limit Exceeded");
        exit;
    }

    # ----------------------------------------------------------------
    # Step 4: Set custom SIP headers for FreeSWITCH
    # ----------------------------------------------------------------
    # These headers tell FreeSWITCH which trunk/customer the call belongs to.
    # FreeSWITCH reads them as channel variables: sip_h_X-Trunk-ID, etc.
    # trunk_outbound.lua uses these to validate the DID, set caller ID,
    # and select the carrier gateway.
    # Spoof-strip the FS-internal egress selectors at PBX ingress first
    # (same spoof-proofing as X-Inbound-Carrier at carrier ingress): a
    # customer PBX must never be able to steer route[TO_CARRIER]'s egress
    # IP by smuggling X-Carrier-IP/X-Carrier-Label through FS's B-leg
    # X-header echo. Only FreeSWITCH may originate these headers.
    remove_hf("X-Carrier-IP");
    remove_hf("X-Carrier-Label");
    # Spoof-strip the internal STIR annotation headers too (same reason,
    # same FS B-leg X-header echo): a customer PBX injecting X-In-Identity
    # could plant a forged "preserved inbound Identity" that TO_CARRIER
    # re-emits as a base PASSporT when the trunk call carries a Diversion
    # (div trigger), and injected X-Verstat / X-Verstat-Source /
    # X-Inbound-Attest would be recorded verbatim as trusted CDR STIR facts
    # by trunk_outbound.lua. X-Attestation is overwritten by FS on the
    # B-leg, but strip the received copy anyway so it can never surface as
    # a duplicate header instance. Only Kamailio/FreeSWITCH may originate
    # any of these.
    remove_hf("X-In-Identity");
    remove_hf("X-Attestation");
    remove_hf("X-Verstat");
    remove_hf("X-Verstat-Source");
    remove_hf("X-Inbound-Attest");
    append_hf("X-Trunk-ID: $var(trunk_id)\r\n");
    append_hf("X-Customer-ID: $var(customer_id)\r\n");
    append_hf("X-Max-Channels: $var(max_channels)\r\n");
    # Stamp SBC identity for CDR/Homer tracking (trunk auth path)
    append_hf("X-SBC-ID: __SBC_ID__\r\n");

    xlog("L_DBG", "Trunk $var(trunk_id) authenticated for IP $si, dispatching to FreeSWITCH\n");

    # Store FS port in dialog variable for in-dialog routing.
    # Trunk calls land on FS internal profile (5080), same as carrier inbound.
    # dlg_manage() forces early dialog creation so $dlg_var() works.
    dlg_manage();
    $dlg_var(fs_port) = "5080";

    # ----------------------------------------------------------------
    # Step 5: Dispatch to FreeSWITCH
    # ----------------------------------------------------------------
    # Same dispatch path as carrier inbound — FreeSWITCH's dialplan
    # will detect the X-Trunk-ID header and route to trunk_outbound.lua
    route(DISPATCH);
    exit;
}

# ====================================================================
# DB-Backed Carrier Trust (runtime-added origination carriers)
# ====================================================================
# Fallback trust path for carrier ingress IPs that are NOT in the static
# compile-time trust list (BANDWIDTH_*/SINCH_* defines). Lets ops admit a
# NEW origination carrier/PoP at runtime with a single carrier_trunks INSERT
# (managed via TED) — no SBC config change, no redeploy, no restart.
#
# STATIC vs DB TRUST MODEL:
#   - Static carriers (Bandwidth, Sinch): trusted at the TOP of request_route
#     (flag 5) for EVERY request — they skip pike/scanner entirely and take
#     the shared carrier-ingress INVITE branch (bw_dedup + bw_cps backstop).
#   - DB carriers: authenticated HERE, per initial INVITE, AFTER the full
#     untrusted-source gauntlet (blocked htable, sanity, pike, SCANNER_DETECT)
#     — the SAME protection profile as customer TRUNK_AUTH, so a scanner
#     cannot cheaply trigger SQL (it is rate-limited and auto-blocked at the
#     SIP layer first; worst case ~30 indexed point lookups/min per IP).
#     Consequences of NOT being flag-5 trusted process-wide:
#       * non-INVITE initial requests (e.g. OPTIONS) get standard untrusted
#         handling (OPTIONS answered 200/503 but flood-tracked at
#         OPTIONS_FLOOD_THRESHOLD per 60s — keep DB-carrier probes >= 5s
#         apart), and ALL requests remain subject to pike (PIKE_THRESHOLD
#         req/s per IP). A permanent/high-CPS carrier should be PROMOTED to
#         a static define; the DB path is the runtime admission valve.
#       * in-dialog requests need no trust: they are handled before this
#         point by the carrier-agnostic WITHINDIALOG/FROM_NET_INDIALOG arms.
#
# FAIL-CLOSED: if the DB is unreachable or the query errors, this route
# simply returns and the caller sends 403 — a DB outage can NEVER admit an
# unknown source. Blast radius: DB-only carriers lose NEW inbound calls
# while the DB is down; STATIC carriers (Bandwidth, Sinch) are entirely
# unaffected (their trust is compile-time, no DB on their path). In-flight
# dialogs are unaffected either way.
#
# TABLE CONTRACT (created by migration 40): carrier_trunks(carrier, pop,
# trunk_group, source_ip inet, test_tn, direction, cps_limit, enabled, ...).
# Row values are ADMIN-PROVISIONED config (closed vocabulary maintained in
# TED), not wire input — safe to embed in headers/htable keys. '$si' is the
# kernel-reported source address of the packet (a parsed IP literal, not
# attacker-supplied text), same interpolation TRUNK_AUTH has used in
# production — not an injection surface.
#
# On a HIT the call gets the same inbound treatment as static carrier
# ingress: dedup (shared bw_dedup — same source-independent key), per-row
# CPS admission (carrier_cps htable), spoof-proofed X-Inbound-Carrier/PoP
# attribution, X-SBC-ID, Identity capture for STIR div chaining, dialog
# fs_port=5080, NAT_DETECT, dispatch to FS. The carrier double Record-Route
# was already applied in request_route (unknown sources take the non-FS
# preset branch), so in-dialog routing is identical to static carriers.
# Deliberately NOT duplicated here: the Bandwidth-PAI verstat/attest capture
# blocks (observability-only, Bandwidth header format) and the closed-enum
# Prometheus trunk_cps/profile emission (a DB-sourced carrier name is not a
# bounded metric label).
#
route[CARRIER_TRUST] {
    xlog("L_DBG", "DB carrier trust check for IP: $si\n");

    # Single indexed point lookup on the LOCAL zone replica (same sqlops
    # "trunk" connection as TRUNK_AUTH — reads go to the per-zone PgBouncer).
    # Check $rc explicitly (sql_query returns <0 on any DB/connection error):
    # on ANY sql error, fail closed (the caller 403s). direction gate: only
    # rows provisioned for inbound may admit ingress ('outbound'-only rows
    # never trust a source IP).
    sql_query("trunk",
        "SELECT carrier, pop, cps_limit FROM carrier_trunks \
         WHERE source_ip = '$si'::inet \
         AND direction IN ('inbound','both') \
         AND enabled = true \
         LIMIT 1",
        "ca");
    if ($rc < 0) {
        xlog("L_WARN", "CARRIER_TRUST: DB query failed for $si — failing closed (static carriers unaffected)\n");
        return;
    }

    if ($dbr(ca=>rows) == 0) {
        # Not a DB-registered carrier — fall through to the caller's
        # existing unknown-source handling (403).
        xlog("L_DBG", "CARRIER_TRUST: no carrier_trunks row for $si\n");
        return;
    }

    # NULL-safe extraction: carrier is the attribution/CPS anchor — a
    # malformed row (NULL/empty carrier) is treated as a miss (fail closed)
    # rather than admitting traffic with an unusable identity. pop may be
    # legitimately empty; coerce NULL -> "" so it can never surface as a
    # stray int 0 in headers or htable keys.
    if ($dbr(ca=>[0,0]) == $null || $dbr(ca=>[0,0]) == "") {
        xlog("L_WARN", "CARRIER_TRUST: carrier_trunks row for $si has NULL/empty carrier — failing closed\n");
        return;
    }
    $var(cx_carrier) = $dbr(ca=>[0,0]);
    $var(cx_pop) = "";
    if ($dbr(ca=>[0,1]) != $null) {
        $var(cx_pop) = $dbr(ca=>[0,1]);
    }
    $var(cx_cps) = $dbr(ca=>[0,2]);
    xlog("L_INFO", "CARRIER_TRUST: $si matched carrier=$var(cx_carrier) pop=$var(cx_pop) cps_limit=$var(cx_cps)\n");

    # Trusted for the remainder of THIS request's processing (parity with
    # static carrier treatment downstream; the gates above already ran).
    setflag(5);

    # ---- Carrier duplicate INVITE suppression (shared bw_dedup) ----
    # Same source-independent caller+DID key as the static carrier branch —
    # multi-PoP duplicate submissions of the SAME call must dedup across
    # source IPs and across static/DB carriers alike.
    if ($sht(bw_dedup=>$fU::$tU) != $null) {
        xlog("L_WARN", "Duplicate carrier INVITE suppressed (DB carrier): $fU -> $tU from $si\n");
        sl_send_reply("482", "Loop Detected - Merged");
        exit;
    }
    $sht(bw_dedup=>$fU::$tU) = 1;

    # ---- Per-carrier CPS admission (carrier_cps htable) ----
    # Keyed carrier::pop from the DB row; fixed 1-second window (autoexpire=1,
    # updateexpire=0). Limit is the row's cps_limit. NULL/0 = no per-row
    # limit (the pike gate above still bounds the source at PIKE_THRESHOLD).
    # Same dedup rollback as the static bw_cps backstop: a 503 invites the
    # carrier to retry via another PoP, and that retry must not be 482'd.
    if ($var(cx_cps) > 0) {
        $sht(carrier_cps=>$var(cx_carrier)::$var(cx_pop)) = $sht(carrier_cps=>$var(cx_carrier)::$var(cx_pop)) + 1;
        if ($sht(carrier_cps=>$var(cx_carrier)::$var(cx_pop)) > $var(cx_cps)) {
            xlog("L_WARN", "CARRIER_TRUST CPS limit exceeded: carrier=$var(cx_carrier) pop=$var(cx_pop) at $sht(carrier_cps=>$var(cx_carrier)::$var(cx_pop))/s (limit $var(cx_cps)) — rejecting 503 ($fU -> $tU)\n");
            $sht(bw_dedup=>$fU::$tU) = $null;
            append_to_reply("Retry-After: 5\r\n");
            sl_send_reply("503", "Service Unavailable - Rate Limited");
            exit;
        }
    }

    # Store FS port in dialog variable for in-dialog routing (same as the
    # static carrier branch); dlg_manage() forces early dialog creation so
    # $dlg_var() works before t_relay().
    dlg_manage();
    $dlg_var(fs_port) = "5080";

    # Stamp SBC identity for CDR/Homer tracking (carrier ingress)
    append_hf("X-SBC-ID: __SBC_ID__\r\n");

    # ---- Inbound carrier attribution (CDR) — from the DB row ----
    # Spoof-proof: strip wire-supplied copies FIRST, then stamp ours.
    # FS reads these into inbound_carrier/inbound_carrier_pop channel vars;
    # TO_CARRIER strips both before any B-leg reaches Bandwidth.
    remove_hf("X-Inbound-Carrier");
    remove_hf("X-Inbound-PoP");
    # Spoof-strip the FS-internal egress selectors at DB-carrier ingress
    # too (same reason as the static carrier branch): X-Carrier-IP/
    # X-Carrier-Label must only ever enter TO_CARRIER from FreeSWITCH.
    remove_hf("X-Carrier-IP");
    remove_hf("X-Carrier-Label");
    append_hf("X-Inbound-Carrier: $var(cx_carrier)\r\n");
    if ($var(cx_pop) != "") {
        append_hf("X-Inbound-PoP: $var(cx_pop)\r\n");
    }

    # STIR/SHAKEN: preserve the inbound SHAKEN Identity CHAIN across the FS
    # B2BUA (same capture as the static carrier branch — the RCF `div`
    # PASSporT in TO_CARRIER chains off X-In-Identity; RFC 8946). ALL
    # Identity header instances are captured (RFC 8224 §4 — an already-
    # diverted inbound call carries base + upstream div PASSporTs as
    # separate headers), joined with '|' (a char that cannot occur in a
    # well-formed Identity value — see the static branch rationale), capped
    # at 4 against header-stuffing. Spoof-strip the internal STIR headers
    # first, exactly like the static branch. dlg_manage() ran above.
    remove_hf("X-In-Identity");
    remove_hf("X-Attestation");
    remove_hf("X-Verstat");
    remove_hf("X-Verstat-Source");
    remove_hf("X-Inbound-Attest");
    if (is_present_hf("Identity")) {
        $var(in_id_all) = $(hdr(Identity)[0]);
        if ($hdrc(Identity) > 1) {
            $var(in_id_all) = $var(in_id_all) + "|" + $(hdr(Identity)[1]);
        }
        if ($hdrc(Identity) > 2) {
            $var(in_id_all) = $var(in_id_all) + "|" + $(hdr(Identity)[2]);
        }
        if ($hdrc(Identity) > 3) {
            $var(in_id_all) = $var(in_id_all) + "|" + $(hdr(Identity)[3]);
        }
        if ($hdrc(Identity) > 4) {
            xlog("L_WARN", "STIR: DB-carrier inbound carried $hdrc(Identity) Identity headers — preserving first 4 only ($fU -> $tU, src $si)\n");
        }
        $dlg_var(inbound_identity) = $var(in_id_all);
        append_hf("X-In-Identity: $var(in_id_all)\r\n");
        xlog("L_DBG", "STIR: captured $hdrc(Identity) inbound Identity header(s) from DB carrier ($fU -> $tU), carrying to FS as X-In-Identity\n");
    }

    # NAT detection for inbound carrier traffic (external source — same
    # scoping as the static branch; NAT_DETECT never runs on FS traffic).
    route(NAT_DETECT);
    xlog("L_DBG", "Inbound INVITE from DB carrier $var(cx_carrier)/$var(cx_pop) ($si) to $rU\n");
    route(DISPATCH);
    exit;
}

# Dispatch to FreeSWITCH (inbound from carrier)
route[DISPATCH] {
#!ifdef FS_HA_PAIR
    # STRICT ACTIVE/STANDBY selection — alg 8 ("serial"), VERIFIED against
    # Kamailio 5.8 source:
    #   - DS_ALG_SERIAL always starts at dlist[0] (hash = 0,
    #     dispatch.c:2466-2468) and the selection loop advances ONLY past
    #     destinations whose state matches ds_skip_dst = INACTIVE|DISABLED
    #     (dispatch.c:2536-2553, dispatch.h:51). TRYING (probe failures below
    #     ds_probing_threshold) is NOT skipped — no traffic moves early.
    #   - dlist[0] is the HIGHEST-numeric-priority destination: add_dest2list
    #     keeps an ascending-priority linked list (dispatch.c:589-604) and
    #     reindex_dests copies it backwards into dlist[] (dispatch.c:803-816).
    #     dispatcher.list renders FS-1 priority 10, FS-2 priority 5 in pair
    #     mode -> dlist[0]=FS-1 (ACTIVE), dlist[1]=FS-2 (hot STANDBY, zero
    #     new calls while FS-1 is selectable).
    #   - Failback is automatic: when FS-1's INACTIVE flag clears after
    #     ds_inactive_threshold successful probes (ds_update_state,
    #     dispatch.c:3205-3224), the very next selection returns FS-1.
    #   - With ds_flags=DS_FAILOVER_ON (modparam flags=2) the OTHER active
    #     destination is stored in the ds_dst xavp (fill loop dispatch.c:
    #     2229-2242 skips INACTIVE), so DISPATCH_FAILURE's ds_next_dst()
    #     gives in-transaction rescue onto FS-2 for setups caught in the
    #     probe-detection window.
    # With ONE destination, alg 8 and the legacy alg 4 are behaviorally
    # identical (both resolve to index 0, both fail when it is INACTIVE) —
    # the alg only changes when the pair actually exists.
    if (!ds_select_dst("1", "8")) {
        xlog("L_ERR", "No FreeSWITCH available for $rm to $rU (both media nodes INACTIVE)\n");
        sl_send_reply("503", "Service Unavailable - No Media Servers");
        exit;
    }

    # Ground-truth node record for in-dialog routing: $du is the REAL
    # selection (not the preset-time prediction). Read by TO_FS_INDIALOG's
    # tier-1 host resolution on the dialog-owning SBC — under SBC
    # active/standby that is where carrier in-dialog requests land, so a
    # (sub-millisecond) prediction race or a ds_next_dst rescue can never
    # strand teardown on the wrong node there. INVITE-only: every INVITE
    # path into DISPATCH ran dlg_manage() (carrier branch, CARRIER_TRUST,
    # TRUNK_AUTH, test paths); non-INVITE initial requests (SUBSCRIBE etc.)
    # have no dialog to annotate.
    if (is_method("INVITE")) {
        if ($du == "sip:__FS_IP_2__:5080") {
            $dlg_var(fs_node) = "2";
        } else {
            $dlg_var(fs_node) = "1";
        }
    }
#!else
    # Select FreeSWITCH instance using dispatcher
    # Algorithm 4 = round-robin, 10 = weight-based, 11 = call-load
    if (!ds_select_dst("1", "4")) {
        xlog("L_ERR", "No FreeSWITCH available for $rm to $rU\n");
        sl_send_reply("503", "Service Unavailable - No Media Servers");
        exit;
    }
#!endif

    xlog("L_DBG", "Dispatching to FreeSWITCH: $du\n");

    # Set failure route for failover
    t_on_failure("DISPATCH_FAILURE");

    route(RELAY);
}

# Route outbound to Bandwidth carrier (from FreeSWITCH)
#
# ARCHITECTURE:
#   Bandwidth --[A-leg]--> Kamailio --> FreeSWITCH (B2BUA)
#   FreeSWITCH --[B-leg]--> Kamailio --> Bandwidth
#
# FreeSWITCH is the B2BUA that originates the B-leg INVITE.
# Kamailio proxies it to Bandwidth after topology hiding.
#
# DESIGN (clean headers at the source):
#   FreeSWITCH bridges with sofia/internal/dest@proxy instead of
#   sofia/gateway/carrier/dest. This eliminates:
#     - sip:gw+carrier_primary@... Contact corruption
#     - Gateway-specific Via/Contact formatting issues
#   FreeSWITCH passes the carrier choice via X-Carrier header:
#     - "primary"   -> this zone's nearest PoP (BANDWIDTH_PRIMARY_IP / BANDWIDTH_IP_1)
#     - "secondary" -> this zone's secondary PoP (BANDWIDTH_SECONDARY_IP / BANDWIDTH_IP_2)
#       (East: primary=Dallas, secondary=LA. West: primary=LA, secondary=Dallas.)
#
#   Since the INVITE arrives with standard mod_sofia headers (using
#   ext-sip-ip for Via/Contact), Kamailio only needs to:
#     1. Select the correct Bandwidth IP based on X-Carrier
#     2. Rewrite From/To domains to the public IP
#     3. Replace Contact with Kamailio's address
#     4. Remove FS-specific headers
#     5. Fix SDP body IPs (defense-in-depth)
#     6. Add Homer correlation header (X-CID with A-leg Call-ID)
#
route[TO_CARRIER] {
    # Store FS port in dialog variable for in-dialog routing.
    # Outbound calls live on FS external profile (5090).
    # This is read by route[WITHINDIALOG] to route BYE/re-INVITE
    # to the correct FS profile instead of hardcoding 5090.
    # dlg_manage() forces early dialog creation so $dlg_var() works
    # before t_relay() (which normally creates the dialog).
    dlg_manage();
    $dlg_var(fs_port) = "5090";

#!ifdef FS_HA_PAIR
    # Record WHICH media node originated this B-leg. Unlike the A-leg (where
    # the preset predicts the upcoming dispatcher selection), the B-leg node
    # is KNOWN here: $si is the FreeSWITCH that sent this INVITE. Drives the
    # ;fsn= choice in the B-leg preset below and the $dlg_var(fs_node) tier
    # in TO_FS_INDIALOG (carrier-originated BYE/re-INVITE/ACK must reach the
    # node that owns the media). Any non-FS-2 source (FS-1, local-dev docker
    # bridge) maps to node 1 — identical to single-FS behavior.
    if ($si == "__FS_IP_2__") {
        $dlg_var(fs_node) = "2";
    } else {
        $dlg_var(fs_node) = "1";
    }
#!endif

    # ====================================================================
    # Step 1a: Table-driven carrier egress — X-Carrier-IP from FreeSWITCH
    # ====================================================================
    # NEW header contract (RCF table-driven termination): FreeSWITCH's
    # inbound_router.lua builds its PSTN failover attempts from the
    # TED-managed carrier_trunks table and stamps each B-leg attempt with
    #   X-Carrier-IP:    <carrier egress IP, e.g. 67.231.2.12>
    #   X-Carrier-Label: <carrier>-<pop>   (log/observability only)
    # instead of the legacy X-Carrier enum. These headers are FS-INTERNAL:
    # they are spoof-stripped at EVERY ingress (static carrier branch,
    # route[CARRIER_TRUST], route[TRUNK_AUTH] — same treatment as
    # X-Inbound-Carrier), so by construction they can only arrive here from
    # FreeSWITCH itself.
    #
    # VALIDATION (defense-in-depth, never trust even FS blindly):
    #   1. Fast path: value equals BANDWIDTH_IP_1/IP_2 (this zone's env
    #      PoPs) -> valid, zero DB cost. Covers the seed rows == 100% of
    #      current traffic.
    #   2. Else: strict IPv4 shape check, then a per-call sqlops point
    #      lookup against carrier_trunks (same "trunk" sqlcon and posture
    #      as CARRIER_TRUST) — the IP must be an enabled outbound row.
    #   3. Invalid/unknown/DB error -> WARN + FALL BACK to the legacy
    #      Step 1 mapping below (which defaults to the primary PoP when no
    #      X-Carrier header is present). FAIL-SAFE: never 4xx/5xx a call
    #      over a bad selector header.
    #
    # NO-FLIP RULE: when a validated X-Carrier-IP drives the egress, this
    # transaction sets flags 8 AND 9 up front, disabling failure_route
    # [CARRIER_FAILURE]'s alternate-IP flip and its cross-trunk TC4
    # fallback. FS's attempt loop owns ALL carrier failover for these
    # calls — two failover owners would DOUBLE-DIAL the callee (Kamailio
    # flips to carrier B while FS simultaneously retries carrier B on its
    # next attempt). The 422 Session-Interval retry in CARRIER_FAILURE is
    # checked BEFORE the flags and still applies, as do Session-Expires
    # normalization, STIR signing, and all header cleanup below.
    # Legacy X-Carrier calls (trunk/API products + FS fallback mode) never
    # set these flags — their in-Kamailio 5xx failover is UNCHANGED.
    $var(xcip_mode) = 0;
    $var(xcip) = "";
    $var(xclabel) = "";
    if (is_present_hf("X-Carrier-IP")) {
        $var(xcip) = $hdr(X-Carrier-IP);
        if (is_present_hf("X-Carrier-Label")) {
            $var(xclabel) = $hdr(X-Carrier-Label);
        }
        if ($var(xcip) == BANDWIDTH_IP_1 || $var(xcip) == BANDWIDTH_IP_2) {
            # Fast path: this zone's env-configured Bandwidth PoPs.
            $var(xcip_mode) = 1;
        } else if ($var(xcip) =~ "^[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}$") {
            # Strict IPv4 shape verified above — safe to interpolate into
            # the point lookup (same literal-interpolation posture as the
            # '$si' queries in TRUNK_AUTH/CARRIER_TRUST).
            sql_query("trunk",
                "SELECT 1 FROM carrier_trunks \
                 WHERE host(source_ip) = '$var(xcip)' \
                 AND direction IN ('outbound','both') \
                 AND enabled = true \
                 LIMIT 1",
                "cxo");
            if ($rc < 0) {
                xlog("L_WARN", "X-Carrier-IP: DB validation failed for $var(xcip) ($var(xclabel)) — falling back to legacy primary mapping\n");
            } else if ($dbr(cxo=>rows) > 0) {
                $var(xcip_mode) = 1;
            } else {
                xlog("L_WARN", "X-Carrier-IP: $var(xcip) ($var(xclabel)) is not an enabled outbound carrier_trunks row — falling back to legacy primary mapping\n");
            }
        } else {
            xlog("L_WARN", "X-Carrier-IP: malformed value '$var(xcip)' — falling back to legacy primary mapping\n");
        }
        # Internal selector headers — never to the carrier, valid or not
        # (plain remove lumps BEFORE msg_apply_changes(), exactly like the
        # X-Carrier removal in the legacy block).
        remove_hf("X-Carrier-IP");
        remove_hf("X-Carrier-Label");
    }

    if ($var(xcip_mode) == 1) {
        $var(carrier_ip) = $var(xcip);
        # Bounded metric enum for the Prometheus emission below — a
        # DB-sourced carrier name is NOT a bounded label; "db" joins the
        # closed set {primary,secondary,tc1,tc2,tc4,db}.
        $var(carrier_label) = "db";
        # FS owns ALL carrier failover for table-driven calls (see the
        # NO-FLIP RULE above): disable CARRIER_FAILURE's alternate-IP flip
        # (flag 8) and cross-trunk TC4 fallback (flag 9) for this
        # transaction. On carrier failure the negative reply propagates to
        # FS, whose loop dials the next trunk/SBC attempt.
        setflag(8);
        setflag(9);
        # Belt-and-suspenders: if a legacy X-Carrier header is ALSO present
        # (should never happen — FS sends one selector or the other), the
        # legacy block below is skipped, so strip it here instead.
        remove_hf("X-Carrier");
        xlog("L_INFO", "X-Carrier-IP=$var(xcip) validated ($var(xclabel)) -> table-driven egress, kamailio carrier flip disabled\n");
    } else {
    # ====================================================================
    # Step 1: Select Bandwidth IP based on X-Carrier header from FreeSWITCH
    # ====================================================================
    # FreeSWITCH sets X-Carrier in the bridge string to indicate which
    # carrier trunk to use. Map it to the correct Bandwidth signaling IP.
    #
    # Trunk config mapping:
    #   primary   -> this zone's nearest PoP   (BANDWIDTH_PRIMARY_IP / BANDWIDTH_IP_1)
    #   secondary -> this zone's secondary PoP  (BANDWIDTH_SECONDARY_IP / BANDWIDTH_IP_2)
    #               (East: primary=Dallas, secondary=LA. West: primary=LA, secondary=Dallas.)
    #   tc1 -> TC1 GraniteTelecommunicationsLLC_01 (NY primary)
    #   tc2 -> TC2 GraniteTelecommunicationsLLC_02 (Dallas primary)
    #   tc4 -> TC4 GraniteTelecommunicationsLLC_03 (this zone's primary PoP, same as primary)
    #
    # For RCF, FreeSWITCH reads X-Inbound-TC (set by Kamailio on inbound)
    # and passes it as X-Carrier so the outbound leg uses the same trunk config.
    $var(carrier_ip) = BANDWIDTH_IP_1;  # Default: TC4 Dallas (primary)
    # Prometheus: carrier-trunk label mirrors the X-Carrier selection below. It
    # is the fixed trunk-config enum (primary|secondary|tc1|tc2|tc4), set ONLY
    # inside the known branches so an unknown/garbage X-Carrier value can never
    # become a metric label (unknown/missing -> default "tc4", matching the
    # default carrier_ip = BANDWIDTH_IP_1). See metrics emission after Step 1.
    $var(carrier_label) = "tc4";  # Default: matches default carrier_ip (primary PoP)
    if (is_present_hf("X-Carrier")) {
        if ($hdr(X-Carrier) == "primary") {
            $var(carrier_ip) = BANDWIDTH_IP_1;  # this zone's primary PoP (BANDWIDTH_PRIMARY_IP)
            $var(carrier_label) = "primary";
            xlog("L_DBG", "X-Carrier=primary -> routing to Bandwidth primary PoP $var(carrier_ip)\n");
        } else if ($hdr(X-Carrier) == "secondary") {
            $var(carrier_ip) = BANDWIDTH_IP_2;  # this zone's secondary PoP (BANDWIDTH_SECONDARY_IP)
            $var(carrier_label) = "secondary";
            xlog("L_DBG", "X-Carrier=secondary -> routing to Bandwidth secondary PoP $var(carrier_ip)\n");
        } else if ($hdr(X-Carrier) == "tc1") {
            $var(carrier_ip) = BANDWIDTH_TC1_NY;  # TC1 New York (primary)
            $var(carrier_label) = "tc1";
            xlog("L_DBG", "X-Carrier=tc1 -> routing to Bandwidth TC1 NY $var(carrier_ip)\n");
        } else if ($hdr(X-Carrier) == "tc2") {
            $var(carrier_ip) = BANDWIDTH_TC2_DAL;  # TC2 Dallas (primary)
            $var(carrier_label) = "tc2";
            xlog("L_DBG", "X-Carrier=tc2 -> routing to Bandwidth TC2 Dallas $var(carrier_ip)\n");
        } else if ($hdr(X-Carrier) == "tc4") {
            $var(carrier_ip) = BANDWIDTH_IP_1;  # TC4 Dallas (explicit)
            $var(carrier_label) = "tc4";
            xlog("L_DBG", "X-Carrier=tc4 -> routing to Bandwidth TC4 Dallas $var(carrier_ip)\n");
        } else {
            xlog("L_WARN", "Unknown X-Carrier value '$hdr(X-Carrier)', using default TC4 Dallas\n");
        }
        # Remove X-Carrier before sending to carrier (internal header)
        remove_hf("X-Carrier");
    } else {
        xlog("L_WARN", "No X-Carrier header from FreeSWITCH, using default TC4 Dallas\n");
    }
    }  # end Step 1a table-driven vs legacy Step 1 selection

    # ---- Prometheus: per-carrier-trunk outbound CPS + active-call profile ----
    # Emit AFTER the carrier is finalized above (so $var(carrier_label) is the
    # real, bounded enum) and BEFORE the header cleanup that follows — these two
    # calls are pure metrics/dialog bookkeeping and do NOT modify the SIP message.
    #   trunk_cps: increment by 1 for this outbound call attempt. PromQL derives
    #     CPS via rate(kamailio_trunk_cps[1m]). (Distinct from the customer-keyed
    #     trunk_cps *htable* used for CPS limiting — this is the carrier egress
    #     counter, labelled by carrier enum only.)
    #   carrier_trunk profile: tag this dialog "<carrier>:outbound" so the
    #     scrape-time get_profile_size() in event_route[xhttp:request] can report
    #     kamailio_trunk_active_calls{trunk=<carrier>,direction="outbound"}.
    prom_counter_inc("trunk_cps", "1", "$var(carrier_label)", "outbound");
    set_dlg_profile("carrier_trunk", "$var(carrier_label):outbound");

    # Remove X-Inbound-TC before sending to carrier (internal header)
    if (is_present_hf("X-Inbound-TC")) {
        remove_hf("X-Inbound-TC");
    }
    # Remove the inbound-carrier attribution headers (internal, set on the
    # A-leg for CDR attribution; FS copies received X-* headers to the
    # bridged B-leg, same as X-Inbound-TC above — never show them to the
    # carrier). Safe here: plain remove lumps BEFORE msg_apply_changes(),
    # exactly like the X-Inbound-TC removal.
    remove_hf("X-Inbound-Carrier");
    remove_hf("X-Inbound-PoP");

    # Set destination to selected Bandwidth IP
    $rd = $var(carrier_ip);
    $rp = 5060;
    $du = "sip:" + $var(carrier_ip) + ":5060";
    xlog("L_DBG", "Outbound to Bandwidth: $du (R-URI: $ru)\n");

    # Save the A-leg Call-ID for Homer correlation.
    # FreeSWITCH passes the A-leg Call-ID via X-CID header in the B-leg INVITE.
    # This is the inbound Call-ID from Bandwidth (e.g., 218382592_122992403@67.231.13.185)
    # which we need to correlate with the B-leg (FS-generated Call-ID) in Homer.
    # If X-CID is missing (e.g., non-FS traffic), fall back to B-leg Call-ID.
    if (is_present_hf("X-CID")) {
        $var(a_leg_callid) = $hdr(X-CID);
    } else {
        $var(a_leg_callid) = $ci;
    }

    # ====================================================================
    # Step 2: Rewrite From/To domains and display name
    # ====================================================================
    # FreeSWITCH sets From as sip:+1xxx@172.28.0.1; carrier expects public IP.
    $fd = "ADVERTISE_IP";
    # FreeSWITCH sets To domain as the proxy address; rewrite to carrier IP.
    $td = $var(carrier_ip);
    # Set From display name to RCF line name if provided via X-Original-CID-Name.
    # Read it here (before header cleanup removes it) so the From shows e.g.
    # From: "Main Office" <sip:6174544217@34.24.133.82>
    if (is_present_hf("X-Original-CID-Name")) {
        $fn = $hdr(X-Original-CID-Name);
    }

    # ====================================================================
    # Step 3: Remove FS-specific headers and replace with clean ones
    # ====================================================================
    # With sofia/internal bridging, FS sends standard headers (no sip:gw+
    # corruption), but we still need to present Kamailio's identity to the
    # carrier and remove FS-internal headers.
    remove_hf("P-Asserted-Identity");
    remove_hf("User-Agent");
    remove_hf("X-FS-Support");
    remove_hf("X-SBC-ID");
    remove_hf("Content-Disposition");
    remove_hf("Privacy");
    remove_hf("Supported");
    remove_hf("Allow-Events");
    remove_hf("Allow");
    remove_hf("Contact");
    remove_hf("Remote-Party-ID");
    # Scrub Diversion header: FreeSWITCH sets it with the media VM's public
    # IP (FS_PUBLIC_IP), which leaks internal topology to the carrier. Replace
    # with ADVERTISE_IP (the SBC's public-facing address) to match Contact/PAI.
    # Only rebuild if FS actually sent a Diversion header.
    if (is_present_hf("Diversion")) {
        $var(div_user) = $(hdr(Diversion){nameaddr.uri}{uri.user});
        remove_hf("Diversion");
        append_hf("Diversion: <sip:$var(div_user)@ADVERTISE_IP:5060>;reason=unconditional\r\n");
    }
    # Strip any session timer headers from FS — FreeSWITCH cannot generate
    # Session-Expires or Min-SE from channel variables (tested: explicit
    # sip_session_timeout/sip_minimum_session_expires/enable_timer in originate
    # produces no Session-Expires or Min-SE in the INVITE). Only "Supported:
    # timer" comes from the profile, but we strip Supported above and add our
    # own below. Kamailio adds the RFC 4028 headers itself in Step 6.
    remove_hf("Session-Expires");
    remove_hf("Min-SE");

    # Add our clean Contact BEFORE msg_apply_changes() so that when the
    # message buffer is rebuilt, the new Contact is already present.
    # This is critical because the dialog module reads the Contact header
    # during record_route() to create the dialog leg info. If Contact is
    # absent at that point, we get:
    #   "bad sip message or missing Contact hdr" -> no dialog created
    #   -> ACK routing breaks (no dialog to match)
    #   -> BYE returns 404 (no dialog found)
    #
    # The remove_hf("Contact") above marks the old FS Contact for removal
    # in the parsed structure. This append_hf() adds the new Contact to the
    # parsed structure. msg_apply_changes() then rebuilds the raw buffer
    # with the old Contact gone and the new one present — all before
    # record_route() runs.
    append_hf("Contact: <sip:$fU@ADVERTISE_IP:5060;transport=udp>\r\n");

    # Apply changes to rebuild the message buffer before record_route().
    # At this point, removed headers (Contact, FS internals) are gone and
    # our clean Contact is in the buffer. record_route() can run safely.
    msg_apply_changes();

    # Double Record-Route for multi-SBC NLB deployment.
    #
    # MUST be called AFTER msg_apply_changes() — the reverse order
    # (record_route before msg_apply_changes) broke header cleanup.
    # We skipped the early record_route() for FS traffic to allow
    # msg_apply_changes() to work; now we add it at the right time.
    #
    # The dialog module hooks into this call to create the dialog and read
    # the Contact header for leg info. Our Contact is now in the buffer
    # (added above), so the dialog is created successfully.
    #
    # record_route_preset() with two URIs adds two Record-Route headers:
    #   1st arg (outer) = NLB VIP (ADVERTISE_IP) — Bandwidth-facing side.
    #     Bandwidth sends in-dialog requests (BYE, re-INVITE) to the NLB,
    #     which distributes to any healthy SBC. This is correct because
    #     Bandwidth's requests create new transactions that any SBC can handle.
    #   2nd arg (inner) = the SIGNALING_VIP (per-zone internal NLB) — FS-facing
    #     side. When FS gets the 200 OK, its Route set will have SIGNALING_VIP
    #     as the first Route, so FS sends ACK/BYE to the internal VIP, which
    #     always delivers to the ACTIVE SBC of the pair. (Pre-cutover this
    #     token renders as SBC_INTERNAL_IP — the specific-SBC pin. The §8.10
    #     ;fs= markers already made ANY SBC able to route these statelessly;
    #     the VIP removes the last per-SBC dependency: a dead SBC's inner
    #     Route no longer points at a dead address.)
    #
    # Without double RR, FS sends ACK to the NLB VIP. The NLB picks a random
    # SBC. If it hits the wrong one (SBC-2 instead of SBC-1), that SBC has no
    # dialog context and drops the ACK. Bandwidth never gets it, retransmits
    # the 200 OK 8 times, then sends BYE — killing the call after ~30 seconds.
    #
    # ;r2=on ON THE FS-FACING (SIGNALING_VIP) ENTRY ONLY — same FS-direction
    # rationale as the A-leg preset in request_route: FS's in-dialog ACK/BYE
    # arrive with Route: [SIGNALING_VIP;r2, VIP]; the r2 on the FIRST (inner)
    # Route makes loose_route() consume BOTH own Routes in one traversal and
    # force the VIP listen socket as send socket (loose.c after_loose/is_2rr;
    # the forced socket comes from the SECOND consumed Route = ADVERTISE_IP,
    # unchanged for both new SIGNALING_VIP and legacy SBC_INTERNAL_IP route
    # sets), so the request goes FS -> SBC -> carrier with exactly one SBC Via.
    # r2 is invisible in the carrier->FS direction (VIP is first there and
    # never carries it) — that direction never runs loose_route() at all
    # (route[FROM_NET_INDIALOG]).
    #
    # ;fs=5090 ON BOTH ENTRIES — stateless carrier-side dispatch marker
    # (CLAUDE.md §8.10): this preset creates B-LEG dialogs (FS external
    # profile :5090 -> carrier/PBX; $dlg_var(fs_port)="5090" is set at the top
    # of this route). The carrier echoes these Route entries verbatim on every
    # in-dialog request, so ANY SBC can deliver a carrier-originated BYE/ACK/
    # re-INVITE to FS :5090 with zero dialog state. A-leg preset carries
    # ;fs=5080.
#!ifdef FS_HA_PAIR
    # ;fsn=<node> — per-call FS NODE marker (companion to ;fs=, see the A-leg
    # preset for the marker contract). On this B-leg the node is EXACT, not
    # predicted: $dlg_var(fs_node) was just set from $si at the top of this
    # route. Static literal variants by choice (mechanism (a)); 5.8 rr also
    # supports PV args in record_route_preset (rr_mod.c it_list_fixup +
    # pv_printf_s) — kept literal so wire strings stay grep-able.
    if ($dlg_var(fs_node) == "2") {
        record_route_preset("ADVERTISE_IP:5060;fs=5090;fsn=2;lr", "SIGNALING_VIP:5060;r2=on;fs=5090;fsn=2;lr");
    } else {
        record_route_preset("ADVERTISE_IP:5060;fs=5090;fsn=1;lr", "SIGNALING_VIP:5060;r2=on;fs=5090;fsn=1;lr");
    }
#!else
    record_route_preset("ADVERTISE_IP:5060;fs=5090;lr", "SIGNALING_VIP:5060;r2=on;fs=5090;lr");
#!endif

    # ====================================================================
    # Step 4: Via header handling (NO manipulation)
    # ====================================================================
    # DO NOT use remove_hf("Via") + msg_apply_changes() here.
    # It corrupts the SIP message buffer: Kamailio's core adds ;received=
    # and ;rport= annotations to FS's Via during initial parsing (because
    # the packet source IP 10.142.0.100 differs from Via sent-by
    # 34.74.71.32). remove_hf("Via") deletes the parsed Via line but
    # leaves the ;received=/;rport= annotation as orphaned text that
    # merges with the next header (Max-Forwards), producing:
    #
    #   Via: SIP/2.0/UDP 34.74.71.32:5060;branch=...
    #   ;received=10.142.0.100;rport=5090Max-Forwards: 69
    #
    # This is a SIP syntax violation that Bandwidth rejects with 400.
    #
    # subst() also cannot fix this -- the ;received=/;rport= params are
    # managed by the tm module's transaction state and are re-applied
    # AFTER the routing script runs (see MEMORY: subst limitation).
    #
    # The correct behavior: let t_relay() add Kamailio's Via on top.
    # The outbound INVITE will have two Vias (Kamailio's + FS's), which
    # is valid per RFC 3261. The ;received= annotation on FS's Via shows
    # the internal IP (10.142.0.100) but this is harmless -- it's a
    # standard Via parameter that Bandwidth processes correctly.
    # Two Vias with received= worked in production before this change.

    # ====================================================================
    # Step 5: Build P-Asserted-Identity from X-Original-CID
    # ====================================================================
    # RCF call forwarding sets two identities:
    #   From ($fU):       RCF DID (Bandwidth requires this for termination auth)
    #   X-Original-CID:   Number for caller ID presentation to the called party
    #
    # When pass_caller_id=true:  X-Original-CID = original caller's number
    # When pass_caller_id=false: X-Original-CID = RCF DID (no passthrough)
    # Non-RCF calls:             X-Original-CID absent; fall back to $fU
    #
    # Save the CID value to a variable BEFORE header manipulation, then
    # remove the internal header and append the clean PAI.
    $var(pai_user) = $fU;  # Default: use From user
    $var(pai_name) = "";   # Default: no display name
    if (is_present_hf("X-Original-CID")) {
        $var(pai_user) = $hdr(X-Original-CID);
        xlog("L_DBG", "RCF caller ID: From=$fU (carrier auth), PAI=$var(pai_user) (CID display)\n");
        remove_hf("X-Original-CID");
    } else {
        xlog("L_DBG", "No X-Original-CID header, PAI defaults to From user: $fU\n");
    }
    # Read optional display name for PAI (RCF line name configured in portal)
    if (is_present_hf("X-Original-CID-Name")) {
        $var(pai_name) = $hdr(X-Original-CID-Name);
        remove_hf("X-Original-CID-Name");
    }

    # ====================================================================
    # Step 6: Add clean outbound headers
    # ====================================================================
    # Present Kamailio's public IP as the SBC identity to Bandwidth.
    # NOTE: Contact header is already added in Step 3 (before msg_apply_changes
    # and record_route) so the dialog module can read it. Do NOT add it again.
    if ($var(pai_name) != "") {
        append_hf("P-Asserted-Identity: \"$var(pai_name)\" <sip:$var(pai_user)@ADVERTISE_IP>\r\n");
    } else {
        append_hf("P-Asserted-Identity: <sip:$var(pai_user)@ADVERTISE_IP>\r\n");
    }
    append_hf("User-Agent: VoicePlatform-SBC/1.0\r\n");
    append_hf("Allow: INVITE,ACK,BYE,CANCEL,OPTIONS,PRACK,UPDATE\r\n");
    # SESSION TIMER STRATEGY: Kamailio adds RFC 4028 headers.
    #
    # FreeSWITCH CANNOT generate Session-Expires or Min-SE from channel
    # variables — this is a build/version limitation. So Kamailio acts as
    # the SBC and adds these headers itself, which is standard behavior
    # (Cisco CUBE, Oracle SBC, AudioCodes all do this at the SBC layer).
    #
    # RFC 4028 negotiation flow:
    #   1. Our INVITE includes: Supported: timer, Session-Expires: 1800;
    #      refresher=uac, Min-SE: 90
    #   2. Bandwidth can reduce Session-Expires in 200 OK but MUST NOT
    #      go below our Min-SE (90s). If they try, they should send 422.
    #   3. The negotiated value appears in the 200 OK. Our reply handler
    #      normalizes it to 1800 before passing to FS (see REPLY_HANDLER).
    #   4. FS sees Session-Expires: 1800 + Supported: timer in the 200 OK
    #      and handles refresh re-INVITEs automatically via mod_sofia.
    #
    # refresher=uac means WE send refresh re-INVITEs (via FS). This is
    # preferred because we control the timing and avoid depending on the
    # carrier to refresh.
    append_hf("Supported: timer,replaces\r\n");
    # RFC 4028 Session Timer headers — propose 30-minute session interval,
    # minimum acceptable 90 seconds (the RFC floor).
    append_hf("Session-Expires: 1800;refresher=uac\r\n");
    append_hf("Min-SE: 90\r\n");

    # ====================================================================
    # Step 7: Fix SDP body -- replace Docker/private IPs with FS public IP
    # ====================================================================
    # Defense-in-depth: ext-rtp-ip should handle this at the FS level,
    # but we scrub anyway in case any module injects RFC1918 addresses.
    #
    # CRITICAL: Use FS_PUBLIC_IP here, not ADVERTISE_IP. This INVITE
    # originates from FreeSWITCH and any private IP in the SDP should
    # be replaced with FS's actual public IP (where RTP is handled),
    # not the NLB VIP (which only forwards SIP signaling on port 5060).
    if (has_body("application/sdp")) {
        subst_body('/IN IP4 172\.28\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
        subst_body('/IN IP4 10\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
        subst_body('/IN IP4 127\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
    }

    # ====================================================================
    # Step 8: Homer SIP capture correlation
    # ====================================================================
    # FreeSWITCH is a B2BUA, so the B-leg has a different Call-ID than the A-leg.
    # Homer shows them as separate call flows. X-CID carries the A-leg Call-ID
    # on the B-leg INVITE so heplify-server (AlegIDs=X-CID) can extract it and
    # store it as the correlation_id. Homer then links both legs into a single
    # end-to-end ladder diagram.
    #
    # FreeSWITCH already set X-CID in the bridge string. We saved the value
    # in $var(a_leg_callid) in Step 1. Now remove the FS-sent header and
    # re-add it cleanly (avoids any whitespace/formatting issues).
    remove_hf("X-CID");
    append_hf("X-CID: $var(a_leg_callid)\r\n");

    # ====================================================================
    # Step 8.5: STIR/SHAKEN — sign the outbound Identity (PASSporT)
    # ====================================================================
    # Attach point rationale: we are AFTER msg_apply_changes() (:~1890) and
    # AFTER record_route_preset() (:~1927), and this is the same mechanism/
    # position as the X-CID append just above — append_hf("Identity:…") here is
    # safe (headers are appended to the already-rebuilt buffer; the double-RR /
    # dialog / Contact ordering is untouched). t_relay() below carries the added
    # Identity to the carrier. See CLAUDE.md §8.2/§8.4/§8.7/§8.10.
    #
    # Two internal headers drive this, both set by FreeSWITCH on the B-leg:
    #   X-Attestation ∈ {A,B,div} — signing mode (default B if absent).
    #   X-In-Identity — the ORIGINAL inbound SHAKEN Identity chain (ALL inbound
    #                   Identity headers, joined with '|', max 4 — captured on
    #                   the A-leg at carrier ingress, Task 1.4, echoed back by
    #                   FS on the B-leg, Task 2.4). Div base: re-emitted one
    #                   "Identity:" header per element, original order.
    #
    # Read them into $vars, decide the div trigger, THEN strip them — plus the
    # other internal STIR annotation headers — from the carrier-bound INVITE.
    # The strips are UNCONDITIONAL (outside the signing ifdef) — these are
    # internal headers that must NEVER leak to Bandwidth even
    # when signing is OFF. With STIR_SHAKEN_SIGN off, the ONLY net effect of this
    # whole step vs. the pre-STIR config is removing two FS-internal headers that
    # only ever exist once FreeSWITCH is emitting them (Phase 2, later) — the
    # carrier wire is otherwise byte-identical.
    $var(stir_attest) = "B";                 # SHAKEN default when FS sends none
    if (is_present_hf("X-Attestation")) {
        $var(stir_attest) = $hdr(X-Attestation);
    }
    $var(stir_in_identity) = "";
    if (is_present_hf("X-In-Identity")) {
        $var(stir_in_identity) = $hdr(X-In-Identity);
    }
    # Div is requested when FS marks the leg div OR a Diversion header is present
    # (RCF forward). Both are computed here so the strips below can run once.
    $var(stir_is_div) = 0;
    if ($var(stir_attest) == "div" || is_present_hf("Diversion")) {
        $var(stir_is_div) = 1;
    }
    # Strip internal STIR headers before the carrier sees them (ALWAYS).
    remove_hf("X-Attestation");
    remove_hf("X-In-Identity");
    # FS's X-header echo ALSO copies the other internal STIR annotations from
    # the carrier A-leg onto this B-leg: X-Verstat / X-Verstat-Source (stamped
    # by the verify block when STIR_SHAKEN_VERIFY=on, or the carrier-PAI
    # capture), and X-Inbound-Attest (stamped UNCONDITIONALLY whenever the
    # inbound call carried P-Attestation-Indicator). Strip them here
    # unconditionally too — internal observability headers must never reach
    # Bandwidth. Same plain remove lumps as the two strips above (safe at this
    # point after msg_apply_changes(); applied at relay).
    remove_hf("X-Verstat");
    remove_hf("X-Verstat-Source");
    remove_hf("X-Inbound-Attest");

    # EFFECTIVE-ATTESTATION tracker (T2, observability only). Records what this
    # leg ACTUALLY emitted on the wire, for the kamailio_stir_attest_signed
    # counter after the signing block. Initialized to "unsigned" — the truthful
    # value when STIR_SHAKEN_SIGN is OFF (nothing is signed) or when a signing
    # path fails open. Inside the ifdef below it is set to the REAL outcome at
    # each success point: "div" (chained div PASSporT), "C" (the div→C gateway
    # fallback, i.e. div requested but inbound arrived unsigned), or the base
    # level A/B/C actually passed to secsipid_add_identity. This is a $var (per-
    # transaction), never a header — it never reaches the carrier.
    $var(stir_eff) = "unsigned";

#!ifdef STIR_SHAKEN_SIGN
    # --- Signing is ENABLED (STIR_SHAKEN_SIGN=on) -----------------------------
    # FAIL-OPEN CONTRACT (whole block): any missing input, negative return, or
    # module error => relay the call UNSIGNED. We NEVER reject, 4xx, or drop a
    # call because of signing. Every branch below either appends a valid Identity
    # or logs and falls through to the unsigned relay.
    #
    # Canonical +E.164 for the PASSporT `tn` fields. The platform passes numbers
    # as +E.164 already (api_outbound/inbound_router), but normalize defensively:
    # replace an optional leading '+' with exactly one '+', so both "+1NXXXXXXXXX"
    # and a bare "1NXXXXXXXXX" become "+1NXXXXXXXXX".
    $var(stir_orig) = $(var(pai_user){re.subst,/^\+?/+/});   # orig TN (CID)
    $var(stir_dest) = $(rU{re.subst,/^\+?/+/});              # dest TN (R-URI user)

    # Validated attestation level for the trunk/API base PASSporT we BUILD.
    # $var(stir_attest) comes from FS's X-Attestation (A/B for trunk/API) but
    # could be stray whitespace/case/garbage; secsipid_add_identity's 3rd arg
    # MUST be a SHAKEN level ∈ {A,B,C}. Copy, then coerce anything that is not
    # EXACTLY A/B/C to B (partial — the safe default for trunk/API, where we DID
    # authenticate the customer). Never pass raw stir_attest to
    # secsipid_add_identity. NOTE: the RCF div-no-base fallback does NOT use this
    # var — it signs explicit attest=C (gateway) per operator policy (see that
    # branch below). (The div PASSporT built via secsipid_sign has no `attest`.)
    $var(stir_attest_base) = $var(stir_attest);
    if ($var(stir_attest_base) != "A" && $var(stir_attest_base) != "B" && $var(stir_attest_base) != "C") {
        $var(stir_attest_base) = "B";
    }
    # Guard against emitting orig.tn:"+" / empty. stir_orig is pai_user with the
    # leading '+' normalized, so an absent/empty calling number collapses to just
    # "+". A PASSporT with orig.tn "+" (or empty) is meaningless; when there is no
    # usable calling number we do NOT sign a PASSporT WE build — fail open and
    # relay unsigned. (Re-emitting a preserved inbound Identity from X-In-Identity
    # is still fine — it is already a valid PASSporT — so this gates only OUR base
    # and OUR div signing, not that re-emit.)
    $var(stir_orig_ok) = 1;
    if ($var(stir_orig) == "" || $var(stir_orig) == "+") {
        $var(stir_orig_ok) = 0;
    }

    if ($var(stir_is_div) == 1) {
        # ---- RCF diversion PASSporT (ppt=div, RFC 8946 / ATIS-1000085) ----
        # NO BARE DIV: a div PASSporT is only valid chained onto a base PASSporT.
        # If we have the preserved inbound Identity, re-emit it as the base first,
        # then add our div PASSporT. If we have NO inbound Identity, we cannot
        # legally emit a bare div — fall back to a base SHAKEN PASSporT (attest
        # from FS, default B) so the call still carries a single valid Identity.
        if ($var(stir_in_identity) != "") {
            # (1) Re-emit the ORIGINAL inbound Identity chain as the base.
            #     This ALWAYS happens once we have it — even if the div step below
            #     is skipped, the call still carries the valid base PASSporT(s).
            #
            #     X-In-Identity carries ALL inbound Identity headers joined with
            #     '|' (ingress capture, max 4 elements; '|' cannot occur inside a
            #     well-formed Identity value — see the capture rationale). Split
            #     and append one Identity header per element, in ORIGINAL order,
            #     before our own div PASSporT is appended below — so an already-
            #     diverted inbound call keeps its full base + upstream-div chain.
            #     A single-element value contains no '|' and takes the plain
            #     append (byte-identical to the previous single-Identity emit,
            #     and the correct legacy behavior if an un-upgraded SBC captured
            #     the A-leg during a rolling deploy). The capture caps at 4, so
            #     four appends are exhaustive; an empty element (malformed
            #     joined value) is never possible from our own capture code.
            if ($var(stir_in_identity) =~ "[|]") {
                append_hf("Identity: $(var(stir_in_identity){s.select,0,|})\r\n");
                append_hf("Identity: $(var(stir_in_identity){s.select,1,|})\r\n");
                if ($var(stir_in_identity) =~ "[|].*[|]") {
                    append_hf("Identity: $(var(stir_in_identity){s.select,2,|})\r\n");
                }
                if ($var(stir_in_identity) =~ "[|].*[|].*[|]") {
                    append_hf("Identity: $(var(stir_in_identity){s.select,3,|})\r\n");
                }
                xlog("L_INFO", "STIR: re-emitted multi-element inbound Identity chain as div base\n");
            } else {
                append_hf("Identity: $var(stir_in_identity)\r\n");
            }
            # Effective outcome = div-chained: a diverted call carrying a base
            # PASSporT (with, below, an added div PASSporT). Set here so the
            # counter records "div" whether or not the div sub-step succeeds —
            # both cases emit a chained/preserved Identity for a diversion.
            $var(stir_eff) = "div";

            # Diverting number: the RCF DID that forwarded the call. Step 3
            # rebuilt the Diversion header as <sip:$var(div_user)@ADVERTISE_IP>,
            # so $var(div_user) holds the forwarding DID user. Canonicalize it.
            # Defensive: if the leg was marked div by X-Attestation but carries NO
            # Diversion (so $var(div_user) is unset/empty), we cannot build a
            # meaningful div claim — skip the div PASSporT and relay with the base
            # Identity ONLY (never a malformed div.tn, never a bare div).
            $var(stir_div_tn) = $(var(div_user){re.subst,/^\+?/+/});
            if ($var(stir_orig_ok) == 1 && $var(stir_div_tn) != "" && $var(stir_div_tn) != "+") {
                # (2) Build the div PASSporT header + payload JSON in $vars. iat
                # is a fresh integer epoch ($Ts = unix seconds, one value per
                # message). x5u carries our public cert URL (STIR_CERT_URL is a
                # raw substdef, dropped inside the string literal here). The
                # payload $vars are canonical +E.164 only (no user free-text), so
                # no JSON-escaping hazard; $Ts is a plain integer. Claims ordered
                # as a div PASSporT expects (dest, div, iat, orig).
                $var(stir_hdr) = "{\"alg\":\"ES256\",\"ppt\":\"div\",\"typ\":\"passport\",\"x5u\":\"STIR_CERT_URL\"}";
                $var(stir_pl) = "{\"dest\":{\"tn\":[\"" + $var(stir_dest) + "\"]},\"div\":{\"tn\":\"" + $var(stir_div_tn) + "\"},\"iat\":" + $Ts + ",\"orig\":{\"tn\":\"" + $var(stir_orig) + "\"}}";

                # (3) Sign. secsipid_sign(sheaders, spayload, keyPath) sets
                #     $secsipid(val) = signed JWT and $secsipid(ret) = libsecsipid
                #     return (>=0 success). Check ret and FAIL OPEN on error.
                if (secsipid_sign("$var(stir_hdr)", "$var(stir_pl)", "STIR_KEY_PATH")) {
                    if ($secsipid(ret) >= 0) {
                        # (4) Append the div Identity in full form (compact JWT
                        #     plus the SHAKEN info/alg/ppt params).
                        append_hf("Identity: $secsipid(val);info=<STIR_CERT_URL>;alg=ES256;ppt=div\r\n");
                        xlog("L_INFO", "STIR: signed div PASSporT (orig=$var(stir_orig) div=$var(stir_div_tn) dest=$var(stir_dest)) + preserved base Identity\n");
                    } else {
                        xlog("L_WARN", "STIR: secsipid_sign div returned $secsipid(ret) — relaying with base Identity only (fail-open)\n");
                    }
                } else {
                    xlog("L_WARN", "STIR: secsipid_sign div call failed — relaying with base Identity only (fail-open)\n");
                }
            } else {
                xlog("L_WARN", "STIR: div marked but no usable diverting/orig number (orig=$var(stir_orig) div=$var(stir_div_tn)) — relaying with base Identity only (no malformed div)\n");
            }
        } else {
            # Div requested (RCF forward) but the inbound call arrived UNSIGNED —
            # NO inbound Identity to chain. We cannot emit a bare div (RFC 8946),
            # so we sign a base PASSporT — but at attestation **C (Gateway)**, per
            # operator policy (Granite, 2026-08-05): the calling number is the
            # ORIGINAL PSTN caller, a number we neither own nor authenticated and
            # for which we hold NO inbound Identity — we are a pure re-originating
            # gateway. It MUST be C here, NEVER A/B (B would over-claim a partial-
            # attestation relationship with a caller we have no relationship with).
            # Gate on stir_orig_ok so we never sign orig.tn:"+".
            if ($var(stir_orig_ok) == 1) {
                if (secsipid_add_identity("$var(stir_orig)", "$var(stir_dest)", "C", "", "STIR_CERT_URL", "STIR_KEY_PATH")) {
                    # Effective outcome = C: the div→C gateway fallback (div
                    # requested, inbound unsigned, so a base PASSporT at attest C).
                    $var(stir_eff) = "C";
                    xlog("L_INFO", "STIR: div marked but inbound call UNSIGNED — signed base PASSporT attest=C (gateway, no bare div)\n");
                } else {
                    xlog("L_WARN", "STIR: base sign (div-no-base, attest=C) failed — relaying unsigned (fail-open)\n");
                }
            } else {
                xlog("L_WARN", "STIR: div marked, inbound UNSIGNED, and no usable calling number (orig=$var(stir_orig)) — relaying unsigned (fail-open, no orig.tn:+)\n");
            }
        }
    } else {
        # ---- Trunk / API base SHAKEN PASSporT (attest A or B) ----
        # secsipid_add_identity(origTN, destTN, attest, origID, x5u, keyPath)
        # builds AND appends the full Identity header itself. Empty origID => the
        # module generates a UUID. Returns >=0 on success; FAIL OPEN otherwise.
        # 3rd arg is the VALIDATED level $var(stir_attest_base) (∈ {A,B,C}), never
        # the raw stir_attest. Gate on stir_orig_ok so we never sign orig.tn:"+".
        if ($var(stir_orig_ok) == 1) {
            if (secsipid_add_identity("$var(stir_orig)", "$var(stir_dest)", "$var(stir_attest_base)", "", "STIR_CERT_URL", "STIR_KEY_PATH")) {
                # Effective outcome = the validated base level actually signed
                # (A/B/C). $var(stir_attest_base) is already coerced to {A,B,C}.
                $var(stir_eff) = $var(stir_attest_base);
                xlog("L_INFO", "STIR: signed base PASSporT attest=$var(stir_attest_base) (orig=$var(stir_orig) dest=$var(stir_dest))\n");
            } else {
                xlog("L_WARN", "STIR: secsipid_add_identity failed for attest=$var(stir_attest_base) — relaying unsigned (fail-open)\n");
            }
        } else {
            xlog("L_WARN", "STIR: base sign skipped — no usable calling number (orig=$var(stir_orig)) — relaying unsigned (fail-open, no orig.tn:+)\n");
        }
    }
#!endif

    # Prometheus (T2): count the ACTUAL outbound attestation emitted on this
    # carrier-bound leg, labelled by the effective outcome + zone. $var(stir_eff)
    # was initialized "unsigned" above and set to the real value at each signing
    # success point inside the ifdef; with STIR_SHAKEN_SIGN OFF it stays
    # "unsigned" (truthful — nothing was signed), and any fail-open path also
    # leaves it "unsigned". attestation ∈ {A,B,C,div,unsigned} (closed set),
    # zone = SBC_ID. Pure metric — no effect on the relayed message; emitted here
    # (still in route[TO_CARRIER], before t_relay) so it counts once per attempt
    # to sign, exactly mirroring the trunk_cps emission point.
    prom_counter_inc("stir_attest_signed", "1", "$var(stir_eff)", "__SBC_ID__");

    # ====================================================================
    # Step 9: Relay to carrier
    # ====================================================================
    xlog("L_DBG", "Routing outbound to carrier: $ru From=$fu To=$tu CID=$ci\n");

    # Branch route for carrier-bound traffic (logging only).
    # FS Via is preserved -- see Step 4 comments above.
    t_on_branch("TO_CARRIER_BRANCH");
    t_on_failure("CARRIER_FAILURE");
    t_on_reply("REPLY_HANDLER");

    if (!t_relay()) {
        xlog("L_ERR", "Relay to carrier failed for $rm to $ru\n");
        sl_reply_error();
    }
    exit;
}

# Failure route for outbound carrier
# Uses flag 8 to ensure failover is attempted at most ONCE.
# Without this guard, re-registering t_on_failure("CARRIER_FAILURE")
# can create an infinite branch loop (primary -> secondary -> primary -> ...)
# until Kamailio hits "maximum number of branches exceeded".
failure_route[CARRIER_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }

    xlog("L_WARN", "Carrier delivery failed: $rs $rr to $ru (flags=$mf)\n");

    # Handle 422 Session Interval Too Small (RFC 4028 Section 7.4).
    # The carrier's Min-SE is higher than our Session-Expires. The 422
    # response MUST contain a Min-SE header with their minimum. Retry
    # with Session-Expires set to their Min-SE value.
    # In practice this should never happen — our Min-SE: 90 is the RFC
    # floor, so no compliant carrier should reject it. But handle it
    # defensively for robustness.
    if (t_check_status("422")) {
        xlog("L_WARN", "Carrier sent 422 Session Interval Too Small, retrying with carrier's Min-SE\n");
        # The carrier's 422 contains Min-SE with their minimum. We can't
        # easily parse the integer, so just raise to a safe high value.
        # Remove our session timer headers and re-add with a higher value.
        remove_hf("Session-Expires");
        remove_hf("Min-SE");
        append_hf("Session-Expires: 3600;refresher=uac\r\n");
        append_hf("Min-SE: 900\r\n");
        t_relay();
        exit;
    }

    # Only attempt failover once (flag 8 = carrier failover already tried)
    #
    # TABLE-DRIVEN (X-Carrier-IP) CALLS NEVER FLIP HERE: route[TO_CARRIER]
    # pre-sets flags 8 AND 9 for validated X-Carrier-IP egress, so both the
    # in-trunk flip below and the cross-trunk TC4 fallback are skipped —
    # FreeSWITCH's carrier_trunks attempt loop owns ALL carrier failover
    # for those calls (two failover owners would double-dial the callee).
    # The 422 retry above ran BEFORE the flag checks and still applies.
    # Legacy X-Carrier calls (trunk/API + FS fallback mode) arrive with
    # both flags clear and get the historical behavior below, unchanged.
    #
    # Failover logic per trunk config:
    #   TC4: Dallas (IP_1) <-> LA (IP_2)
    #   TC1: NY <-> Atlanta
    #   TC2: Dallas <-> LA
    # If both IPs in a trunk config fail, cross-trunk failover to TC4 Dallas
    # as the final fallback (flag 9 prevents infinite cross-trunk loops).
    if (!isflagset(8) && t_check_status("500|503|408|480|404")) {
        setflag(8);

        # TC4 failover: Dallas <-> LA
        if ($rd == BANDWIDTH_IP_1) {
            $rd = BANDWIDTH_IP_2;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_IP_2 + ":5060";
            xlog("L_WARN", "TC4 failover Dallas->LA: $du\n");
        } else if ($rd == BANDWIDTH_IP_2) {
            $rd = BANDWIDTH_IP_1;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_IP_1 + ":5060";
            xlog("L_WARN", "TC4 failover LA->Dallas: $du\n");

        # TC1 failover: NY <-> Atlanta
        } else if ($rd == BANDWIDTH_TC1_NY) {
            $rd = BANDWIDTH_TC1_ATL;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_TC1_ATL + ":5060";
            xlog("L_WARN", "TC1 failover NY->Atlanta: $du\n");
        } else if ($rd == BANDWIDTH_TC1_ATL) {
            $rd = BANDWIDTH_TC1_NY;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_TC1_NY + ":5060";
            xlog("L_WARN", "TC1 failover Atlanta->NY: $du\n");

        # TC2 failover: Dallas <-> LA
        } else if ($rd == BANDWIDTH_TC2_DAL) {
            $rd = BANDWIDTH_TC2_LA;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_TC2_LA + ":5060";
            xlog("L_WARN", "TC2 failover Dallas->LA: $du\n");
        } else if ($rd == BANDWIDTH_TC2_LA) {
            $rd = BANDWIDTH_TC2_DAL;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_TC2_DAL + ":5060";
            xlog("L_WARN", "TC2 failover LA->Dallas: $du\n");

        # Unknown IP — fall back to TC4 Dallas
        } else {
            $rd = BANDWIDTH_IP_1;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_IP_1 + ":5060";
            xlog("L_WARN", "Unknown carrier IP, failover to TC4 Dallas: $du\n");
        }
        # Do NOT re-register t_on_failure — flag 8 prevents re-entry,
        # but avoiding re-registration is defense-in-depth.
        t_on_failure("CARRIER_FAILURE");
        t_relay();
        exit;
    }

    # Cross-trunk failover: if both IPs in the original trunk config failed
    # (flag 8 set, we're here again), try TC4 Dallas as last resort.
    # Flag 9 prevents infinite cross-trunk loops.
    if (isflagset(8) && !isflagset(9) && t_check_status("500|503|408|480|404")) {
        # Only cross-trunk failover if we're NOT already on TC4
        if ($rd != BANDWIDTH_IP_1 && $rd != BANDWIDTH_IP_2) {
            setflag(9);
            $rd = BANDWIDTH_IP_1;
            $rp = 5060;
            $du = "sip:" + BANDWIDTH_IP_1 + ":5060";
            xlog("L_WARN", "Cross-trunk failover to TC4 Dallas: $du\n");
            t_on_failure("CARRIER_FAILURE");
            t_relay();
            exit;
        }
    }

    xlog("L_ERR", "All carrier endpoints failed for $ru (status=$rs)\n");
}

# Relay route - send the request (used for inbound/generic traffic)
# Carrier-bound traffic from TO_CARRIER uses t_relay() directly with
# its own branch/failure/reply routes, so this route is only used for
# inbound (Bandwidth->FS) and other non-carrier relay paths.
route[RELAY] {
    if (is_method("INVITE")) {
        # Set branch failure handling
        t_on_branch("BRANCH_FAILURE");
        t_on_reply("REPLY_HANDLER");
    }

    if (!t_relay()) {
        xlog("L_ERR", "Relay failed for $rm to $ru\n");
        sl_reply_error();
    }
    exit;
}

# Reply handling
# CRITICAL: Do NOT blindly call fix_nated_contact() on all replies.
# FreeSWITCH uses host networking (replies arrive from 127.0.0.1) and
# its Contact already contains the public IP via ext-sip-ip. fix_nated_contact()
# would overwrite that with the packet's source IP, breaking in-dialog routing.
#
# The per-transaction onreply_route[REPLY_HANDLER] handles Contact rewriting
# for FS-originated replies heading to Bandwidth (replaces FS's Contact with
# Kamailio's address to maintain topology hiding).
reply_route {
    # Per-reply logging (L_DBG: fires on EVERY reply — too hot for L_INFO)
    xlog("L_DBG", "<<< $rs $rr for $rm\n");

    # HEP capture — stateless replies ONLY.
    #
    # Replies that match a local transaction are already traced exactly once
    # by the siptrace tm callbacks armed in request_route (TMCB_RESPONSE_IN
    # for received replies, TMCB_RESPONSE_SENT for relayed ones). Calling
    # sip_trace() unconditionally here stored every received reply TWICE
    # (identical node-100 duplicate rows, tens of µs apart, in the ladder).
    #
    # The only reply class tm cannot see is a STATELESS-forwarded reply:
    # no local transaction exists, e.g. when the NLB 5-tuple hash delivers a
    # carrier reply to the SBC that did NOT handle the request and Kamailio
    # core forwards it by Via. Trace exactly that residue here.
    #
    # Intentional side effect: 200s to dispatcher's OWN OPTIONS keepalives
    # (local tm transactions, flag 22 never set on them) are no longer
    # traced — they were ~1 HEP row/sec/SBC of pure noise in Homer.
    if (!t_check_trans()) {
        sip_trace();
    }

    # Do NOT call fix_nated_contact() here. FreeSWITCH sets correct public
    # IPs via ext-sip-ip. The onreply_route[REPLY_HANDLER] handles any
    # necessary SDP/Contact rewriting for carrier-bound replies.

    # Drop late 100 Trying (unnecessary network traffic)
    if (status == "100" && $T(id_label) != $null) {
        drop;
        exit;
    }
}

# Branch failure handler (generic, used by route[RELAY] for non-carrier traffic)
branch_route[BRANCH_FAILURE] {
    xlog("L_DEBUG", "Branch to $ru\n");
}

# Branch route for carrier-bound outbound traffic (from TO_CARRIER)
#
# This executes per-branch right before the message is forwarded to Bandwidth.
# At this point, Kamailio's tm module has constructed the outbound message
# with Kamailio's Via on top and FS's Via below (two Vias, valid RFC 3261).
# We intentionally do NOT strip FS's Via -- see Step 4 comments in TO_CARRIER.
branch_route[TO_CARRIER_BRANCH] {
    xlog("L_DEBUG", "Carrier branch to $ru\n");
}

# Reply handler for INVITE (initial and re-INVITE)
# Handles 180 Ringing, 183 Session Progress (early media), and 200 OK.
#
# This fires for TWO directions:
#   1. FS replies heading to Bandwidth (outbound call setup + re-INVITE responses)
#   2. Bandwidth replies heading to FS (inbound re-INVITE responses)
#
# For FS-originated replies: Contact contains FS's external profile address
# (34.74.71.32:5090). With host networking, the old 172.28.* pattern never
# matched, so FS's Contact leaked through. We now unconditionally rewrite
# Contact on FS-originated replies to present Kamailio's identity.
#
# For Bandwidth-originated replies: Contact contains Bandwidth's address.
# No rewriting needed — just scrub SDP as defense-in-depth.
onreply_route[REPLY_HANDLER] {
    xlog("L_DBG", "Reply $rs for $rm from $si\n");

    # ================================================================
    # 183 SDP STRIPPING: Ensure SOA sees only ONE answer (the 200 OK)
    # ================================================================
    # Bandwidth sends identical SDP in both 183 Session Progress and
    # 200 OK on the B-leg (outbound from FS to Bandwidth). This causes
    # a fatal SOA conflict in FreeSWITCH:
    #
    #   With SOA enabled: SOA processes 183 SDP as the answer, then
    #   rejects 200 OK SDP as duplicate:
    #     "error processing SDP answer in 200 OK (200)"
    #   Result: B-leg media channel never activates → no audio.
    #
    #   With sip_enable_soa=false: SOA is bypassed entirely, FS never
    #   processes B-leg SDP at all → B-leg media channel never created
    #   → no audio.
    #
    #   With 200 OK SDP stripped (previous approach): SOA processes 183
    #   SDP but the 200 OK arrives without the definitive answer →
    #   sofia-sip can't finalize the session → proxy_media doesn't
    #   activate → no audio.
    #
    # Fix: Strip the SDP body from the 183 Session Progress ONLY.
    # Let the 200 OK pass through with SDP intact. This way:
    #   1. FS receives 183 without SDP → no SOA processing → sends
    #      180 Ringing to A-leg → plays local ringback tone
    #   2. FS receives 200 OK with SDP → SOA processes it as the FIRST
    #      and ONLY answer → no duplicate error
    #   3. proxy_media relay activates on the definitive 200 OK answer
    #   4. Local ringback stops, bridge connects, bidirectional audio
    #
    # This is standard SBC behavior (Oracle SBC, Ribbon SBC, Oasis
    # Networks all strip provisional SDP for B2BUA interop).
    #
    # Direction guard: Only applies to carrier replies (from Bandwidth
    # heading to FS), NOT to FS replies heading to Bandwidth. Carrier
    # replies come from non-internal IPs (not Docker, not localhost,
    # not GCE VPC).
    # ================================================================
    if (!route(IS_INTERNAL_SOURCE)) {
        # Reply from carrier (Bandwidth) heading to FreeSWITCH
        if (status == "183" && has_body("application/sdp")) {
            # Pass 183 SDP through to FS for PSTN early media (network ringback).
            # FS will relay Bandwidth's ringback audio to the caller via early media.
            # The SOA duplicate answer on the subsequent 200 OK is handled gracefully
            # in default media mode (no proxy_media) — media is already established
            # from the 183 and the 200 OK error is cosmetic.
            xlog("L_DBG", "PASS-183-SDP: Carrier 183 with SDP from $si — "
                "forwarding intact for PSTN early media/ringback\n");
        }
        # 200 OK with SDP: pass through untouched. This is the definitive
        # answer that SOA needs to set up the B-leg media channel and
        # activate proxy_media RTP relay.
        if (status == "200" && has_body("application/sdp")) {
            xlog("L_DBG", "PASS-200-SDP: Carrier 200 OK with SDP from $si — "
                "forwarding intact as definitive SOA answer\n");
        }
    }

    if (status =~ "^[12][0-9][0-9]$") {
        # Scrub private/internal IPs from SDP body.
        # Essential for ringback (183) and call audio (200 OK).
        #
        # CRITICAL: Use FS_PUBLIC_IP (FS VM's direct public IP) for SDP rewrites
        # on FS-originated replies, NOT ADVERTISE_IP (NLB VIP). RTP goes directly
        # between Bandwidth and FreeSWITCH — it does NOT traverse the NLB. If we
        # rewrote SDP c= lines to the NLB VIP, Bandwidth would send RTP to the
        # NLB which only forwards SIP (port 5060), causing total silence on calls.
        #
        # For carrier-originated replies (Bandwidth -> FS), the SDP contains
        # Bandwidth's media IP which doesn't match private IP patterns, so the
        # scrub is a no-op (correct behavior).
        if (has_body("application/sdp")) {
            if (route(IS_INTERNAL_SOURCE)) {
                # Reply from FS: replace private IPs with FS's actual public IP
                subst_body('/IN IP4 172\.28\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
                subst_body('/IN IP4 10\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
                subst_body('/IN IP4 127\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 FS_PUBLIC_IP/g');
                xlog("L_DBG", "SDP scrub on FS reply: private IPs -> FS_PUBLIC_IP\n");
            } else {
                # Reply from carrier: scrub as defense-in-depth (unlikely to match)
                subst_body('/IN IP4 172\.28\.[0-9]+\.[0-9]+/IN IP4 ADVERTISE_IP/g');
                subst_body('/IN IP4 10\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 ADVERTISE_IP/g');
                subst_body('/IN IP4 127\.[0-9]+\.[0-9]+\.[0-9]+/IN IP4 ADVERTISE_IP/g');
            }
        }

        # Topology-hide Contact in replies from FreeSWITCH.
        # With host networking, FS replies from 127.0.0.1 or 10.142.0.100.
        # FS's Contact will be sip:mod_sofia@34.74.71.32:5090 (external profile)
        # or sip:mod_sofia@34.74.71.32:5080 (internal profile). Either way,
        # we replace it with Kamailio's address so Bandwidth sends subsequent
        # in-dialog requests through us, not directly to FS.
        #
        # NOTE: Contact uses ADVERTISE_IP (NLB VIP) — this is correct because
        # Contact controls SIP signaling routing, which DOES go through the NLB.
        # Only SDP (RTP addressing) must use FS_PUBLIC_IP.
        if (route(IS_INTERNAL_SOURCE)) {
            remove_hf("Contact");
            append_hf("Contact: <sip:$fU@ADVERTISE_IP:5060;transport=udp>\r\n");
            xlog("L_DEBUG", "Topology-hid $rs reply from FS ($si): Contact rewritten to Kamailio\n");
        }

        # ================================================================
        # SESSION TIMER NORMALIZATION: Normalize to 1800 in ALL directions
        # ================================================================
        # Session-Expires must be normalized on ALL replies passing through
        # Kamailio, regardless of direction:
        #
        # Direction 1 — Carrier replies heading to FS (B-leg 200 OK):
        #   Bandwidth sometimes sends Session-Expires: 30 (below RFC min
        #   of 90). FS has minimum-session-expires=90, silently ignores
        #   values below that, never sets up refresh timer, and the carrier
        #   kills the call when its 30s timer expires with no refresh.
        #
        # Direction 2 — FS replies heading to Bandwidth (A-leg 200 OK):
        #   Bandwidth's inbound INVITE may propose Session-Expires: 120.
        #   FS negotiates this down (120 > minimum 90, so FS accepts it).
        #   FS sends 200 OK with Session-Expires: 120;refresher=uas.
        #   This is dangerously low — if either side misses a single
        #   refresh, the call drops. Normalize to 1800 for safety.
        #
        # By normalizing in both directions, we ensure:
        #   - FS always sees Session-Expires: 1800 from carrier replies
        #   - Bandwidth always sees Session-Expires: 1800 from FS replies
        #   - Both sides refresh at ~900s intervals (well within tolerance)
        if (is_present_hf("Session-Expires")) {
            # L_DBG: fires on essentially every answered call (normalization
            # is routine). The anomaly it guards against (carrier sending
            # Session-Expires below 90) is handled identically either way.
            xlog("L_DBG", "Session timer in $rs from $si: Session-Expires=$hdr(Session-Expires) — normalizing to 1800\n");
            remove_hf("Session-Expires");
            append_hf("Session-Expires: 1800;refresher=uac\r\n");
        }
        # Ensure Min-SE is present
        if (!is_present_hf("Min-SE")) {
            append_hf("Min-SE: 90\r\n");
        }
        # Log if carrier requires timer (informational)
        if (is_present_hf("Require")) {
            if ($hdr(Require) =~ "timer") {
                xlog("L_DBG", "Carrier requires session timers: Require: $hdr(Require)\n");
            }
        }
    }
}

# Failure route for dispatcher failover
failure_route[DISPATCH_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }

    # Log the failure
    xlog("L_WARN", "Dispatch failed: $rs $rr\n");

    # Check if we should failover
    if (t_check_status("500|503|408")) {
        # Try next FreeSWITCH
        if (ds_next_dst()) {
            xlog("L_WARN", "Failover to $du\n");

            # Mark the failed destination as probing
            ds_mark_dst("p");

#!ifdef FS_HA_PAIR
            # The call is being RESCUED onto the other media node (setup
            # caught in the probe-detection window, or standby-side failure)
            # — update the dialog's node record so in-dialog routing on this
            # (owning) SBC follows the node that actually holds the call.
            # The Record-Route ;fsn= marker already on the wire still shows
            # the pre-rescue prediction; the $dlg_var(fs_node) tier outranks
            # it in TO_FS_INDIALOG (see the marker contract at the A-leg
            # preset).
            if (is_method("INVITE")) {
                if ($du == "sip:__FS_IP_2__:5080") {
                    $dlg_var(fs_node) = "2";
                } else {
                    $dlg_var(fs_node) = "1";
                }
            }
#!endif

            t_on_failure("DISPATCH_FAILURE");
            t_relay();
            exit;
        }
    }

    # No more destinations or non-recoverable error
    xlog("L_ERR", "All FreeSWITCH instances failed\n");

    # Return appropriate error to caller
    if (t_check_status("4[0-9][0-9]")) {
        # 4xx - client error, pass through
        exit;
    }

    send_reply("503", "Service Unavailable");
}

# Failure route for trunk inbound delivery to customer PBX
failure_route[TRUNK_DELIVERY_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
    xlog("L_ERR", "Trunk delivery to PBX failed: $rs $rr\n");
    send_reply("503", "Service Unavailable - PBX Unreachable");
}

# ----------------------------------------------------------------------------
# Dispatcher carrier up/down transition events (read by the carrier-monitor
# sidecar for event-driven acceleration — see the "dsmon" htable above).
#
# In Kamailio 5.8 the dispatcher module raises these two events AUTOMATICALLY
# whenever a destination changes reachability state — SOLELY by virtue of the
# event_route blocks being defined here. There is NO modparam to enable them
# (the `ds_events` parameter does not exist in the 5.8 dispatcher module; it
# was introduced in a later series). Do NOT add `modparam("dispatcher",
# "ds_events", ...)` — an unknown modparam aborts Kamailio at startup.
#
# Each transition bumps the monotonic "gen" counter in the dsmon htable. The
# first bump on a fresh key coerces $null->0 then +1 = 1 (same null-arithmetic
# the bw_cps/ipreputation counters already rely on), and htable:mod-init below
# seeds it to 0 so a reader sees a definite value even before the first flap.
#
# These routes are deliberately minimal: one htable increment + one xlog. They
# run in the dispatcher's timer/worker context (NOT the SIP request path) and
# never touch the message, so they cannot delay or corrupt call signaling. The
# destination that transitioned is available as $du (per the dispatcher module's
# own event_route example). Kept at L_NOTICE so a carrier flap is visible in the
# normal log stream (debug=2) without needing to raise the debug level.
# DESTINATION PV IN THESE EVENT ROUTES — $ru, NOT $du (verified against 5.8
# source; this corrected a latent bug):
#   Probe-driven transitions (the ONLY transition source in this config — no
#   script path calls ds_mark_dst("i"/"a")) reach ds_update_state with
#   msg=NULL (ds_options_callback, dispatch.c:3823 fmsg=NULL; send-failure
#   path dispatch.c:3987-4001), so ds_run_route builds a FAKED msg and puts
#   the destination URI in new_uri — i.e. $ru (dispatch.c:3300-3306
#   `fmsg->new_uri = *uri`). The faked msg's dst_uri is never populated
#   (core/fmsg.c:59-86 memset + parse only), so `$du` is $null there and the
#   old `$du =~ ":5080"` match NEVER fired on a real probe-detected FS death
#   — fs_up stayed at its seeded 1 and the FS-aware drain never engaged. The
#   official 5.8 dispatcher docs' own event examples read $ru
#   (doc/dispatcher_admin.xml "Destination up: $rm $ru"). $du is kept as a
#   second disjunct for completeness: it IS populated when a transition is
#   triggered from a real-message context (script ds_mark_dst with state
#   "i"/"a" — none today, but harmless to cover).
#   DETECTION WINDOW with the current settings (ds_ping_interval=5,
#   ds_probing_threshold=3, tm fr_timer=30000): a SILENTLY dead FS (UDP
#   blackhole — dead VM or stopped container; unconnected UDP sockets ignore
#   ICMP errors) fails each OPTIONS probe at the 30s fr_timer, probes are
#   pipelined every 5s, so the 3rd failed callback lands ~40-45s after death.
#   An FS that still ANSWERS with a non-accepted code (not 2xx/404/405/480)
#   fails probes immediately -> ~10-15s. Recovery: 3 successful probes
#   (ds_inactive_threshold) -> ACTIVE ~10-15s after FS answers again.
event_route[dispatcher:dst-up] {
    $sht(dsmon=>gen) = $sht(dsmon=>gen) + 1;
    xlog("L_NOTICE", "dispatcher: destination UP $ru ($du) (dsmon gen=$sht(dsmon=>gen))\n");
    # FS-aware health: maintain the FS reachability flag(s) consumed by
    # GET /healthz and the SIP-honest OPTIONS handler. FreeSWITCH nodes are
    # the ONLY dispatcher destinations on port :5080 (group 1); every carrier
    # keepalive destination (groups 2-7) is on :5060 — so a :5080 match can
    # never be a carrier flap. Purely a state mirror — it does not touch the
    # SIP message or influence routing.
#!ifdef FS_HA_PAIR
    # Per-node flags + any-node aggregate. FS-1/FS-2 URIs are distinct by
    # construction (entrypoint treats set-but-equal FREESWITCH_IP_2 as unset).
    if ($ru == "sip:__FS_IP__:5080" || $du == "sip:__FS_IP__:5080") {
        $sht(fshealth=>fs1_up) = 1;
        $sht(fshealth=>fs_up) = 1;
        xlog("L_NOTICE", "FS-aware health: ACTIVE media node FS-1 UP (__FS_IP__) — new calls fail back to FS-1; zone HEALTHY\n");
    } else if ($ru == "sip:__FS_IP_2__:5080" || $du == "sip:__FS_IP_2__:5080") {
        $sht(fshealth=>fs2_up) = 1;
        $sht(fshealth=>fs_up) = 1;
        xlog("L_NOTICE", "FS-aware health: STANDBY media node FS-2 UP (__FS_IP_2__) — standby hot; zone HEALTHY\n");
    }
#!else
    if ($ru =~ ":5080" || $du =~ ":5080") {
        $sht(fshealth=>fs_up) = 1;
        xlog("L_NOTICE", "FS-aware health: local FreeSWITCH UP ($ru) -> zone advertises HEALTHY\n");
    }
#!endif
}

event_route[dispatcher:dst-down] {
    $sht(dsmon=>gen) = $sht(dsmon=>gen) + 1;
    xlog("L_NOTICE", "dispatcher: destination DOWN $ru ($du) (dsmon gen=$sht(dsmon=>gen))\n");
    # FS-aware health: an FS node went unreachable (see the dst-up note for
    # why :5080 isolates FS from carrier destinations, and the block comment
    # above for why $ru carries the destination). Zone drain semantics:
    # GET /healthz 503 + OPTIONS-503 fire ONLY when the AGGREGATE fs_up
    # drops, i.e. when ALL media nodes are down. A single-node death with a
    # healthy standby must NOT drain the zone — the standby takes all new
    # calls (that is the entire point of the pair). A fully-dead zone cannot
    # be drained by the NLB HTTP health check alone: GCP external passthrough
    # NLBs FAIL OPEN (when ALL backends are unhealthy they still receive
    # traffic) — so the both-dead drain MUST come from the carrier/DNS layer
    # that reads this flag (unchanged single-FS zone-dark chain).
#!ifdef FS_HA_PAIR
    if ($ru == "sip:__FS_IP__:5080" || $du == "sip:__FS_IP__:5080") {
        $sht(fshealth=>fs1_up) = 0;
        if ($sht(fshealth=>fs2_up) == 1) {
            xlog("L_WARN", "FS-aware health: ACTIVE media node FS-1 DOWN (__FS_IP__) — hot standby FS-2 now takes ALL new calls; zone stays HEALTHY (fs_up=1)\n");
        } else {
            $sht(fshealth=>fs_up) = 0;
            xlog("L_WARN", "FS-aware health: BOTH media nodes DOWN (FS-1 down, FS-2 already down) -> zone advertises UNHEALTHY (drains via carrier/DNS)\n");
        }
    } else if ($ru == "sip:__FS_IP_2__:5080" || $du == "sip:__FS_IP_2__:5080") {
        $sht(fshealth=>fs2_up) = 0;
        if ($sht(fshealth=>fs1_up) == 1) {
            xlog("L_WARN", "FS-aware health: STANDBY media node FS-2 DOWN (__FS_IP_2__) — active FS-1 unaffected; zone stays HEALTHY (fs_up=1). Standby loss = NO redundancy until FS-2 recovers\n");
        } else {
            $sht(fshealth=>fs_up) = 0;
            xlog("L_WARN", "FS-aware health: BOTH media nodes DOWN (FS-2 down, FS-1 already down) -> zone advertises UNHEALTHY (drains via carrier/DNS)\n");
        }
    }
#!else
    if ($ru =~ ":5080" || $du =~ ":5080") {
        $sht(fshealth=>fs_up) = 0;
        xlog("L_WARN", "FS-aware health: local FreeSWITCH DOWN ($ru) -> zone advertises UNHEALTHY (drains via carrier/DNS)\n");
    }
#!endif
}

# Event route for dialog end
event_route[dialog:end] {
    # L_DBG: fires once per call — CDRs are the system of record for call
    # accounting (FreeSWITCH mod_json_cdr), this is only a debug breadcrumb.
    xlog("L_DBG", "Dialog ended: $ci duration=$DLG_lifetime\n");
}

# Stats route for monitoring
event_route[htable:mod-init] {
    # Seed the dispatcher-event generation counter so the carrier-monitor
    # sidecar reads a definite `value: 0` from `htable.get dsmon gen` from the
    # very first probe (before any carrier has flapped), instead of a $null /
    # missing key. This makes the reader's "unchanged since startup" state
    # unambiguous and identical in shape to the post-transition reads.
    $sht(dsmon=>gen) = 0;
    # FS-aware health: seed the FS reachability flag(s) OPTIMISTICALLY (1 =
    # healthy). During the brief window between process start and dispatcher's
    # first probe cycle we must NOT advertise the zone as down — a healthy SBC
    # whose FS is fine would otherwise 503 /healthz and OPTIONS and drain itself
    # out of rotation on every restart. If FS is genuinely dead, the probe
    # cycle flips this to 0 via event_route[dispatcher:dst-down] within the
    # detection window (~10-15s for an FS answering with a non-accepted code;
    # ~40-45s for a silent UDP blackhole, bounded by tm fr_timer=30s — see the
    # detection-window note above the event routes).
    $sht(fshealth=>fs_up) = 1;
#!ifdef FS_HA_PAIR
    # Per-node seeds, same optimistic rationale. Also makes the A-leg ;fsn=
    # marker prediction start at FS-1 (fs1_up=1) — matching what alg 8 will
    # select until dispatcher learns otherwise.
    $sht(fshealth=>fs1_up) = 1;
    $sht(fshealth=>fs2_up) = 1;
#!endif
    xlog("L_INFO", "Hash tables initialized (dsmon gen=0, fshealth fs_up=1)\n");
}
